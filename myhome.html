<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="식품관리" />
  <title>식품 · 용품 관리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #0F1117; font-family: 'Noto Sans KR', sans-serif; }
    ::-webkit-scrollbar { display: none; }
    input, select, textarea { font-family: 'Noto Sans KR', sans-serif; }
    .item-card { transition: transform 0.15s ease; }
    .item-card:active { transform: scale(0.97); }
    .cat-btn { transition: all 0.2s ease; }
    .fab { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .fab:active { transform: scale(0.92) !important; }
    .qty-btn:active { transform: scale(0.88); }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes toastIn { from { transform: translateX(-50%) translateY(20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CATEGORIES = [
      { id: "fridge",     label: "냉장",    emoji: "🧊", color: "#4FC3F7" },
      { id: "freezer",    label: "냉동",    emoji: "❄️", color: "#90CAF9" },
      { id: "room",       label: "실온보관", emoji: "🌿", color: "#81C784" },
      { id: "supplement", label: "영양제",  emoji: "💊", color: "#FFB74D" },
      { id: "living",     label: "생활용품", emoji: "🧴", color: "#CE93D8" },
    ];

    const UNITS = ["개", "병", "봉지", "캔", "g", "ml", "L", "kg", "정", "세트", "장", "롤"];

    const DEFAULT_ITEMS = [
      { id: 1, name: "우유",    category: "fridge",     quantity: 1,  unit: "병",  purchaseDate: "2026-04-20", expiryDate: "2026-05-01", memo: "" },
      { id: 2, name: "냉동만두", category: "freezer",    quantity: 1,  unit: "봉지", purchaseDate: "2026-04-15", expiryDate: "2026-10-15", memo: "" },
      { id: 3, name: "비타민C", category: "supplement", quantity: 60, unit: "정",  purchaseDate: "2026-04-01", expiryDate: "2027-04-01", memo: "아침 식후 1정" },
      { id: 4, name: "세탁세제", category: "living",     quantity: 1,  unit: "개",  purchaseDate: "2026-03-15", expiryDate: "2028-03-15", memo: "" },
    ];

    function daysUntilExpiry(expiryDate) {
      if (!expiryDate) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const expiry = new Date(expiryDate);
      return Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));
    }

    function ExpiryBadge({ days }) {
      if (days === null) return null;
      let bg, color, label;
      if (days < 0)       { bg = "#EF5350"; color = "#fff"; label = "만료됨"; }
      else if (days === 0){ bg = "#EF5350"; color = "#fff"; label = "오늘 만료"; }
      else if (days <= 3) { bg = "#FF7043"; color = "#fff"; label = `D-${days}`; }
      else if (days <= 7) { bg = "#FFB300"; color = "#fff"; label = `D-${days}`; }
      else if (days <= 30){ bg = "#66BB6A"; color = "#fff"; label = `D-${days}`; }
      else                { bg = "rgba(255,255,255,0.12)"; color = "rgba(255,255,255,0.7)"; label = `D-${days}`; }
      return (
        <span style={{ background: bg, color, borderRadius: 20, padding: "2px 10px", fontSize: 11, fontWeight: 700, letterSpacing: 0.5, whiteSpace: "nowrap" }}>
          {label}
        </span>
      );
    }

    const SORT_OPTIONS = [
      { value: "expiry",   label: "유통기한 순" },
      { value: "name",     label: "이름 순" },
      { value: "purchase", label: "구입일 순" },
    ];

    function App() {
      const [items, setItems] = useState(() => {
        try {
          const saved = localStorage.getItem("pantry_items_v3");
          return saved ? JSON.parse(saved) : DEFAULT_ITEMS;
        } catch { return DEFAULT_ITEMS; }
      });
      const [activeCategory, setActiveCategory] = useState("all");
      const [showForm, setShowForm]   = useState(false);
      const [editItem, setEditItem]   = useState(null);
      const [search, setSearch]       = useState("");
      const [sortBy, setSortBy]       = useState("expiry");
      const [showDetail, setShowDetail] = useState(null);
      const [form, setForm] = useState({ name: "", category: "fridge", quantity: 1, unit: "개", purchaseDate: "", expiryDate: "", memo: "" });
      const [deleteConfirm, setDeleteConfirm] = useState(null);
      const [toast, setToast] = useState(null);
      const [showUrgent, setShowUrgent] = useState(false);
      const nextId = useRef(Math.max(...DEFAULT_ITEMS.map(i => i.id), 0) + 1);

      useEffect(() => {
        try { localStorage.setItem("pantry_items_v3", JSON.stringify(items)); } catch {}
      }, [items]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2000);
      };

      const openAdd = () => {
        const today = new Date().toISOString().split("T")[0];
        const cat = activeCategory === "all" ? "fridge" : activeCategory;
        setForm({ name: "", category: cat, quantity: 1, unit: "개", purchaseDate: today, expiryDate: "", memo: "" });
        setEditItem(null);
        setShowForm(true);
      };

      const openEdit = (item) => {
        setForm({ ...item });
        setEditItem(item.id);
        setShowForm(true);
        setShowDetail(null);
      };

      const saveForm = () => {
        if (!form.name.trim()) return;
        if (editItem !== null) {
          setItems(prev => prev.map(i => i.id === editItem ? { ...form, id: editItem } : i));
          showToast("수정되었어요 ✓");
        } else {
          const id = nextId.current++;
          setItems(prev => [...prev, { ...form, id }]);
          showToast("추가되었어요 ✓");
        }
        setShowForm(false);
      };

      const deleteItem = (id) => {
        setItems(prev => prev.filter(i => i.id !== id));
        setDeleteConfirm(null);
        setShowDetail(null);
        showToast("삭제되었어요");
      };

      const updateQty = (id, delta) => {
        setItems(prev => prev.map(i => i.id === id ? { ...i, quantity: Math.max(0, i.quantity + delta) } : i));
      };

      const filtered = items
        .filter(i => activeCategory === "all" || i.category === activeCategory)
        .filter(i => i.name.toLowerCase().includes(search.toLowerCase()))
        .sort((a, b) => {
          if (sortBy === "expiry") {
            const da = daysUntilExpiry(a.expiryDate) ?? 9999;
            const db = daysUntilExpiry(b.expiryDate) ?? 9999;
            return da - db;
          }
          if (sortBy === "name")     return a.name.localeCompare(b.name, "ko");
          if (sortBy === "purchase") return (b.purchaseDate || "").localeCompare(a.purchaseDate || "");
          return 0;
        });

      const urgentCount = items.filter(i => { const d = daysUntilExpiry(i.expiryDate); return d !== null && d <= 7; }).length;
      const urgentItems = items.filter(i => { const d = daysUntilExpiry(i.expiryDate); return d !== null && d <= 7; }).sort((a,b) => (daysUntilExpiry(a.expiryDate) ?? 9999) - (daysUntilExpiry(b.expiryDate) ?? 9999));
      const catCounts   = Object.fromEntries(CATEGORIES.map(c => [c.id, items.filter(i => i.category === c.id).length]));
      const detailItem  = showDetail ? items.find(i => i.id === showDetail) : null;

      const wrap = { minHeight: "100vh", background: "#0F1117", color: "#F0F0F0", fontFamily: "'Noto Sans KR', sans-serif", maxWidth: 430, margin: "0 auto", position: "relative", overflowX: "hidden" };

      return (
        <div style={wrap}>

          {/* ── Header ── */}
          <div style={{ padding: "56px 20px 16px", background: "linear-gradient(180deg,#1A1D27 0%,#0F1117 100%)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontSize: 11, letterSpacing: 3, color: "#888", textTransform: "uppercase", marginBottom: 4 }}>My Home</div>
                <div style={{ fontSize: 26, fontWeight: 900, letterSpacing: -1 }}>식품 · 용품 관리</div>
              </div>
              {urgentCount > 0 && (
                <button onClick={() => setShowUrgent(true)}
                  style={{ background: "#EF5350", borderRadius: 12, padding: "6px 12px", fontSize: 12, fontWeight: 700, lineHeight: 1.3, textAlign: "center", border: "none", cursor: "pointer", color: "#fff" }}>
                  ⚠️ {urgentCount}개<br /><span style={{ fontSize: 10, fontWeight: 400 }}>곧 만료 →</span>
                </button>
              )}
            </div>
            <div style={{ marginTop: 16, position: "relative" }}>
              <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", fontSize: 16, opacity: 0.5 }}>🔍</span>
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="검색..."
                style={{ width: "100%", background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 12, padding: "11px 14px 11px 40px", color: "#F0F0F0", fontSize: 14, outline: "none" }} />
            </div>
          </div>

          {/* ── Category Tabs ── */}
          <div style={{ padding: "0 16px 12px", overflowX: "auto", display: "flex", gap: 8 }}>
            <button onClick={() => setActiveCategory("all")} className="cat-btn"
              style={{ flexShrink: 0, padding: "8px 16px", borderRadius: 20, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 700, background: activeCategory === "all" ? "#F0F0F0" : "rgba(255,255,255,0.07)", color: activeCategory === "all" ? "#0F1117" : "#aaa" }}>
              전체 {items.length}
            </button>
            {CATEGORIES.map(cat => (
              <button key={cat.id} onClick={() => setActiveCategory(cat.id)} className="cat-btn"
                style={{ flexShrink: 0, padding: "8px 14px", borderRadius: 20, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 700, background: activeCategory === cat.id ? cat.color : "rgba(255,255,255,0.07)", color: activeCategory === cat.id ? "#fff" : "#aaa", display: "flex", alignItems: "center", gap: 5 }}>
                {cat.emoji} {cat.label} {catCounts[cat.id] || 0}
              </button>
            ))}
          </div>

          {/* ── Sort ── */}
          <div style={{ padding: "0 20px 12px", display: "flex", gap: 8 }}>
            {SORT_OPTIONS.map(opt => (
              <button key={opt.value} onClick={() => setSortBy(opt.value)}
                style={{ fontSize: 11, padding: "4px 10px", borderRadius: 10, border: "none", cursor: "pointer", background: sortBy === opt.value ? "rgba(255,255,255,0.2)" : "transparent", color: sortBy === opt.value ? "#fff" : "#666", fontWeight: sortBy === opt.value ? 700 : 400 }}>
                {opt.label}
              </button>
            ))}
          </div>

          {/* ── Items ── */}
          <div style={{ padding: "0 16px 100px", display: "flex", flexDirection: "column", gap: 10 }}>
            {filtered.length === 0 && (
              <div style={{ textAlign: "center", padding: "60px 0", color: "#555" }}>
                <div style={{ fontSize: 40, marginBottom: 12 }}>📦</div>
                <div style={{ fontSize: 14 }}>항목이 없어요</div>
                <div style={{ fontSize: 12, marginTop: 4 }}>+ 버튼으로 추가해보세요</div>
              </div>
            )}
            {filtered.map(item => {
              const cat = CATEGORIES.find(c => c.id === item.category);
              const days = daysUntilExpiry(item.expiryDate);
              const isUrgent = days !== null && days <= 3;
              return (
                <div key={item.id} className="item-card" onClick={() => setShowDetail(item.id)}
                  style={{ background: isUrgent ? "rgba(239,83,80,0.1)" : "rgba(255,255,255,0.05)", border: isUrgent ? "1px solid rgba(239,83,80,0.3)" : "1px solid rgba(255,255,255,0.07)", borderRadius: 16, padding: "14px 16px", cursor: "pointer", display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ width: 44, height: 44, borderRadius: 12, background: `${cat?.color}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, flexShrink: 0 }}>
                    {cat?.emoji}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                      <span style={{ fontWeight: 700, fontSize: 15 }}>{item.name}</span>
                      <ExpiryBadge days={days} />
                    </div>
                    <div style={{ fontSize: 11, color: "#888", marginTop: 3 }}>
                      {item.expiryDate ? `유통기한 ${item.expiryDate}` : "유통기한 미입력"}
                    </div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                    <button className="qty-btn" onClick={e => { e.stopPropagation(); updateQty(item.id, -1); }}
                      style={{ width: 28, height: 28, borderRadius: 8, border: "1px solid rgba(255,255,255,0.15)", background: "transparent", color: "#fff", fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
                    <span style={{ minWidth: 32, textAlign: "center", fontWeight: 700, fontSize: 14 }}>{item.quantity}<span style={{ fontSize: 10, fontWeight: 400, marginLeft: 2 }}>{item.unit}</span></span>
                    <button className="qty-btn" onClick={e => { e.stopPropagation(); updateQty(item.id, 1); }}
                      style={{ width: 28, height: 28, borderRadius: 8, border: "1px solid rgba(255,255,255,0.15)", background: "transparent", color: "#fff", fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
                  </div>
                </div>
              );
            })}
          </div>

          {/* ── FAB ── */}
          <button onClick={openAdd} className="fab"
            style={{ position: "fixed", bottom: 32, right: 20, width: 58, height: 58, borderRadius: 18, background: "linear-gradient(135deg,#4FC3F7,#7C4DFF)", border: "none", color: "#fff", fontSize: 28, cursor: "pointer", boxShadow: "0 8px 32px rgba(79,195,247,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 }}>
            +
          </button>

          {/* ── Detail Sheet ── */}
          {detailItem && (
            <div style={{ position: "fixed", inset: 0, zIndex: 100, animation: "fadeIn 0.2s ease" }} onClick={() => setShowDetail(null)}>
              <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.6)", backdropFilter: "blur(4px)" }} />
              <div onClick={e => e.stopPropagation()}
                style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: "#1A1D27", borderRadius: "24px 24px 0 0", padding: "24px 20px 48px", animation: "slideUp 0.3s ease" }}>
                <div style={{ width: 40, height: 4, background: "rgba(255,255,255,0.2)", borderRadius: 2, margin: "0 auto 20px" }} />
                {(() => {
                  const cat  = CATEGORIES.find(c => c.id === detailItem.category);
                  const days = daysUntilExpiry(detailItem.expiryDate);
                  return (
                    <>
                      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
                        <div style={{ width: 52, height: 52, borderRadius: 14, background: `${cat?.color}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26 }}>{cat?.emoji}</div>
                        <div>
                          <div style={{ fontSize: 20, fontWeight: 900 }}>{detailItem.name}</div>
                          <div style={{ fontSize: 12, color: "#888", marginTop: 2 }}>{cat?.label}</div>
                        </div>
                        <div style={{ marginLeft: "auto" }}><ExpiryBadge days={days} /></div>
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
                        {[
                          { label: "수량",     value: `${detailItem.quantity} ${detailItem.unit}` },
                          { label: "유통기한",  value: detailItem.expiryDate || "-" },
                          { label: "구입일",   value: detailItem.purchaseDate || "-" },
                          { label: "남은 일수", value: days !== null ? (days < 0 ? "만료됨" : days === 0 ? "오늘" : `${days}일`) : "-" },
                        ].map(({ label, value }) => (
                          <div key={label} style={{ background: "rgba(255,255,255,0.05)", borderRadius: 12, padding: "12px 14px" }}>
                            <div style={{ fontSize: 10, color: "#666", marginBottom: 4, textTransform: "uppercase", letterSpacing: 1 }}>{label}</div>
                            <div style={{ fontSize: 15, fontWeight: 700 }}>{value}</div>
                          </div>
                        ))}
                      </div>
                      {detailItem.memo && (
                        <div style={{ background: "rgba(255,255,255,0.05)", borderRadius: 12, padding: "12px 14px", marginBottom: 16, fontSize: 13, color: "#bbb" }}>
                          📝 {detailItem.memo}
                        </div>
                      )}
                      <div style={{ display: "flex", gap: 10 }}>
                        <button onClick={() => openEdit(detailItem)}
                          style={{ flex: 1, padding: "14px", borderRadius: 14, border: "none", background: "rgba(255,255,255,0.1)", color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>✏️ 수정</button>
                        <button onClick={() => setDeleteConfirm(detailItem.id)}
                          style={{ flex: 1, padding: "14px", borderRadius: 14, border: "none", background: "rgba(239,83,80,0.2)", color: "#EF5350", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>🗑 삭제</button>
                      </div>
                    </>
                  );
                })()}
              </div>
            </div>
          )}

          {/* ── Add / Edit Form ── */}
          {showForm && (
            <div style={{ position: "fixed", inset: 0, zIndex: 200, animation: "fadeIn 0.2s ease" }}>
              <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.7)", backdropFilter: "blur(4px)" }} onClick={() => setShowForm(false)} />
              <div onClick={e => e.stopPropagation()}
                style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: "#1A1D27", borderRadius: "24px 24px 0 0", padding: "24px 20px 48px", animation: "slideUp 0.3s ease", maxHeight: "92vh", overflowY: "auto" }}>
                <div style={{ width: 40, height: 4, background: "rgba(255,255,255,0.2)", borderRadius: 2, margin: "0 auto 20px" }} />
                <div style={{ fontSize: 18, fontWeight: 900, marginBottom: 20 }}>{editItem ? "수정하기" : "새 항목 추가"}</div>

                {/* 이름 */}
                <div style={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 11, color: "#888", marginBottom: 6, textTransform: "uppercase", letterSpacing: 1 }}>이름 *</div>
                  <input value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
                    placeholder="예) 달걀, 비타민C..."
                    style={{ width: "100%", background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 12, padding: "12px 14px", color: "#F0F0F0", fontSize: 15, outline: "none" }} />
                </div>

                {/* 카테고리 */}
                <div style={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 11, color: "#888", marginBottom: 8, textTransform: "uppercase", letterSpacing: 1 }}>카테고리</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
                    {CATEGORIES.map(cat => (
                      <button key={cat.id} onClick={() => setForm(f => ({ ...f, category: cat.id }))}
                        style={{ padding: "10px 6px", borderRadius: 12, border: `2px solid ${form.category === cat.id ? cat.color : "transparent"}`, background: form.category === cat.id ? `${cat.color}22` : "rgba(255,255,255,0.05)", color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                        {cat.emoji} {cat.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* 수량 + 단위 */}
                <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 10, marginBottom: 14 }}>
                  <div>
                    <div style={{ fontSize: 11, color: "#888", marginBottom: 6, textTransform: "uppercase", letterSpacing: 1 }}>수량</div>
                    <input value={form.quantity} onChange={e => setForm(f => ({ ...f, quantity: Number(e.target.value) || 0 }))}
                      type="number" min="0"
                      style={{ width: "100%", background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 12, padding: "12px 14px", color: "#F0F0F0", fontSize: 15, outline: "none" }} />
                  </div>
                  <div>
                    <div style={{ fontSize: 11, color: "#888", marginBottom: 6, textTransform: "uppercase", letterSpacing: 1 }}>단위</div>
                    <select value={form.unit} onChange={e => setForm(f => ({ ...f, unit: e.target.value }))}
                      style={{ width: "100%", background: "#1A1D27", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 12, padding: "12px 10px", color: "#F0F0F0", fontSize: 14, outline: "none" }}>
                      {UNITS.map(u => <option key={u} value={u}>{u}</option>)}
                    </select>
                  </div>
                </div>

                {/* 날짜 */}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
                  {[{ label: "구입일", key: "purchaseDate" }, { label: "유통기한", key: "expiryDate" }].map(({ label, key }) => (
                    <div key={key}>
                      <div style={{ fontSize: 11, color: "#888", marginBottom: 6, textTransform: "uppercase", letterSpacing: 1 }}>{label}</div>
                      <input value={form[key]} onChange={e => setForm(f => ({ ...f, [key]: e.target.value }))} type="date"
                        style={{ width: "100%", background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 12, padding: "12px 10px", color: "#F0F0F0", fontSize: 13, outline: "none" }} />
                    </div>
                  ))}
                </div>

                {/* 메모 */}
                <div style={{ marginBottom: 20 }}>
                  <div style={{ fontSize: 11, color: "#888", marginBottom: 6, textTransform: "uppercase", letterSpacing: 1 }}>메모</div>
                  <textarea value={form.memo} onChange={e => setForm(f => ({ ...f, memo: e.target.value }))}
                    placeholder="복용법, 주의사항 등..." rows={2}
                    style={{ width: "100%", background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 12, padding: "12px 14px", color: "#F0F0F0", fontSize: 14, outline: "none", resize: "none" }} />
                </div>

                <button onClick={saveForm}
                  style={{ width: "100%", padding: "16px", borderRadius: 16, border: "none", background: form.name.trim() ? "linear-gradient(135deg,#4FC3F7,#7C4DFF)" : "rgba(255,255,255,0.1)", color: form.name.trim() ? "#fff" : "#555", fontSize: 16, fontWeight: 900, cursor: form.name.trim() ? "pointer" : "default", letterSpacing: 0.5 }}>
                  {editItem ? "저장하기" : "추가하기"}
                </button>
              </div>
            </div>
          )}

          {/* ── Delete Confirm ── */}
          {deleteConfirm && (
            <div style={{ position: "fixed", inset: 0, zIndex: 300, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, animation: "fadeIn 0.15s ease" }}>
              <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.7)" }} onClick={() => setDeleteConfirm(null)} />
              <div onClick={e => e.stopPropagation()}
                style={{ position: "relative", background: "#1A1D27", borderRadius: 20, padding: 24, width: "100%", maxWidth: 320, textAlign: "center" }}>
                <div style={{ fontSize: 36, marginBottom: 12 }}>🗑</div>
                <div style={{ fontWeight: 900, fontSize: 17, marginBottom: 8 }}>삭제할까요?</div>
                <div style={{ color: "#888", fontSize: 13, marginBottom: 20 }}>이 항목이 완전히 삭제돼요</div>
                <div style={{ display: "flex", gap: 10 }}>
                  <button onClick={() => setDeleteConfirm(null)}
                    style={{ flex: 1, padding: "13px", borderRadius: 12, border: "none", background: "rgba(255,255,255,0.1)", color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>취소</button>
                  <button onClick={() => deleteItem(deleteConfirm)}
                    style={{ flex: 1, padding: "13px", borderRadius: 12, border: "none", background: "#EF5350", color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>삭제</button>
                </div>
              </div>
            </div>
          )}

          {/* ── Urgent Sheet ── */}
          {showUrgent && (
            <div style={{ position: "fixed", inset: 0, zIndex: 150, animation: "fadeIn 0.2s ease" }} onClick={() => setShowUrgent(false)}>
              <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.65)", backdropFilter: "blur(4px)" }} />
              <div onClick={e => e.stopPropagation()}
                style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: "#1A1D27", borderRadius: "24px 24px 0 0", padding: "24px 20px 48px", animation: "slideUp 0.3s ease", maxHeight: "80vh", overflowY: "auto" }}>
                <div style={{ width: 40, height: 4, background: "rgba(255,255,255,0.2)", borderRadius: 2, margin: "0 auto 20px" }} />
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20 }}>
                  <div style={{ fontSize: 22 }}>⚠️</div>
                  <div>
                    <div style={{ fontSize: 17, fontWeight: 900 }}>만료 임박 항목</div>
                    <div style={{ fontSize: 12, color: "#888", marginTop: 2 }}>7일 이내 만료되는 항목이에요</div>
                  </div>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {urgentItems.map(item => {
                    const cat  = CATEGORIES.find(c => c.id === item.category);
                    const days = daysUntilExpiry(item.expiryDate);
                    return (
                      <div key={item.id} onClick={() => { setShowUrgent(false); setShowDetail(item.id); }}
                        style={{ background: days <= 3 ? "rgba(239,83,80,0.12)" : "rgba(255,179,0,0.08)", border: `1px solid ${days <= 3 ? "rgba(239,83,80,0.3)" : "rgba(255,179,0,0.25)"}`, borderRadius: 14, padding: "14px 16px", cursor: "pointer", display: "flex", alignItems: "center", gap: 12 }}>
                        <div style={{ width: 42, height: 42, borderRadius: 12, background: `${cat?.color}22`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0 }}>
                          {cat?.emoji}
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontWeight: 700, fontSize: 15 }}>{item.name}</div>
                          <div style={{ fontSize: 11, color: "#888", marginTop: 2 }}>{cat?.label} · {item.quantity}{item.unit}</div>
                        </div>
                        <div style={{ flexShrink: 0, textAlign: "right" }}>
                          <ExpiryBadge days={days} />
                          <div style={{ fontSize: 10, color: "#666", marginTop: 4 }}>{item.expiryDate}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* ── Toast ── */}
          {toast && (
            <div style={{ position: "fixed", bottom: 100, left: "50%", transform: "translateX(-50%)", background: "rgba(255,255,255,0.12)", backdropFilter: "blur(10px)", borderRadius: 20, padding: "10px 20px", fontSize: 13, fontWeight: 700, whiteSpace: "nowrap", zIndex: 400, animation: "toastIn 0.2s ease", border: "1px solid rgba(255,255,255,0.15)" }}>
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
