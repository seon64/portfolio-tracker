<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>식사일기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --bg2: #161618;
    --bg3: #1e1e21;
    --surface: #242428;
    --surface2: #2e2e33;
    --border: #3a3a40;
    --text: #f0ede8;
    --text2: #a09a92;
    --text3: #6b6560;
    --accent: #e8c9a0;
    --accent2: #c9a87a;
    --accent-soft: rgba(232,201,160,0.12);
    --meal-morning: #7ec8a0;
    --meal-lunch: #e8a86a;
    --meal-dinner: #8ab4e8;
    --meal-snack: #d4a0d4;
    --meal-late: #e87a8a;
    --radius: 18px;
    --radius-sm: 10px;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }
  [data-theme="light"] {
    --bg: #f5f0ea;
    --bg2: #ede8e0;
    --bg3: #e4ddd4;
    --surface: #ffffff;
    --surface2: #f0ebe3;
    --border: #d8d0c4;
    --text: #1a1714;
    --text2: #6b6258;
    --text3: #9e9589;
    --accent: #8a6a3a;
    --accent2: #6a4e28;
    --accent-soft: rgba(138,106,58,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Serif KR', serif; overscroll-behavior: none; }

  /* ── APP SHELL ── */
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; position: relative; overflow: hidden; }

  /* ── TOP BAR ── */
  .topbar {
    padding: calc(var(--safe-top) + 16px) 20px 14px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: relative; z-index: 10;
  }
  .topbar-title { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; color: var(--text); }
  .topbar-sub { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 2px; }
  .topbar-right { display: flex; gap: 10px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text2); font-size: 16px; transition: all .2s;
  }
  .icon-btn:active { transform: scale(.92); background: var(--surface2); }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #4caf50; position: absolute; top: 8px; right: 8px; }
  .sync-dot.error { background: #f44336; }
  .sync-dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── TAB BAR ── */
  .tabbar {
    display: flex; background: var(--bg2); border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; padding: 10px 16px; font-size: 13px; font-family: 'Noto Serif KR';
    color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent;
    transition: all .2s; white-space: nowrap; display: flex; align-items: center; gap: 5px;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-dot { width: 5px; height: 5px; border-radius: 50%; }

  /* ── MAIN SCROLL ── */
  .main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .main::-webkit-scrollbar { display: none; }

  /* ── CALENDAR VIEW ── */
  #view-calendar { padding: 16px; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-month { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
  .cal-nav { display: flex; gap: 8px; }
  .cal-nav button {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); color: var(--text2); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .cal-nav button:active { background: var(--surface2); }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
  .cal-day-label { text-align: center; font-size: 10px; color: var(--text3); font-family: 'DM Mono'; padding: 6px 0; }
  .cal-day-label:first-child { color: #e87a8a; }
  .cal-day-label:last-child { color: #8ab4e8; }
  .cal-cell {
    aspect-ratio: 1; border-radius: var(--radius-sm); display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer; position: relative;
    transition: all .15s; gap: 3px;
  }
  .cal-cell:active { transform: scale(.9); }
  .cal-cell.empty { cursor: default; }
  .cal-cell.today .cal-num { background: var(--accent); color: var(--bg); border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .cal-cell.selected { background: var(--accent-soft); }
  .cal-cell.other-month .cal-num { color: var(--text3); opacity: .4; }
  .cal-num { font-size: 14px; font-weight: 500; }
  .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 28px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; }

  /* ── DAY DETAIL ── */
  .day-detail { margin-top: 16px; }
  .day-detail-header { font-size: 13px; color: var(--text3); font-family: 'DM Mono'; margin-bottom: 12px; letter-spacing: .5px; }
  .meal-cards { display: flex; flex-direction: column; gap: 10px; }
  .meal-card {
    background: var(--surface); border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--border); transition: all .2s;
  }
  .meal-card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; cursor: pointer;
  }
  .meal-card-left { display: flex; align-items: center; gap: 10px; }
  .meal-badge { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .meal-label { font-size: 13px; font-weight: 500; }
  .meal-count { font-size: 11px; color: var(--text3); font-family: 'DM Mono'; }
  .meal-add-btn {
    width: 28px; height: 28px; border-radius: 50%; border: 1px dashed var(--border);
    background: transparent; color: var(--text3); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .2s;
  }
  .meal-add-btn:active { border-color: var(--accent); color: var(--accent); }
  .meal-entries { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .entry-item { display: flex; gap: 10px; align-items: flex-start; }
  .entry-thumb {
    width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
    background: var(--surface2); display: flex; align-items: center; justify-content: center;
    color: var(--text3); font-size: 20px; border: 1px solid var(--border);
    overflow: hidden;
  }
  .entry-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .entry-text-wrap { flex: 1; }
  .entry-text { font-size: 13px; color: var(--text); line-height: 1.5; }
  .entry-time { font-size: 10px; color: var(--text3); font-family: 'DM Mono'; margin-top: 3px; }
  .entry-delete { width: 24px; height: 24px; border-radius: 50%; border: none; background: transparent; color: var(--text3); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* ── ADD ENTRY MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(8px);
    z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    width: 100%; background: var(--bg2); border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(var(--safe-bottom) + 20px);
    transform: translateY(100%); transition: transform .35s cubic-bezier(.25,.8,.25,1);
    border-top: 1px solid var(--border);
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 20px; }
  .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
  .modal-meal-select { display: flex; gap: 8px; margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .modal-meal-select::-webkit-scrollbar { display: none; }
  .meal-chip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 20px; font-size: 12px;
    border: 1px solid var(--border); background: transparent; color: var(--text2);
    cursor: pointer; transition: all .15s; font-family: 'Noto Serif KR';
  }
  .meal-chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .photo-picker {
    border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 20px;
    text-align: center; cursor: pointer; margin-bottom: 14px; transition: all .2s;
    position: relative; overflow: hidden;
  }
  .photo-picker:active { border-color: var(--accent); }
  .photo-picker.has-image { padding: 0; aspect-ratio: 16/9; }
  .photo-picker.has-image img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius); }
  .photo-clear {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%;
    background: rgba(0,0,0,.6); border: none; color: white; font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  .photo-icon { font-size: 28px; margin-bottom: 6px; }
  .photo-hint { font-size: 12px; color: var(--text3); }
  #photo-input { display: none; }
  .text-area {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px; font-family: 'Noto Serif KR';
    font-size: 14px; color: var(--text); resize: none; height: 80px; outline: none;
    transition: border-color .2s;
  }
  .text-area:focus { border-color: var(--accent); }
  .text-area::placeholder { color: var(--text3); }
  .save-btn {
    width: 100%; margin-top: 14px; padding: 15px; border-radius: var(--radius);
    background: var(--accent); color: var(--bg); font-size: 15px; font-weight: 600;
    border: none; cursor: pointer; font-family: 'Noto Serif KR';
    transition: all .2s; letter-spacing: -0.3px;
  }
  .save-btn:active { transform: scale(.97); opacity: .85; }
  .save-btn:disabled { opacity: .4; cursor: default; }

  /* ── SETTINGS VIEW ── */
  #view-settings { padding: 16px; }
  .settings-section { margin-bottom: 24px; }
  .settings-label { font-size: 11px; color: var(--text3); font-family: 'DM Mono'; letter-spacing: .8px; margin-bottom: 10px; padding-left: 4px; }
  .settings-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
  .settings-row { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .settings-row:last-child { border-bottom: none; }
  .settings-row-label { font-size: 14px; }
  .settings-row-sub { font-size: 11px; color: var(--text3); font-family: 'DM Mono'; margin-top: 2px; }
  .settings-input {
    flex: 1; background: transparent; border: none; outline: none;
    font-family: 'DM Mono'; font-size: 12px; color: var(--text); text-align: right;
    min-width: 0; padding: 0;
  }
  .settings-input::placeholder { color: var(--text3); }
  .settings-status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-connected { background: #4caf50; }
  .status-error { background: #f44336; }
  .status-none { background: var(--border); }
  .test-btn {
    width: 100%; padding: 14px; border-radius: var(--radius); border: 1px solid var(--accent);
    background: transparent; color: var(--accent); font-size: 14px; cursor: pointer;
    font-family: 'Noto Serif KR'; transition: all .2s; margin-top: 10px;
  }
  .test-btn:active { background: var(--accent-soft); }
  .theme-toggle {
    display: flex; background: var(--bg3); border-radius: 20px; padding: 3px; gap: 2px;
  }
  .theme-opt {
    padding: 5px 12px; border-radius: 16px; font-size: 12px; cursor: pointer;
    transition: all .2s; color: var(--text3); border: none; background: transparent;
    font-family: 'Noto Serif KR';
  }
  .theme-opt.active { background: var(--surface); color: var(--text); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    display: flex; background: var(--bg2); border-top: 1px solid var(--border);
    padding-bottom: var(--safe-bottom);
  }
  .nav-item {
    flex: 1; padding: 12px 0 10px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; cursor: pointer; transition: all .15s;
    border: none; background: transparent; color: var(--text3);
  }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 20px; line-height: 1; }
  .nav-label { font-size: 10px; font-family: 'DM Mono'; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: calc(var(--safe-bottom) + 80px); left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 10px 18px; font-size: 13px; color: var(--text); z-index: 200;
    opacity: 0; transition: all .3s; white-space: nowrap; pointer-events: none;
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── EMPTY STATE ── */
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text3); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; line-height: 1.6; }

  /* ── LOADING ── */
  .loading-spinner {
    width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── NOTION SYNC BADGE ── */
  .notion-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
    font-family: 'DM Mono'; color: var(--text3); padding: 4px 10px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border);
  }
</style>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div>
      <div class="topbar-title">식사일기</div>
      <div class="topbar-sub" id="today-label">로딩 중...</div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="openAddModal()" title="기록 추가">
        <span>＋</span>
      </button>
      <div class="icon-btn" style="position:relative" onclick="showView('settings')" title="설정">
        <span>⚙</span>
        <span class="sync-dot" id="sync-dot"></span>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main" id="main-content">
    <!-- CALENDAR VIEW -->
    <div id="view-calendar">
      <div id="calendar-section"></div>
      <div id="day-detail-section"></div>
    </div>

    <!-- SETTINGS VIEW -->
    <div id="view-settings" style="display:none">
      <div class="settings-section">
        <div class="settings-label">NOTION 연결</div>
        <div class="settings-card">
          <div class="settings-row">
            <div>
              <div class="settings-row-label">API 토큰</div>
              <div class="settings-row-sub">secret_...</div>
            </div>
            <input class="settings-input" id="s-token" type="password" placeholder="입력하세요" autocomplete="off" spellcheck="false">
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label">데이터베이스 ID</div>
              <div class="settings-row-sub">32자리 UUID</div>
            </div>
            <input class="settings-input" id="s-dbid" type="text" placeholder="입력하세요" autocomplete="off" spellcheck="false">
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label">프록시 주소</div>
              <div class="settings-row-sub">CORS 우회용</div>
            </div>
            <input class="settings-input" id="s-proxy" type="text" placeholder="https://..." autocomplete="off" spellcheck="false">
          </div>
          <div class="settings-row">
            <div class="settings-row-label">연결 상태</div>
            <div class="settings-status" id="conn-status">
              <span class="status-dot status-none" id="status-dot"></span>
              <span id="status-text">미설정</span>
            </div>
          </div>
        </div>
        <button class="test-btn" onclick="testConnection()">연결 테스트</button>
      </div>

      <div class="settings-section">
        <div class="settings-label">화면 테마</div>
        <div class="settings-card">
          <div class="settings-row">
            <div class="settings-row-label">테마 선택</div>
            <div class="theme-toggle">
              <button class="theme-opt" id="th-system" onclick="setTheme('system')">자동</button>
              <button class="theme-opt" id="th-dark" onclick="setTheme('dark')">다크</button>
              <button class="theme-opt" id="th-light" onclick="setTheme('light')">라이트</button>
            </div>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">노션 DB 구조</div>
        <div class="settings-card">
          <div class="settings-row" style="flex-direction:column; align-items:flex-start; gap:8px">
            <div class="settings-row-label">필요한 속성 (Property)</div>
            <div style="font-size:11px; color:var(--text3); font-family:'DM Mono'; line-height:1.8">
              📝 Name (제목)<br>
              📅 Date (날짜)<br>
              🍽 MealType (선택: 아침/점심/저녁/간식/야식)<br>
              📄 Note (텍스트)<br>
              🖼 Photo (파일 & 미디어)<br>
              ⏰ Time (텍스트)
            </div>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">데이터 관리</div>
        <div class="settings-card">
          <div class="settings-row" style="cursor:pointer" onclick="clearLocalCache()">
            <div class="settings-row-label">로컬 캐시 초기화</div>
            <span style="color:var(--text3); font-size:14px">›</span>
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label">저장된 항목</div>
            </div>
            <span id="cache-count" style="font-family:'DM Mono'; font-size:12px; color:var(--text3)">0개</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-item active" id="nav-cal" onclick="showView('calendar')">
      <span class="nav-icon">📅</span>
      <span class="nav-label">달력</span>
    </button>
    <button class="nav-item" id="nav-settings" onclick="showView('settings')">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">설정</span>
    </button>
  </div>
</div>

<!-- ADD ENTRY MODAL -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">식사 기록 추가</div>
    <div class="modal-meal-select" id="meal-chips"></div>
    <div class="photo-picker" id="photo-picker" onclick="document.getElementById('photo-input').click()">
      <div id="photo-placeholder">
        <div class="photo-icon">📷</div>
        <div class="photo-hint">사진 추가 (선택사항)</div>
      </div>
      <img id="photo-preview" style="display:none; width:100%; height:100%; object-fit:cover; border-radius:var(--radius)">
      <button class="photo-clear" id="photo-clear" style="display:none" onclick.stop="clearPhoto(event)">✕</button>
    </div>
    <input type="file" id="photo-input" accept="image/*" capture="environment" onchange="handlePhoto(this)">
    <textarea class="text-area" id="entry-text" placeholder="오늘 뭐 먹었나요? 자유롭게 기록하세요..."></textarea>
    <button class="save-btn" id="save-btn" onclick="saveEntry()">저장하기</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
const MEALS = [
  { id: 'morning', label: '아침', emoji: '🌅', color: 'var(--meal-morning)' },
  { id: 'lunch',   label: '점심', emoji: '☀️', color: 'var(--meal-lunch)' },
  { id: 'dinner',  label: '저녁', emoji: '🌙', color: 'var(--meal-dinner)' },
  { id: 'snack',   label: '간식', emoji: '🍪', color: 'var(--meal-snack)' },
  { id: 'late',    label: '야식', emoji: '🌃', color: 'var(--meal-late)' },
];

let state = {
  selectedDate: todayStr(),
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  addMeal: 'morning',
  addPhoto: null, // base64
  theme: 'light',
  notionToken: '',
  notionDbId: '',
  notionProxy: '',
  connStatus: 'none', // none | connected | error
  entries: {}, // { 'YYYY-MM-DD': [{ id, meal, text, photo, time }] }
};

// ── STORAGE ────────────────────────────────────────────────────────────────
function loadState() {
  try {
    const saved = localStorage.getItem('meal-diary-v1');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
  } catch(e) { console.error('load error', e); }
}

function saveState() {
  const data = {
    theme: state.theme,
    notionToken: state.notionToken,
    notionDbId: state.notionDbId,
    notionProxy: state.notionProxy,
    connStatus: state.connStatus,
    entries: state.entries,
  };
  try {
    localStorage.setItem('meal-diary-v1', JSON.stringify(data));
  } catch(e) {
    if (e.name === 'QuotaExceededError' || e.code === 22) {
      // 용량 초과: 사진 제외하고 저장
      const slim = JSON.parse(JSON.stringify(state.entries));
      Object.values(slim).forEach(day => day.forEach(entry => { entry.photo = null; }));
      try {
        localStorage.setItem('meal-diary-v1', JSON.stringify({ ...data, entries: slim }));
        showToast('⚠️ 저장공간 부족 — 사진은 재시작 후 사라질 수 있습니다');
      } catch(e2) {
        showToast('저장 실패: 설정에서 캐시를 초기화해주세요');
      }
    } else {
      console.error('save error', e);
      showToast('저장 오류: ' + e.message);
    }
  }
}

function todayStr() {
  return new Date().toISOString().slice(0,10);
}

// ── THEME ──────────────────────────────────────────────────────────────────
function setTheme(mode) {
  state.theme = mode;
  applyTheme();
  saveState();
  ['system','dark','light'].forEach(m => {
    document.getElementById('th-'+m)?.classList.toggle('active', state.theme===m);
  });
}

function applyTheme() {
  const root = document.documentElement;
  if (state.theme === 'dark') root.removeAttribute('data-theme');
  else if (state.theme === 'light') root.setAttribute('data-theme','light');
  else {
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    dark ? root.removeAttribute('data-theme') : root.setAttribute('data-theme','light');
  }
}

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (state.theme === 'system') applyTheme();
});

// ── VIEWS ──────────────────────────────────────────────────────────────────
function showView(name) {
  document.getElementById('view-calendar').style.display = name==='calendar' ? 'block' : 'none';
  document.getElementById('view-settings').style.display = name==='settings' ? 'block' : 'none';
  document.getElementById('nav-cal').classList.toggle('active', name==='calendar');
  document.getElementById('nav-settings').classList.toggle('active', name==='settings');
  if (name==='settings') refreshSettings();
  if (name==='calendar') renderCalendar();
}

// ── CALENDAR ───────────────────────────────────────────────────────────────
function renderCalendar() {
  const { calYear, calMonth, selectedDate } = state;
  const now = new Date();
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  let html = `
    <div class="cal-header">
      <div class="cal-month">${calYear}년 ${monthNames[calMonth]}</div>
      <div class="cal-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <button onclick="goToday()">오늘</button>
        <button onclick="changeMonth(1)">›</button>
      </div>
    </div>
    <div class="cal-grid">
      <div class="cal-day-label">일</div><div class="cal-day-label">월</div>
      <div class="cal-day-label">화</div><div class="cal-day-label">수</div>
      <div class="cal-day-label">목</div><div class="cal-day-label">금</div>
      <div class="cal-day-label">토</div>
  `;

  // Prev month padding
  for (let i = firstDay-1; i >= 0; i--) {
    const d = daysInPrev - i;
    const dateStr = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dots = getMealDots(dateStr);
    html += `<div class="cal-cell other-month" onclick="selectDate('${dateStr}')">
      <span class="cal-num">${d}</span>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr();
    const isSelected = dateStr === selectedDate;
    const dots = getMealDots(dateStr);
    html += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectDate('${dateStr}')">
      <span class="cal-num">${d}</span>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }

  // Next month padding
  const totalCells = firstDay + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= remaining; d++) {
    const dateStr = `${calYear}-${String(calMonth+2).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dots = getMealDots(dateStr);
    html += `<div class="cal-cell other-month" onclick="selectDate('${dateStr}')">
      <span class="cal-num">${d}</span>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }

  html += `</div>`;
  document.getElementById('calendar-section').innerHTML = html;
  renderDayDetail();
}

function getMealDots(dateStr) {
  const entries = state.entries[dateStr] || [];
  const mealIds = [...new Set(entries.map(e => e.meal))];
  return mealIds.map(mid => {
    const m = MEALS.find(m => m.id === mid);
    return m ? `<span class="cal-dot" style="background:${m.color}"></span>` : '';
  }).join('');
}

function changeMonth(dir) {
  state.calMonth += dir;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  renderCalendar();
}

function goToday() {
  const now = new Date();
  state.calYear = now.getFullYear();
  state.calMonth = now.getMonth();
  state.selectedDate = todayStr();
  renderCalendar();
}

function selectDate(dateStr) {
  state.selectedDate = dateStr;
  renderCalendar();
  // Scroll to detail
  setTimeout(() => {
    document.getElementById('day-detail-section')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function renderDayDetail() {
  const { selectedDate } = state;
  const entries = state.entries[selectedDate] || [];
  const dateObj = new Date(selectedDate + 'T00:00:00');
  const dayNames = ['일','월','화','수','목','금','토'];
  const label = `${dateObj.getMonth()+1}월 ${dateObj.getDate()}일 (${dayNames[dateObj.getDay()]})`;

  let html = `<div class="day-detail">
    <div class="day-detail-header">${selectedDate} · ${label}</div>
    <div class="meal-cards">`;

  MEALS.forEach(meal => {
    const mealEntries = entries.filter(e => e.meal === meal.id);
    html += `<div class="meal-card">
      <div class="meal-card-header" onclick="toggleMealCard('${meal.id}')">
        <div class="meal-card-left">
          <span class="meal-badge" style="background:${meal.color}"></span>
          <span class="meal-label">${meal.emoji} ${meal.label}</span>
          ${mealEntries.length > 0 ? `<span class="meal-count">${mealEntries.length}개</span>` : ''}
        </div>
        <button class="meal-add-btn" onclick="event.stopPropagation(); openAddModal('${meal.id}')">＋</button>
      </div>`;

    if (mealEntries.length > 0) {
      html += `<div class="meal-entries" id="meal-entries-${meal.id}">`;
      mealEntries.forEach(entry => {
        html += `<div class="entry-item">
          <div class="entry-thumb">
            ${entry.photo ? `<img src="${entry.photo}" alt="식사사진">` : meal.emoji}
          </div>
          <div class="entry-text-wrap">
            <div class="entry-text">${escHtml(entry.text || '메모 없음')}</div>
            <div class="entry-time">${entry.time || ''}</div>
          </div>
          <button class="entry-delete" onclick="deleteEntry('${selectedDate}','${entry.id}')">✕</button>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });

  if (entries.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-icon">🍽</div>
      <div class="empty-text">아직 기록이 없어요<br>＋ 버튼을 눌러 추가하세요</div>
    </div>`;
  }

  html += `</div></div>`;
  document.getElementById('day-detail-section').innerHTML = html;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── ADD MODAL ─────────────────────────────────────────────────────────────
function openAddModal(mealId) {
  state.addMeal = mealId || 'morning';
  state.addPhoto = null;
  document.getElementById('entry-text').value = '';
  document.getElementById('photo-preview').style.display = 'none';
  document.getElementById('photo-placeholder').style.display = 'block';
  document.getElementById('photo-clear').style.display = 'none';
  document.getElementById('photo-picker').classList.remove('has-image');
  renderMealChips();
  document.getElementById('add-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('add-modal').classList.remove('open');
}

document.getElementById('add-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('add-modal')) closeModal();
});

function renderMealChips() {
  document.getElementById('meal-chips').innerHTML = MEALS.map(m =>
    `<button class="meal-chip ${state.addMeal===m.id?'active':''}" onclick="selectMeal('${m.id}')">${m.emoji} ${m.label}</button>`
  ).join('');
}

function selectMeal(id) {
  state.addMeal = id;
  renderMealChips();
}

function handlePhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const original = new Image();
    original.onload = () => {
      // 캔버스로 리사이즈 + 압축 (최대 800px, quality 0.72)
      const MAX = 800;
      let w = original.width, h = original.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(original, 0, 0, w, h);
      state.addPhoto = canvas.toDataURL('image/jpeg', 0.72);
      const img = document.getElementById('photo-preview');
      img.src = state.addPhoto;
      img.style.display = 'block';
      document.getElementById('photo-placeholder').style.display = 'none';
      document.getElementById('photo-clear').style.display = 'flex';
      document.getElementById('photo-picker').classList.add('has-image');
    };
    original.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function clearPhoto(e) {
  e.stopPropagation();
  state.addPhoto = null;
  document.getElementById('photo-preview').style.display = 'none';
  document.getElementById('photo-placeholder').style.display = 'block';
  document.getElementById('photo-clear').style.display = 'none';
  document.getElementById('photo-picker').classList.remove('has-image');
  document.getElementById('photo-input').value = '';
}

async function saveEntry() {
  const text = document.getElementById('entry-text').value.trim();
  if (!text && !state.addPhoto) { showToast('텍스트나 사진을 입력하세요'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = '저장 중...';

  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2),
    meal: state.addMeal,
    text: text,
    photo: state.addPhoto,
    time: timeStr,
    synced: false,
  };

  if (!state.entries[state.selectedDate]) state.entries[state.selectedDate] = [];
  state.entries[state.selectedDate].push(entry);
  saveState();
  renderCalendar();
  closeModal();
  showToast('저장되었습니다 ✓');

  // Try Notion sync
  if (state.notionToken && state.notionDbId && state.notionProxy) {
    await syncToNotion(state.selectedDate, entry);
  }

  btn.disabled = false;
  btn.textContent = '저장하기';
}

function deleteEntry(dateStr, entryId) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  state.entries[dateStr] = (state.entries[dateStr] || []).filter(e => e.id !== entryId);
  if (state.entries[dateStr].length === 0) delete state.entries[dateStr];
  saveState();
  renderCalendar();
  showToast('삭제되었습니다');
}

// ── NOTION SYNC ────────────────────────────────────────────────────────────
async function syncToNotion(dateStr, entry) {
  setSyncDot('syncing');
  try {
    const mealLabel = MEALS.find(m => m.id === entry.meal)?.label || entry.meal;
    const payload = {
      parent: { database_id: state.notionDbId },
      properties: {
        Name: { title: [{ text: { content: `${mealLabel} - ${dateStr}` } }] },
        Date: { date: { start: dateStr } },
        MealType: { select: { name: mealLabel } },
        Note: { rich_text: [{ text: { content: entry.text || '' } }] },
        Time: { rich_text: [{ text: { content: entry.time || '' } }] },
      }
    };

    // Photo upload via proxy (base64 → Notion file block)
    if (entry.photo) {
      // Notion doesn't support direct base64 upload; add as external or skip
      // We'll add photo as a child block comment
      payload.children = [{
        object: 'block',
        type: 'image',
        image: {
          type: 'external',
          external: { url: entry.photo.startsWith('data:') ? '' : entry.photo }
        }
      }];
    }

    const proxyBase = state.notionProxy.replace(/\/$/, '');
    const res = await fetch(`${proxyBase}/v1/pages`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${state.notionToken}`,
        'Content-Type': 'application/json',
        'Notion-Version': '2022-06-28',
      },
      body: JSON.stringify(payload),
    });

    if (res.ok) {
      // Mark as synced
      const idx = state.entries[dateStr]?.findIndex(e => e.id === entry.id);
      if (idx !== undefined && idx >= 0) {
        state.entries[dateStr][idx].synced = true;
        state.entries[dateStr][idx].notionId = (await res.json()).id;
        saveState();
      }
      setSyncDot('connected');
      state.connStatus = 'connected';
    } else {
      const err = await res.json();
      console.error('Notion error:', err);
      setSyncDot('error');
      showToast('노션 동기화 실패: ' + (err.message || res.status));
    }
  } catch(e) {
    console.error('sync error', e);
    setSyncDot('error');
    showToast('노션 연결 오류');
  }
}

function setSyncDot(status) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot' + (status==='connected' ? ' ' : status==='error' ? ' error' : ' syncing');
}

async function testConnection() {
  if (!state.notionToken || !state.notionDbId || !state.notionProxy) {
    showToast('토큰, DB ID, 프록시 주소를 모두 입력하세요');
    return;
  }
  saveNotionSettings();
  setSyncDot('syncing');
  document.getElementById('status-text').textContent = '연결 중...';

  try {
    const proxyBase = state.notionProxy.replace(/\/$/, '');
    const res = await fetch(`${proxyBase}/v1/databases/${state.notionDbId}`, {
      headers: {
        'Authorization': `Bearer ${state.notionToken}`,
        'Notion-Version': '2022-06-28',
      }
    });
    if (res.ok) {
      setSyncDot('connected');
      state.connStatus = 'connected';
      document.getElementById('status-dot').className = 'status-dot status-connected';
      document.getElementById('status-text').textContent = '연결됨';
      showToast('노션 연결 성공! ✓');
    } else {
      const err = await res.json();
      setSyncDot('error');
      state.connStatus = 'error';
      document.getElementById('status-dot').className = 'status-dot status-error';
      document.getElementById('status-text').textContent = '오류: ' + (err.message || res.status);
      showToast('연결 실패: ' + (err.message || res.status));
    }
    saveState();
  } catch(e) {
    setSyncDot('error');
    state.connStatus = 'error';
    document.getElementById('status-dot').className = 'status-dot status-error';
    document.getElementById('status-text').textContent = '연결 실패';
    showToast('네트워크 오류: ' + e.message);
    saveState();
  }
}

function saveNotionSettings() {
  state.notionToken = document.getElementById('s-token').value.trim();
  state.notionDbId = document.getElementById('s-dbid').value.trim();
  state.notionProxy = document.getElementById('s-proxy').value.trim();
  saveState();
}

// Auto-save settings on input
['s-token','s-dbid','s-proxy'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => saveNotionSettings());
});

function refreshSettings() {
  document.getElementById('s-token').value = state.notionToken;
  document.getElementById('s-dbid').value = state.notionDbId;
  document.getElementById('s-proxy').value = state.notionProxy;
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (state.connStatus === 'connected') {
    dot.className = 'status-dot status-connected'; txt.textContent = '연결됨';
    setSyncDot('connected');
  } else if (state.connStatus === 'error') {
    dot.className = 'status-dot status-error'; txt.textContent = '오류';
    setSyncDot('error');
  } else {
    dot.className = 'status-dot status-none'; txt.textContent = '미설정';
  }
  const total = Object.values(state.entries).reduce((a,b) => a + b.length, 0);
  document.getElementById('cache-count').textContent = total + '개';
  ['system','dark','light'].forEach(m => {
    document.getElementById('th-'+m)?.classList.toggle('active', state.theme===m);
  });
}

function clearLocalCache() {
  if (!confirm('로컬에 저장된 식사 기록을 모두 삭제할까요?\n(노션 DB의 데이터는 삭제되지 않습니다)')) return;
  state.entries = {};
  saveState();
  renderCalendar();
  refreshSettings();
  showToast('캐시가 초기화되었습니다');
}

// ── TOAST ─────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── INIT ──────────────────────────────────────────────────────────────────
loadState();
applyTheme();

const now = new Date();
const days = ['일','월','화','수','목','금','토'];
document.getElementById('today-label').textContent =
  `${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;

// Init sync dot based on saved status
if (state.connStatus === 'connected') setSyncDot('connected');
else if (state.connStatus === 'error') setSyncDot('error');

renderCalendar();
</script>
