<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="나의 하루">
<title>나의 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>

/* ═══ TOKENS ═══ */
:root {
  --bg:#0e0e0f; --bg2:#161618; --bg3:#1e1e21;
  --surface:#242428; --surface2:#2e2e33;
  --border:#3a3a40; --border2:rgba(255,255,255,0.06);
  --text:#f0ede8; --text2:#a09a92; --text3:#6b6560;
  --accent:#e8c9a0; --accent2:#c9a87a; --accent-soft:rgba(232,201,160,0.12);
  --green:#5a9e6f; --green-light:rgba(90,158,111,0.15);
  --gold:#c9a84c; --gold-light:rgba(201,168,76,0.12);
  --r:18px; --rs:10px;
}
[data-theme="light"] {
  --bg:#f5f0ea; --bg2:#ede8e0; --bg3:#e4ddd4;
  --surface:#fff; --surface2:#f0ebe3;
  --border:#d8d0c4; --border2:rgba(0,0,0,0.06);
  --text:#1a1714; --text2:#6b6258; --text3:#9e9589;
  --accent:#8a6a3a; --accent2:#6a4e28; --accent-soft:rgba(138,106,58,0.10);
  --green:#2d5a3d; --green-light:#e8f0ea;
  --gold:#8a7030; --gold-light:rgba(138,112,48,0.10);
}

/* ═══ RESET ═══ */
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html { background:#000; -webkit-text-size-adjust:100%; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
  height:100dvh; overflow:hidden;
}
input, textarea { -webkit-user-select:text; user-select:text; }

/* ═══ SHELL — position:fixed, 키보드에 흔들리지 않음 ═══ */
#app {
  position:fixed; inset:0;
  max-width:430px; margin:0 auto;
  display:flex; flex-direction:column;
  background:var(--bg); overflow:hidden;
}

/* ═══ TOP BAR — Dynamic Island 아래 ═══ */
.topbar {
  flex-shrink:0;
  padding-top:calc(env(safe-area-inset-top) + 12px);
  padding-bottom:11px; padding-left:20px; padding-right:20px;
  background:var(--bg2); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; z-index:10;
}
.topbar-left { display:flex; flex-direction:column; gap:2px; }
.topbar-title { font-family:'Noto Serif KR',serif; font-size:18px; font-weight:600; letter-spacing:-.3px; }
.topbar-sub   { font-family:'DM Mono',monospace; font-size:10px; color:var(--text3); }
.topbar-right { display:flex; gap:8px; align-items:center; }
.icon-btn {
  width:36px; height:36px; border-radius:50%;
  border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  color:var(--text2); font-size:15px; cursor:pointer;
  position:relative; flex-shrink:0; transition:background .15s;
}
.icon-btn:active { background:var(--surface2); transform:scale(.92); }
.sync-dot { width:6px; height:6px; border-radius:50%; background:#4caf50; position:absolute; top:6px; right:6px; border:1.5px solid var(--bg2); }
.notion-dot-small { width:7px; height:7px; border-radius:50%; background:var(--border); position:absolute; bottom:6px; right:6px; border:1.5px solid var(--bg2); }
.notion-dot-small.ok  { background:#6aa06a; }
.notion-dot-small.err { background:#c97070; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ═══ SCREENS ═══ */
.screen { display:none; flex-direction:column; flex:1; min-height:0; overflow:hidden; }
.screen.active { display:flex; }

/* ═══ SCROLL BODY ═══ */
.page-body {
  flex:1; min-height:0;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; scrollbar-width:none;
}
.page-body::-webkit-scrollbar { display:none; }

/* ═══ BOTTOM NAV — flex 마지막 자식, 항상 보임 ═══ */
.bottom-nav {
  flex-shrink:0; display:flex;
  background:var(--bg2); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
}
.nav-item {
  flex:1; height:58px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  border:none; background:transparent; color:var(--text3); cursor:pointer; transition:color .15s;
  min-width:44px;
}
.nav-item.active { color:var(--accent); }
.nav-icon  { font-size:22px; line-height:1; }
.nav-label { font-size:10px; font-family:'DM Mono',monospace; letter-spacing:.3px; }

/* ═══ SUB TABS ═══ */
.sub-tabbar { display:flex; background:var(--bg3); border-bottom:1px solid var(--border); flex-shrink:0; }
.sub-tab {
  flex:1; padding:10px 4px; font-size:13px; font-family:'Noto Sans KR';
  color:var(--text3); cursor:pointer; text-align:center; font-weight:400;
  background:none; border:none; border-bottom:2px solid transparent; transition:all .2s;
}
.sub-tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:500; }

/* ═══ CALENDAR ═══ */
.cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.cal-month  { font-family:'Noto Serif KR',serif; font-size:20px; font-weight:600; letter-spacing:-.5px; }
.cal-nav-btn { width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--text2); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.cal-nav-btn:active { background:var(--surface2); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal-day-label { text-align:center; font-size:10px; color:var(--text3); font-family:'DM Mono'; padding:6px 0; }
.cal-cell { aspect-ratio:1; border-radius:var(--rs); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; transition:all .15s; gap:2px; }
.cal-cell:active { transform:scale(.9); }
.cal-cell.empty { cursor:default; }
.cal-cell.today .cal-num { background:var(--accent); color:var(--bg); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; }
.cal-cell.selected { background:var(--accent-soft); }
.cal-num { font-size:13px; font-weight:500; }
.cal-dots { display:flex; gap:2px; flex-wrap:wrap; justify-content:center; max-width:26px; }
.cal-dot  { width:4px; height:4px; border-radius:50%; }



/* ═══ JOURNAL ═══ */
.section-label { font-size:11px; font-weight:500; color:var(--text3); letter-spacing:1.2px; text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.section-label::after { content:''; flex:1; height:.5px; background:var(--border); }
.today-greeting { font-family:'Noto Serif KR',serif; font-size:15px; color:var(--text2); margin-bottom:20px; font-weight:300; line-height:1.6; }
.affirmation-item { background:var(--surface); border:1px solid var(--border2); border-radius:var(--rs); padding:14px 16px; display:flex; align-items:flex-start; gap:12px; transition:border-color .2s; margin-bottom:10px; }
.affirmation-item:focus-within { border-color:var(--accent2); }
.aff-number { width:24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:500; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
.aff-input  { flex:1; border:none; background:none; font-size:14px; color:var(--text); font-family:'Noto Sans KR',sans-serif; font-weight:300; line-height:1.6; resize:none; outline:none; min-height:22px; caret-color:var(--accent); }
.aff-input::placeholder { color:var(--text3); }
.gratitude-item { background:var(--surface); border:1px solid var(--border2); border-radius:var(--rs); padding:14px 16px; display:flex; align-items:flex-start; gap:12px; transition:border-color .2s; margin-bottom:10px; }
.gratitude-item:focus-within { border-color:var(--gold); }
.grat-icon  { width:24px; height:24px; border-radius:50%; background:var(--gold-light); color:var(--gold); font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
.grat-input { flex:1; border:none; background:none; font-size:14px; color:var(--text); font-family:'Noto Serif KR',serif; font-weight:300; line-height:1.6; resize:none; outline:none; min-height:22px; caret-color:var(--gold); }
.grat-input::placeholder { color:var(--text3); font-style:italic; }
.reflection-item { background:var(--surface); border:1px solid var(--border2); border-radius:var(--rs); padding:14px 16px; display:flex; align-items:flex-start; gap:12px; transition:border-color .2s; margin-bottom:10px; }
.reflection-item:focus-within { border-color:var(--text2); }
.refl-icon  { width:24px; height:24px; border-radius:50%; background:var(--surface2); color:var(--text2); font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
.refl-input { flex:1; border:none; background:none; font-size:14px; color:var(--text); font-family:'Noto Sans KR',sans-serif; font-weight:300; line-height:1.6; resize:none; outline:none; min-height:22px; caret-color:var(--text2); }
.refl-input::placeholder { color:var(--text3); }
.mood-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:20px; scrollbar-width:none; }
.mood-row::-webkit-scrollbar { display:none; }
.mood-btn  { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 14px; border:1px solid var(--border2); border-radius:var(--rs); background:var(--surface); cursor:pointer; transition:all .2s; white-space:nowrap; flex-shrink:0; }
.mood-btn.selected { border-color:var(--accent2); background:var(--accent-soft); }
.mood-icon { font-size:20px; }
.mood-lbl  { font-size:10px; color:var(--text3); }
.mood-btn.selected .mood-lbl { color:var(--accent); }
.entry-viewer        { background:var(--surface); border:1px solid var(--border2); border-radius:var(--r); padding:18px; margin-top:6px; }
.entry-date-label    { font-size:12px; color:var(--text3); font-weight:300; margin-bottom:14px; }
.entry-section-title { font-size:10px; color:var(--accent); letter-spacing:1px; font-weight:500; text-transform:uppercase; margin-bottom:8px; margin-top:14px; }
.entry-aff-list { display:flex; flex-direction:column; gap:8px; }
.entry-aff-row  { display:flex; align-items:flex-start; gap:10px; font-size:14px; color:var(--text2); line-height:1.6; font-weight:300; }
.entry-aff-num  { color:var(--accent2); font-size:12px; margin-top:2px; flex-shrink:0; }

/* ═══ STATS ═══ */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
.stat-card  { background:var(--surface); border:1px solid var(--border2); border-radius:var(--rs); padding:16px; }
.stat-num   { font-size:26px; font-weight:300; color:var(--accent); font-family:'Noto Serif KR',serif; line-height:1; margin-bottom:4px; }
.stat-label { font-size:11px; color:var(--text3); line-height:1.4; }
.streak-bar   { background:var(--surface); border:1px solid var(--border2); border-radius:var(--r); padding:18px; margin-bottom:12px; }
.streak-label { font-size:12px; color:var(--text3); margin-bottom:10px; font-weight:300; }
.streak-weeks { display:flex; gap:3px; flex-wrap:wrap; }
.streak-dot   { width:12px; height:12px; border-radius:3px; background:var(--bg3); }
.streak-dot.filled { background:var(--accent); }
.recent-card { background:var(--surface); border:1px solid var(--border2); border-radius:var(--rs); padding:14px 16px; cursor:pointer; margin-bottom:8px; }
.recent-card:active { opacity:.8; }
.recent-card-date    { font-size:11px; color:var(--text3); margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; }
.recent-card-preview { font-size:13px; color:var(--text2); font-weight:300; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* Notion 패널 (플래너) */
.notion-panel { background:var(--bg3); border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; display:none; margin:10px 16px 0; }
.notion-panel.visible { display:block; }
.notion-title { font-size:13px; font-weight:600; margin-bottom:10px; }
.notion-field { margin-bottom:8px; }
.notion-field label { font-size:11px; color:var(--text2); display:block; margin-bottom:3px; }
.notion-field input { width:100%; padding:8px 10px; background:var(--surface); border:.5px solid var(--border); border-radius:var(--rs); font-size:13px; color:var(--text); font-family:monospace; outline:none; }
.notion-field input:focus { border-color:var(--green); }
.notion-save-btn { width:100%; padding:10px; background:var(--green); color:white; border:none; border-radius:var(--rs); font-size:13px; font-weight:600; cursor:pointer; margin-top:4px; font-family:inherit; }

/* ═══ SETTINGS ═══ */
.settings-section { margin-bottom:24px; }
.settings-label { font-size:11px; color:var(--text3); font-family:'DM Mono'; letter-spacing:.8px; margin-bottom:10px; padding-left:4px; }
.settings-card  { background:var(--surface); border-radius:var(--r); border:1px solid var(--border); overflow:hidden; }
.settings-row   { padding:14px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
.settings-row:last-child { border-bottom:none; }
.settings-row-label { font-size:14px; }
.settings-row-sub   { font-size:11px; color:var(--text3); font-family:'DM Mono'; margin-top:2px; }
.settings-input { flex:1; background:transparent; border:none; outline:none; font-family:'DM Mono'; font-size:12px; color:var(--text); text-align:right; min-width:0; padding:0; }
.settings-input::placeholder { color:var(--text3); }
.settings-status { display:flex; align-items:center; gap:6px; font-size:12px; }
.status-dot { width:7px; height:7px; border-radius:50%; }
.status-connected { background:#4caf50; }
.status-error { background:#f44336; }
.status-none  { background:var(--border); }
.test-btn { width:100%; padding:14px; border-radius:var(--r); border:1px solid var(--accent); background:transparent; color:var(--accent); font-size:14px; cursor:pointer; font-family:'Noto Sans KR'; margin-top:10px; }
.test-btn:active { background:var(--accent-soft); }
.theme-toggle { display:flex; background:var(--bg3); border-radius:20px; padding:3px; gap:2px; }
.theme-opt { padding:5px 12px; border-radius:16px; font-size:12px; cursor:pointer; color:var(--text3); border:none; background:transparent; font-family:'Noto Sans KR'; }
.theme-opt.active { background:var(--surface); color:var(--text); }

/* ═══ SAVE BTN ═══ */
.save-btn { width:100%; padding:15px; border-radius:var(--r); background:var(--accent); color:var(--bg); font-size:15px; font-weight:600; border:none; cursor:pointer; font-family:'Noto Sans KR'; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:4px; margin-bottom:16px; }
.save-btn:active { transform:scale(.97); opacity:.85; }
.save-btn.saved { background:#6a9a6a; }
.save-btn:disabled { opacity:.4; cursor:default; }
@keyframes spin { to { transform:rotate(360deg); } }
.sync-spinner { width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; animation:spin .8s linear infinite; display:none; }
.sync-spinner.active { display:block; }

/* ═══ MODALS ═══ */
.modal-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,.75);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  z-index:400; display:flex; align-items:flex-end;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal {
  width:100%; max-width:430px; margin:0 auto;
  background:var(--bg2); border-radius:24px 24px 0 0;
  border-top:1px solid var(--border);
  padding:20px 20px calc(env(safe-area-inset-bottom) + 24px);
  transform:translateY(100%); transition:transform .35s cubic-bezier(.25,.8,.25,1);
  max-height:92dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.modal-overlay.open .modal { transform:translateY(0); }
.modal-handle { width:36px; height:4px; border-radius:2px; background:var(--border); margin:0 auto 18px; }
.modal-title  { font-size:17px; font-weight:600; margin-bottom:18px; font-family:'Noto Serif KR',serif; }
.date-picker-sheet {
  width:100%; max-width:430px; margin:0 auto;
  background:var(--bg2); border-radius:24px 24px 0 0;
  border-top:1px solid var(--border);
  padding:20px 20px calc(env(safe-area-inset-bottom) + 24px);
  transform:translateY(100%); transition:transform .35s cubic-bezier(.25,.8,.25,1);
}
.modal-overlay.open .date-picker-sheet { transform:translateY(0); }
.sheet-title { font-size:16px; font-weight:600; margin-bottom:14px; text-align:center; }


.text-area { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--rs); padding:12px; font-family:'Noto Sans KR'; font-size:14px; color:var(--text); resize:none; height:80px; outline:none; margin-bottom:4px; }
.text-area:focus { border-color:var(--accent); }
.text-area::placeholder { color:var(--text3); }
/* ═══ TOAST ═══ */
.toast {
  position:fixed;
  bottom:calc(env(safe-area-inset-bottom) + 58px + 12px);
  left:50%; transform:translateX(-50%) translateY(12px);
  background:var(--surface); border:1px solid var(--border);
  border-radius:20px; padding:10px 18px; font-size:13px; color:var(--text);
  z-index:500; opacity:0; transition:all .3s; white-space:nowrap;
  pointer-events:none; box-shadow:0 8px 32px rgba(0,0,0,.4);
  max-width:calc(100vw - 40px);
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.pad { padding:16px; }
.day-detail-header { font-size:12px; color:var(--text3); font-family:'DM Mono'; margin-bottom:12px; letter-spacing:.5px; }
.no-entry { text-align:center; padding:32px 20px; color:var(--text3); font-size:14px; font-weight:300; line-height:1.7; }
.no-entry-icon { font-size:28px; margin-bottom:10px; opacity:.5; }

/* ═══ SYNC BANNER ═══ */
.sync-banner {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; background:var(--green-light);
  border-bottom:1px solid rgba(90,158,111,0.25); flex-shrink:0;
}
.sync-banner-text { font-size:12px; color:var(--green); font-weight:500; }
.sync-banner-time { font-size:10px; color:var(--green); font-family:'DM Mono'; opacity:.7; }
.sync-pull-btn {
  padding:6px 14px; border-radius:20px;
  border:1px solid var(--green); background:transparent;
  color:var(--green); font-size:12px; font-weight:600;
  cursor:pointer; font-family:'Noto Sans KR'; transition:all .15s;
  display:flex; align-items:center; gap:5px; white-space:nowrap;
}
.sync-pull-btn:active { background:var(--green-light); }
.sync-pull-btn.loading { opacity:.6; pointer-events:none; }
@keyframes rotate { to { transform:rotate(360deg); } }
.spin { display:inline-block; animation:rotate .8s linear infinite; }

</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title" id="topbar-title">나의 하루</div>
      <div class="topbar-sub"   id="topbar-sub">로딩 중...</div>
    </div>
    <div class="topbar-right" id="topbar-actions"></div>
  </div>

  <!-- ══ 일기 스크린 ══ -->

  <div class="screen active" id="screen-journal">
    <div class="sync-banner" id="j-sync-banner" style="display:none">
      <div><div class="sync-banner-text">☁️ 노션 동기화</div><div class="sync-banner-time" id="j-last-sync">마지막 동기화: -</div></div>
      <button class="sync-pull-btn" id="j-pull-btn" onclick="jPullFromNotion()">↓ 불러오기</button>
    </div>
    <div class="sub-tabbar">
      <button class="sub-tab active" data-screen="journal" data-sub="today"    onclick="switchSubTab(this,'journal')">오늘</button>
      <button class="sub-tab"        data-screen="journal" data-sub="calendar" onclick="switchSubTab(this,'journal')">달력</button>
      <button class="sub-tab"        data-screen="journal" data-sub="stats"    onclick="switchSubTab(this,'journal')">기록</button>
    </div>
    <div class="page-body">
      <div id="journal-sub-today" class="pad">
        <p class="today-greeting" id="j-greeting"></p>
        <div class="section-label">확언</div>
        <div class="affirmation-item"><div class="aff-number">1</div><textarea class="aff-input" id="j-aff1" placeholder="나는 오늘…" rows="1" oninput="autoResize(this)"></textarea></div>

<script>
// ════════════════════════════════════════
// UTILITIES
// ════════════════════════════════════════
const DAYS_KR=['일','월','화','수','목','금','토'];
const MONTHS_KR=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatKey(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function keyToDisplay(k){const[y,m,d]=k.split('-');return`${y}년 ${parseInt(m)}월 ${parseInt(d)}일`}
function autoResize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}
let _toastT;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('show'),2800);}

// ════════════════════════════════════════
// THEME
// ════════════════════════════════════════
let currentTheme='system';
function setTheme(mode){currentTheme=mode;localStorage.setItem('app-theme',mode);applyTheme();['system','dark','light'].forEach(m=>document.getElementById('th-'+m)?.classList.toggle('active',mode===m));}
function applyTheme(){const dark=currentTheme==='dark'||(currentTheme==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);if(dark)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','light');}
function toggleTheme(){const isLight=document.documentElement.getAttribute('data-theme')==='light';setTheme(isLight?'dark':'light');}

// ════════════════════════════════════════
// ROUTING
// ════════════════════════════════════════
function renderTopbarActions(){
  const el=document.getElementById('topbar-actions');
  el.innerHTML=`<button class="icon-btn" style="position:relative" onclick="jOpenSettings()"><span style="font-size:14px;font-weight:500;color:var(--text2)">N</span><span class="notion-dot-small" id="j-notionDot"></span></button>
      <button class="icon-btn" onclick="toggleTheme()">🌙</button>`;
  if(jIsConfigured())jUpdateDot('ok');
}

function switchSubTab(btn,screen){
  const sub=btn.dataset.sub;
  document.querySelectorAll(`[data-screen="${screen}"]`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const panels={journal:['journal-sub-today','journal-sub-calendar','journal-sub-stats']};
  if(panels[screen])panels[screen].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});
  const target=document.getElementById(`${screen}-sub-${sub}`);if(target)target.style.display='block';
  if(screen==='journal'&&sub==='calendar')jRenderCalendar();
  if(screen==='journal'&&sub==='stats')jRenderStats();
}



// ════════════════════════════════════════
// JOURNAL
// ════════════════════════════════════════
let db,jAllEntries={},jCurrentMood='',jCalDate=new Date(),jSelectedDay=null;
function jInitDB(){return new Promise((res,rej)=>{const req=indexedDB.open('myDayJournal',1);req.onupgradeneeded=e=>e.target.result.createObjectStore('entries',{keyPath:'date'});req.onsuccess=e=>{db=e.target.result;res();};req.onerror=rej;});}
const jSaveEntry=entry=>new Promise((res,rej)=>{const tx=db.transaction('entries','readwrite');tx.objectStore('entries').put(entry);tx.oncomplete=res;tx.onerror=rej;});
const jGetAllEntries=()=>new Promise((res,rej)=>{const tx=db.transaction('entries','readonly');const req=tx.objectStore('entries').getAll();req.onsuccess=e=>{const m={};e.target.result.forEach(e=>m[e.date]=e);res(m);};req.onerror=rej;});
function jIsConfigured(){return!!(localStorage.getItem('notion_token')&&localStorage.getItem('notion_db_id')&&localStorage.getItem('notion_proxy'));}
function jGetConfig(){return{token:localStorage.getItem('notion_token'),dbId:localStorage.getItem('notion_db_id'),proxy:(localStorage.getItem('notion_proxy')||'').replace(/\/$/,'')};}
function jUpdateDot(s){const d=document.getElementById('j-notionDot');if(d)d.className='notion-dot-small'+(s==='ok'?' ok':s==='err'?' err':'');}
function jRenderTodayDate(){const h=new Date().getHours(),g=h<5?'고요한 밤이에요':h<11?'좋은 아침이에요':h<17?'즐거운 오후예요':h<21?'포근한 저녁이에요':'편안한 밤이에요';document.getElementById('j-greeting').textContent=`${g}. 오늘도 스스로를 돌아보는 시간을 가져요.`;}
function jSelectMood(btn){document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');jCurrentMood=btn.dataset.mood;}
async function jSaveToday(){
  const a1=document.getElementById('j-aff1').value.trim(),a2=document.getElementById('j-aff2').value.trim(),a3=document.getElementById('j-aff3').value.trim();
  const g1=document.getElementById('j-grat1').value.trim(),g2=document.getElementById('j-grat2').value.trim(),g3=document.getElementById('j-grat3').value.trim();
  const r1=document.getElementById('j-refl1').value.trim(),r2=document.getElementById('j-refl2').value.trim();
  if(!a1&&!a2&&!a3&&!g1&&!g2&&!g3&&!r1&&!r2){showToast('내용을 입력해 주세요 🖊');return;}
  const entry={date:todayStr(),affirmations:[a1,a2,a3],gratitudes:[g1,g2,g3],reflections:[r1,r2],mood:jCurrentMood,savedAt:new Date().toISOString()};
  const btn=document.getElementById('j-saveBtn'),sp=document.getElementById('j-syncSpinner'),bt=document.getElementById('j-saveBtnText');
  btn.disabled=true;await jSaveEntry(entry);jAllEntries=await jGetAllEntries();
  if(jIsConfigured()){sp.classList.add('active');bt.textContent='노션 동기화 중…';const ok=await jSyncToNotion(entry);sp.classList.remove('active');jUpdateDot(ok?'ok':'err');showToast(ok?'저장 + 노션 동기화 완료 ✨':'로컬 저장 완료 (노션 실패)');}
  else{showToast('저장되었어요 ✨');}
  bt.textContent='저장 완료 ✓';btn.classList.add('saved');btn.disabled=false;
  setTimeout(()=>{bt.textContent='저장하기';btn.classList.remove('saved');},2000);
}
async function jLoadToday(){const entry=jAllEntries[todayStr()];if(!entry)return;['j-aff1','j-aff2','j-aff3'].forEach((id,i)=>{const el=document.getElementById(id);el.value=(entry.affirmations||[])[i]||'';autoResize(el);});['j-grat1','j-grat2','j-grat3'].forEach((id,i)=>{const el=document.getElementById(id);el.value=(entry.gratitudes||[])[i]||'';autoResize(el);});['j-refl1','j-refl2'].forEach((id,i)=>{const el=document.getElementById(id);el.value=(entry.reflections||[])[i]||'';autoResize(el);});if(entry.mood){document.querySelectorAll('.mood-btn').forEach(b=>{if(b.dataset.mood===entry.mood){b.classList.add('selected');jCurrentMood=entry.mood;}});}}
function jRenderCalendar(){const y=jCalDate.getFullYear(),m=jCalDate.getMonth();document.getElementById('j-cal-month').textContent=`${y}년 ${MONTHS_KR[m]}`;const grid=document.getElementById('j-cal-grid');grid.innerHTML='';DAYS_KR.forEach(d=>{const el=document.createElement('div');el.className='cal-day-label';el.textContent=d;grid.appendChild(el);});const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),today=new Date();for(let i=0;i<fd;i++){const el=document.createElement('div');el.className='cal-cell empty';grid.appendChild(el);}for(let d=1;d<=dim;d++){const key=formatKey(y,m,d),el=document.createElement('div');el.className='cal-cell';const num=document.createElement('div');num.className='cal-num';num.textContent=d;el.appendChild(num);if(jAllEntries[key]){const dot=document.createElement('div');dot.className='cal-dot';dot.style.background='var(--accent)';el.appendChild(dot);}if(today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d)el.classList.add('today');if(jSelectedDay===key)el.classList.add('selected');el.onclick=()=>{jSelectedDay=key;document.querySelectorAll('#j-cal-grid .cal-cell.selected').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');jRenderEntryViewer(key);};grid.appendChild(el);}if(jSelectedDay)jRenderEntryViewer(jSelectedDay);}
function jRenderEntryViewer(key){const viewer=document.getElementById('j-entry-viewer'),entry=jAllEntries[key];if(!entry){viewer.innerHTML=`<div class="no-entry"><div class="no-entry-icon">${key===todayStr()?'✍️':'📭'}</div><div>${key===todayStr()?'오늘 아직 기록이 없어요.<br>오늘 탭에서 작성해 보세요.':'이 날의 기록이 없어요.'}</div></div>`;return;}const affs=(entry.affirmations||[]).filter(a=>a),grats=(entry.gratitudes||[]).filter(a=>a),refls=(entry.reflections||[]).filter(a=>a);viewer.innerHTML=`<div class="entry-viewer"><div class="entry-date-label">${keyToDisplay(key)} ${entry.mood||''}</div>${affs.length?`<div class="entry-section-title">확언</div><div class="entry-aff-list">${affs.map((a,i)=>`<div class="entry-aff-row"><span class="entry-aff-num">${i+1}.</span><span>${a}</span></div>`).join('')}</div>`:''}${grats.length?`<div class="entry-section-title">감사일기</div><div class="entry-aff-list">${grats.map((g,i)=>`<div class="entry-aff-row"><span class="entry-aff-num" style="color:var(--gold)">${['🌸','🌿','✨'][i]||'•'}</span><span>${g}</span></div>`).join('')}</div>`:''}${refls.length?`<div class="entry-section-title">오늘의 반성</div><div class="entry-aff-list">${refls.map((r,i)=>`<div class="entry-aff-row"><span class="entry-aff-num" style="color:var(--text2)">${['🪞','💭'][i]||'•'}</span><span>${r}</span></div>`).join('')}</div>`:''}</div>`;}
function jChangeMonth(dir){jCalDate=new Date(jCalDate.getFullYear(),jCalDate.getMonth()+dir,1);jSelectedDay=null;document.getElementById('j-entry-viewer').innerHTML='';jRenderCalendar();}
function jRenderStats(){const entries=Object.values(jAllEntries).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('j-totalDays').textContent=entries.length;const now=new Date();document.getElementById('j-thisMonth').textContent=entries.filter(e=>e.date.startsWith(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`)).length;document.getElementById('j-totalAff').textContent=entries.reduce((s,e)=>s+(e.affirmations||[]).filter(a=>a).length,0);let streak=0,cd=new Date();cd.setHours(0,0,0,0);while(jAllEntries[`${cd.getFullYear()}-${String(cd.getMonth()+1).padStart(2,'0')}-${String(cd.getDate()).padStart(2,'0')}`]){streak++;cd.setDate(cd.getDate()-1);}document.getElementById('j-streakCount').textContent=streak+'일';const we=document.getElementById('j-streakWeeks');we.innerHTML='';for(let i=27;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=formatKey(d.getFullYear(),d.getMonth(),d.getDate());const dot=document.createElement('div');dot.className='streak-dot'+(jAllEntries[key]?' filled':'');we.appendChild(dot);}const re=document.getElementById('j-recentEntries');re.innerHTML='';if(!entries.length){re.innerHTML='<div class="no-entry"><div class="no-entry-icon">🌱</div><div>아직 기록이 없어요.<br>오늘 첫 번째 기록을 남겨보세요!</div></div>';return;}entries.slice(0,5).forEach(entry=>{const card=document.createElement('div');card.className='recent-card';const preview=entry.affirmations?.find(a=>a)||entry.gratitudes?.find(a=>a)||entry.reflections?.find(a=>a)||'';card.innerHTML=`<div class="recent-card-date"><span>${keyToDisplay(entry.date)}</span><span>${entry.mood||''}</span></div><div class="recent-card-preview">${preview||'내용 없음'}</div>`;re.appendChild(card);});}
function jOpenSettings(){document.getElementById('j-settingsOverlay').classList.add('open');}
function jCloseSettings(){document.getElementById('j-settingsOverlay').classList.remove('open');}
async function jSaveNotionSettings(){const token=document.getElementById('j-inputToken').value.trim(),dbId=document.getElementById('j-inputDbId').value.trim(),proxy=document.getElementById('j-inputProxy').value.trim().replace(/\/$/,'');if(!token||!dbId||!proxy){showToast('세 항목 모두 입력해 주세요');return;}showToast('연결 확인 중…');try{const res=await fetch(`${proxy}/v1/databases/${dbId}`,{headers:{'Authorization':`Bearer ${token}`,'Notion-Version':'2022-06-28'}});if(res.ok){localStorage.setItem('notion_token',token);localStorage.setItem('notion_db_id',dbId);localStorage.setItem('notion_proxy',proxy);jUpdateDot('ok');showToast('노션 연결 성공! ✨');setTimeout(jCloseSettings,1200);}else{showToast('연결 실패');jUpdateDot('err');}}catch(e){showToast('프록시 연결 실패');jUpdateDot('err');}}
function jClearNotionSettings(){['notion_token','notion_db_id','notion_proxy'].forEach(k=>localStorage.removeItem(k));document.getElementById('j-inputToken').value='';document.getElementById('j-inputDbId').value='';document.getElementById('j-inputProxy').value='';jUpdateDot('');showToast('노션 설정 초기화');}
async function jSyncToNotion(entry){
  const c=jGetConfig();if(!c.token||!c.dbId||!c.proxy)return false;
  try{
    const dbRes=await fetch(`${c.proxy}/v1/databases/${c.dbId}`,{headers:{'Authorization':`Bearer ${c.token}`,'Notion-Version':'2022-06-28'}});
    if(!dbRes.ok){const e=await dbRes.json().catch(()=>({}));showToast(`노션 오류: ${e.message||dbRes.status}`);return false;}
    const props=(await dbRes.json()).properties||{};
    const fp=cs=>cs.find(c=>props[c])||null;
    const tk=Object.keys(props).find(k=>props[k].type==='title')||'이름';
    const dk=fp(['날짜','Date','date','일자']),a1k=fp(['확언 1','확언1','Affirmation 1']),a2k=fp(['확언 2','확언2','Affirmation 2']),a3k=fp(['확언 3','확언3','Affirmation 3']);
    const g1k=fp(['감사 1','감사1','Gratitude 1']),g2k=fp(['감사 2','감사2','Gratitude 2']),g3k=fp(['감사 3','감사3','Gratitude 3']),mk=fp(['기분','Mood','mood']);
    const r1k=fp(['반성 1','반성1','Reflection 1']),r2k=fp(['반성 2','반성2','Reflection 2']);
    const pp={};pp[tk]={title:[{text:{content:entry.date}}]};
    if(dk)pp[dk]={date:{start:entry.date}};
    if(a1k)pp[a1k]={rich_text:[{text:{content:entry.affirmations?.[0]||''}}]};if(a2k)pp[a2k]={rich_text:[{text:{content:entry.affirmations?.[1]||''}}]};if(a3k)pp[a3k]={rich_text:[{text:{content:entry.affirmations?.[2]||''}}]};
    if(g1k)pp[g1k]={rich_text:[{text:{content:entry.gratitudes?.[0]||''}}]};if(g2k)pp[g2k]={rich_text:[{text:{content:entry.gratitudes?.[1]||''}}]};if(g3k)pp[g3k]={rich_text:[{text:{content:entry.gratitudes?.[2]||''}}]};
    if(r1k)pp[r1k]={rich_text:[{text:{content:entry.reflections?.[0]||''}}]};if(r2k)pp[r2k]={rich_text:[{text:{content:entry.reflections?.[1]||''}}]};
    if(mk&&entry.mood)pp[mk]=props[mk]?.type==='select'?{select:{name:entry.mood}}:{rich_text:[{text:{content:entry.mood}}]};
    let existingId=null;
    if(dk){const qr=await fetch(`${c.proxy}/v1/databases/${c.dbId}/query`,{method:'POST',headers:{'Authorization':`Bearer ${c.token}`,'Notion-Version':'2022-06-28','Content-Type':'application/json'},body:JSON.stringify({filter:{property:dk,date:{equals:entry.date}},page_size:1})});if(qr.ok){const qd=await qr.json();existingId=qd.results?.[0]?.id||null;}}
    const url=existingId?`${c.proxy}/v1/pages/${existingId}`:`${c.proxy}/v1/pages`,method=existingId?'PATCH':'POST',body=existingId?{properties:pp}:{parent:{database_id:c.dbId},properties:pp};
    const sr=await fetch(url,{method,headers:{'Authorization':`Bearer ${c.token}`,'Notion-Version':'2022-06-28','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!sr.ok){const e=await sr.json().catch(()=>({}));showToast(`노션 저장 실패: ${(e.message||sr.status).toString().slice(0,40)}`);return false;}
    return true;
  }catch(e){showToast(`노션 오류: ${e.message?.slice(0,40)||'네트워크 확인'}`);return false;}
}

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
async function init(){
  currentTheme=localStorage.getItem('app-theme')||'system';
  applyTheme();
  const now=new Date();
  document.getElementById('topbar-sub').textContent=`${now.getMonth()+1}월 ${now.getDate()}일 (${DAYS_KR[now.getDay()]})`;
  document.getElementById('topbar-title').textContent='나의 하루';
  // 일기
  await jInitDB();jAllEntries=await jGetAllEntries();await jLoadToday();jRenderTodayDate();
  document.getElementById('j-inputToken').value=localStorage.getItem('notion_token')||'';
  document.getElementById('j-inputDbId').value=localStorage.getItem('notion_db_id')||'';
  document.getElementById('j-inputProxy').value=localStorage.getItem('notion_proxy')||'';
  jUpdateSyncBanner();
  renderTopbarActions();
  // 앱 시작 시 노션 연동된 탭 자동 동기화
  autoSyncAll();
}

// 앱 열 때 자동으로 한 번 불러오기
let _isSyncing=false;
async function autoSyncAll(){
  if(_isSyncing)return;
  const lastAuto=localStorage.getItem('last-auto-sync');
  const now=Date.now();
  // 마지막 자동 동기화로부터 30분 이상 지났을 때만
  if(lastAuto && now-parseInt(lastAuto) < 30*60*1000) return;
  _isSyncing=true;
  localStorage.setItem('last-auto-sync', now+'');
  try{
    if(jIsConfigured()) await jPullFromNotion(true);
  }finally{_isSyncing=false;}
}

// ════════════════════════════════════════
// SYNC BANNERS
// ════════════════════════════════════════
function fmtSyncTime(ts){ if(!ts)return'동기화 안 됨'; const d=new Date(parseInt(ts)); return`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }

function jUpdateSyncBanner(){
  const has=jIsConfigured();
  const banner=document.getElementById('j-sync-banner');
  if(banner)banner.style.display=has?'flex':'none';
  const el=document.getElementById('j-last-sync');
  if(el)el.textContent='마지막 동기화: '+fmtSyncTime(localStorage.getItem('j-last-pull'));
}

// ════════════════════════════════════════
// JOURNAL PULL FROM NOTION
// ════════════════════════════════════════
async function jPullFromNotion(silent=false){
  const c=jGetConfig();
  if(!c.token||!c.dbId||!c.proxy){if(!silent)showToast('노션 설정을 먼저 해주세요');return;}
  const btn=document.getElementById('j-pull-btn');
  if(btn){btn.innerHTML='<span class="spin">↻</span> 불러오는 중…';btn.classList.add('loading');}
  try{
    const headers={'Authorization':`Bearer ${c.token}`,'Notion-Version':'2022-06-28','Content-Type':'application/json'};
    const dbRes=await fetch(`${c.proxy}/v1/databases/${c.dbId}`,{headers});
    if(!dbRes.ok)throw new Error('DB 조회 실패');
    const props=(await dbRes.json()).properties||{};
    const fp=cs=>cs.find(x=>props[x])||null;
    const dk=fp(['날짜','Date','date','일자']);
    const a1k=fp(['확언 1','확언1','Affirmation 1']),a2k=fp(['확언 2','확언2','Affirmation 2']),a3k=fp(['확언 3','확언3','Affirmation 3']);
    const g1k=fp(['감사 1','감사1','Gratitude 1']),g2k=fp(['감사 2','감사2','Gratitude 2']),g3k=fp(['감사 3','감사3','Gratitude 3']);
    const r1k=fp(['반성 1','반성1','Reflection 1']),r2k=fp(['반성 2','반성2','Reflection 2']);
    const mk=fp(['기분','Mood','mood']);
    // 전체 조회
    let allResults=[],cursor=undefined;
    do{
      const body={page_size:100};
      if(cursor)body.start_cursor=cursor;
      const qRes=await fetch(`${c.proxy}/v1/databases/${c.dbId}/query`,{method:'POST',headers,body:JSON.stringify(body)});
      if(!qRes.ok)break;
      const qData=await qRes.json();
      allResults=[...allResults,...(qData.results||[])];
      cursor=qData.has_more?qData.next_cursor:undefined;
    }while(cursor && allResults.length<500);
    // 파싱
    let imported=0;
    for(const page of allResults){
      const p=page.properties||{};
      const dateVal=dk&&p[dk]?.date?.start;
      if(!dateVal)continue;
      const dateStr=dateVal.slice(0,10);
      const getText=k=>k&&p[k]?.rich_text?.map(r=>r.plain_text).join('')||'';
      const getMood=k=>k&&(p[k]?.select?.name||p[k]?.rich_text?.map(r=>r.plain_text).join(''))||'';
      const entry={
        date:dateStr,
        affirmations:[getText(a1k),getText(a2k),getText(a3k)],
        gratitudes:[getText(g1k),getText(g2k),getText(g3k)],
        reflections:[getText(r1k),getText(r2k)],
        mood:getMood(mk),
        savedAt:page.last_edited_time||new Date().toISOString(),
        fromNotion:true
      };
      // 내용이 하나라도 있을 때만
      if(entry.affirmations.some(a=>a)||entry.gratitudes.some(g=>g)||entry.reflections.some(r=>r)){
        await jSaveEntry(entry);imported++;
      }
    }
    jAllEntries=await jGetAllEntries();
    await jLoadToday();
    localStorage.setItem('j-last-pull',Date.now()+'');
    jUpdateSyncBanner();
    if(!silent)showToast(`✓ 일기 ${imported}개 불러옴`);
  }catch(e){
    if(!silent)showToast(`일기 불러오기 실패: ${e.message?.slice(0,30)||'오류'}`);
  }finally{
    if(btn){btn.innerHTML='↓ 불러오기';btn.classList.remove('loading');}
  }
}

// ════════════════════════════════════════
init();
</script>
