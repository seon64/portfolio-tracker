<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="todo" />
  <meta name="theme-color" content="#f6f6f4" />
  <title>todo</title>
  <style>
    :root {
      --bg: #f6f6f4;
      --paper: #ffffff;
      --text: #171717;
      --muted: #777b80;
      --line: #dedfdf;
      --header: #f0f0ed;
      --now: #fff6d8;
      --accent: #202124;
      --done: #9a9da1;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Noto Sans KR", sans-serif;
    }

    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
    }

    .app {
      width: min(100%, 430px);
      margin: 0 auto;
      min-height: 100vh;
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 12px 10px;
      background: rgba(246,246,244,.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(0,0,0,.05);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 780;
      letter-spacing: -.03em;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .small-btn, .arrow-btn {
      border: 1px solid var(--line);
      background: var(--paper);
      min-height: 42px;
      border-radius: 12px;
      font-weight: 700;
    }

    .small-btn { padding: 0 13px; font-size: 13px; }
    .arrow-btn { width: 42px; padding: 0; font-size: 21px; }

    .date-nav {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      gap: 8px;
      align-items: stretch;
    }

    .date-box {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 7px 10px;
    }

    .date-main { font-size: 18px; font-weight: 780; letter-spacing: -.02em; }
    .date-sub { margin-top: 3px; font-size: 11px; font-weight: 650; color: var(--muted); }

    .summary {
      margin-top: 9px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 9px;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }

    .progress {
      height: 6px;
      background: #e7e7e4;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: inherit;
      transition: width .2s ease;
    }

    .clear {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 0 7px 7px;
      font-size: 11px;
    }

    main { padding: 12px; }

    .table-wrap {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }

    .todo-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .todo-table col.time-col { width: 70px; }
    .todo-table col.check-col { width: 48px; }
    .todo-table col.task-col { width: auto; }

    .todo-table thead th {
      position: sticky;
      top: 145px;
      z-index: 10;
      height: 40px;
      background: var(--header);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      font-weight: 750;
      text-align: center;
    }

    .todo-table thead th + th,
    .todo-table tbody td + td {
      border-left: 1px solid var(--line);
    }

    .todo-table tbody tr {
      height: 58px;
      border-bottom: 1px solid var(--line);
    }

    .todo-table tbody tr:last-child { border-bottom: 0; }
    .todo-table tbody tr.now { background: var(--now); }

    .time-cell {
      text-align: center;
      font-size: 13px;
      font-weight: 760;
      color: #36383a;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      background: rgba(248,248,246,.75);
    }

    .check-cell { text-align: center; }

    .task-cell { padding: 5px 9px; }

    .todo-check {
      appearance: none;
      -webkit-appearance: none;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      border: 1.8px solid #9da0a4;
      background: #fff;
      margin: 0;
      display: inline-grid;
      place-content: center;
      vertical-align: middle;
    }

    .todo-check::before {
      content: "";
      width: 8px;
      height: 4px;
      border-left: 2px solid transparent;
      border-bottom: 2px solid transparent;
      transform: rotate(-45deg) translate(1px,-1px);
    }

    .todo-check:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .todo-check:checked::before {
      border-left-color: #fff;
      border-bottom-color: #fff;
    }

    .task-input {
      width: 100%;
      min-height: 44px;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      line-height: 1.35;
      padding: 8px 2px;
    }

    .task-input::placeholder { color: #b2b4b6; }

    tr.done .task-input {
      color: var(--done);
      text-decoration: line-through;
    }

    .actions {
      margin-top: 11px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .action-btn {
      min-height: 44px;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .hint {
      margin: 13px 12px 0;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 360px) {
      .todo-table col.time-col { width: 62px; }
      .todo-table col.check-col { width: 44px; }
      .time-cell { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="title-row">
        <h1>todo</h1>
        <button class="small-btn" id="todayBtn">오늘</button>
      </div>

      <div class="date-nav">
        <button class="arrow-btn" id="prevBtn" aria-label="이전 날짜">‹</button>
        <div class="date-box" id="dateBox"></div>
        <button class="arrow-btn" id="nextBtn" aria-label="다음 날짜">›</button>
      </div>

      <div class="summary">
        <span id="countText">0 / 0 완료</span>
        <div class="progress"><div id="progressBar"></div></div>
        <button class="clear" id="clearBtn">비우기</button>
      </div>
    </header>

    <main>
      <div class="table-wrap">
        <table class="todo-table" aria-label="시간별 할 일 표">
          <colgroup>
            <col class="time-col" />
            <col class="check-col" />
            <col class="task-col" />
          </colgroup>
          <thead>
            <tr>
              <th scope="col">시간</th>
              <th scope="col">체크</th>
              <th scope="col">할 일</th>
            </tr>
          </thead>
          <tbody id="todoBody"></tbody>
        </table>
      </div>

      <div class="actions">
        <button class="action-btn" id="nowBtn">현재 시간으로</button>
        <button class="action-btn" id="copyBtn">오늘 내용 복사</button>
      </div>

      <p class="hint">05:00부터 24:00까지 30분 단위로 시간이 항상 1열에 표시됩니다. 2열에서 완료 체크, 3열에서 할 일을 입력하세요.</p>
    </main>
  </div>

<script>
  const STORAGE_PREFIX = 'todo-table-v1:';
  const todoBody = document.getElementById('todoBody');
  const dateBox = document.getElementById('dateBox');
  const countText = document.getElementById('countText');
  const progressBar = document.getElementById('progressBar');

  let selectedDate = startOfDay(new Date());

  function startOfDay(value) {
    const d = new Date(value);
    d.setHours(0,0,0,0);
    return d;
  }

  function keyFor(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2,'0');
    const d = String(date.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }

  function dayName(date) {
    return new Intl.DateTimeFormat('ko-KR', { weekday: 'long' }).format(date);
  }

  function fullDate(date) {
    return new Intl.DateTimeFormat('ko-KR', {
      year: 'numeric', month: 'long', day: 'numeric'
    }).format(date);
  }

  function makeSlots() {
    const slots = [];
    for (let minutes = 5 * 60; minutes <= 24 * 60; minutes += 30) {
      const hour = Math.floor(minutes / 60);
      const minute = minutes % 60;
      slots.push(`${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`);
    }
    return slots;
  }

  const SLOTS = makeSlots();

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_PREFIX + keyFor(selectedDate))) || {};
    } catch {
      return {};
    }
  }

  function save(data) {
    localStorage.setItem(STORAGE_PREFIX + keyFor(selectedDate), JSON.stringify(data));
  }

  function renderDate() {
    const isToday = selectedDate.getTime() === startOfDay(new Date()).getTime();
    dateBox.innerHTML = `
      <div class="date-main">${fullDate(selectedDate)}</div>
      <div class="date-sub">${dayName(selectedDate)}${isToday ? ' · 오늘' : ''}</div>
    `;
  }

  function renderRows() {
    const data = load();
    const today = startOfDay(new Date());
    const isToday = selectedDate.getTime() === today.getTime();
    const now = new Date();
    const currentRounded = Math.floor((now.getHours() * 60 + now.getMinutes()) / 30) * 30;

    todoBody.innerHTML = '';

    SLOTS.forEach(slot => {
      const [h, m] = slot.split(':').map(Number);
      const item = data[slot] || { text: '', done: false };
      const row = document.createElement('tr');
      row.dataset.slot = slot;

      if (item.done) row.classList.add('done');
      if (isToday && h < 24 && h * 60 + m === currentRounded) row.classList.add('now');

      const timeTd = document.createElement('td');
      timeTd.className = 'time-cell';
      timeTd.textContent = slot;

      const checkTd = document.createElement('td');
      checkTd.className = 'check-cell';
      const check = document.createElement('input');
      check.type = 'checkbox';
      check.className = 'todo-check';
      check.checked = !!item.done;
      check.setAttribute('aria-label', `${slot} 완료`);
      check.addEventListener('change', () => {
        const fresh = load();
        const current = fresh[slot] || { text: '', done: false };
        current.done = check.checked;
        fresh[slot] = current;
        save(fresh);
        row.classList.toggle('done', current.done);
        updateSummary(fresh);
      });
      checkTd.appendChild(check);

      const taskTd = document.createElement('td');
      taskTd.className = 'task-cell';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'task-input';
      input.value = item.text || '';
      input.placeholder = '할 일을 입력하세요';
      input.autocomplete = 'off';
      input.enterKeyHint = 'done';
      input.setAttribute('aria-label', `${slot} 할 일`);
      input.addEventListener('input', () => {
        const fresh = load();
        const current = fresh[slot] || { text: '', done: false };
        current.text = input.value;
        fresh[slot] = current;
        save(fresh);
        updateSummary(fresh);
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') input.blur();
      });
      taskTd.appendChild(input);

      row.append(timeTd, checkTd, taskTd);
      todoBody.appendChild(row);
    });

    updateSummary(data);
  }

  function updateSummary(data = load()) {
    const written = SLOTS.filter(slot => (data[slot]?.text || '').trim());
    const done = written.filter(slot => data[slot]?.done).length;
    countText.textContent = `${done} / ${written.length} 완료`;
    progressBar.style.width = written.length ? `${Math.round(done / written.length * 100)}%` : '0%';
  }

  function render() {
    renderDate();
    renderRows();
  }

  function moveDate(amount) {
    const d = new Date(selectedDate);
    d.setDate(d.getDate() + amount);
    selectedDate = startOfDay(d);
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function scrollToNow() {
    selectedDate = startOfDay(new Date());
    render();
    requestAnimationFrame(() => {
      const row = document.querySelector('tr.now');
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  document.getElementById('prevBtn').addEventListener('click', () => moveDate(-1));
  document.getElementById('nextBtn').addEventListener('click', () => moveDate(1));
  document.getElementById('todayBtn').addEventListener('click', scrollToNow);
  document.getElementById('nowBtn').addEventListener('click', scrollToNow);

  document.getElementById('clearBtn').addEventListener('click', () => {
    const data = load();
    const hasContent = Object.values(data).some(v => (v.text || '').trim() || v.done);
    if (!hasContent) return;
    if (confirm(`${fullDate(selectedDate)}의 내용을 모두 지울까요?`)) {
      localStorage.removeItem(STORAGE_PREFIX + keyFor(selectedDate));
      renderRows();
    }
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const data = load();
    const lines = SLOTS
      .filter(slot => (data[slot]?.text || '').trim())
      .map(slot => `${data[slot]?.done ? '✓' : '○'} ${slot} ${data[slot].text.trim()}`);

    if (!lines.length) {
      alert('복사할 일정이 없습니다.');
      return;
    }

    const text = `${keyFor(selectedDate)} ${dayName(selectedDate)}\n\n${lines.join('\n')}`;

    try {
      await navigator.clipboard.writeText(text);
      alert('일정이 복사되었습니다.');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      alert('일정이 복사되었습니다.');
    }
  });

  render();
</script>
</body>
</html>
