<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>식사 계획표</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: linear-gradient(135deg, #0F0C29 0%, #302B63 50%, #24243E 100%);
    --card: rgba(255,255,255,0.07);
    --card-border: rgba(255,255,255,0.1);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --dim: #475569;
    --accent-am: #F59E0B;
    --accent-lunch: #3B82F6;
    --accent-pm: #7C3AED;
    --purple: #a78bfa;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
  }

  .app { max-width: 560px; margin: 0 auto; padding: 32px 20px 60px; }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-right { display: flex; gap: 8px; align-items: center; }

  .btn-sync {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 7px 12px;
    color: var(--text);
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    font-family: inherit;
  }
  .btn-sync:hover { background: rgba(255,255,255,0.13); }
  .btn-sync.ok { border-color: rgba(34,197,94,0.4); color: #86efac; }
  .btn-sync.error { border-color: rgba(239,68,68,0.4); color: #fca5a5; }

  .btn-settings {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    width: 36px; height: 36px;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-settings:hover { background: rgba(255,255,255,0.13); }

  /* ── Status bar ── */
  .status-bar {
    margin: 8px 0 0;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--dim);
  }
  .status-bar.ok { background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.25); color: #86efac; }
  .status-bar.error { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.25); color: #fca5a5; }
  .status-bar a { color: var(--purple); cursor: pointer; font-weight: 600; text-decoration: none; }

  .subtitle { margin: 12px 0 20px; font-size: 13px; color: var(--dim); }

  /* ── Week nav ── */
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 10px 16px;
    margin-bottom: 20px;
    border: 1px solid var(--card-border);
  }
  .week-nav-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    border-radius: 10px;
    width: 36px; height: 36px;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .week-nav-btn:hover { background: rgba(255,255,255,0.14); }
  .week-label { font-weight: 700; font-size: 16px; color: var(--text); text-align: center; }
  .week-range { font-size: 12px; color: #64748b; margin-top: 2px; text-align: center; }

  /* ── Day tabs ── */
  .day-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 12px;
    border-radius: 12px;
    min-width: 48px;
    border: 2px solid transparent;
    background: rgba(255,255,255,0.06);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .day-tab:hover { background: rgba(255,255,255,0.1); }
  .day-tab.active { background: linear-gradient(135deg, #7c3aed, #3b82f6); }
  .day-tab.today { border-color: var(--purple); }
  .day-name { font-size: 11px; color: var(--muted); font-weight: 600; }
  .day-tab.active .day-name { color: #e2e8f0; }
  .day-num { font-size: 15px; font-weight: 800; color: #cbd5e1; margin-top: 2px; }
  .day-tab.active .day-num { color: #fff; }
  .today-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--purple); margin-top: 3px; }

  /* ── Meal cards ── */
  .meal-list { display: flex; flex-direction: column; gap: 12px; }

  .meal-card {
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--card-border);
    overflow: hidden;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .meal-header {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .meal-name {
    font-weight: 700; font-size: 15px;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .meal-name.am { background: linear-gradient(90deg, #F59E0B, #fff); -webkit-background-clip: text; }
  .meal-name.lunch { background: linear-gradient(90deg, #3B82F6, #fff); -webkit-background-clip: text; }
  .meal-name.pm { background: linear-gradient(90deg, #7C3AED, #fff); -webkit-background-clip: text; }

  .meal-body { padding: 12px 16px 14px; }

  .meal-value-row { display: flex; align-items: center; justify-content: space-between; }
  .meal-value { font-size: 15px; color: var(--text); font-weight: 500; }

  .meal-actions { display: flex; gap: 6px; }
  .btn-icon {
    border-radius: 8px; padding: 5px 8px;
    cursor: pointer; font-size: 13px; line-height: 1;
    border: none; background: none;
  }
  .btn-edit { background: rgba(59,130,246,0.13); border: 1px solid rgba(59,130,246,0.27); }
  .btn-del  { background: rgba(239,68,68,0.13); border: 1px solid rgba(239,68,68,0.27); }

  .btn-add {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1.5px dashed rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 12px;
    color: #64748b;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .btn-add:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.25); color: var(--muted); }

  .edit-row { display: flex; gap: 8px; }
  .edit-input {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 9px 13px;
    color: #fff;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .edit-input.am { border: 1.5px solid #F59E0B; }
  .edit-input.lunch { border: 1.5px solid #3B82F6; }
  .edit-input.pm { border: 1.5px solid #7C3AED; }

  .btn-save {
    border: none; border-radius: 10px;
    padding: 0 16px; color: #fff;
    font-weight: 700; font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .btn-save.am { background: #F59E0B; }
  .btn-save.lunch { background: #3B82F6; }
  .btn-save.pm { background: #7C3AED; }

  .btn-cancel {
    background: rgba(255,255,255,0.1); border: none;
    border-radius: 10px; padding: 0 12px;
    color: var(--muted); font-size: 13px;
    cursor: pointer; font-family: inherit;
  }

  /* ── Summary ── */
  .summary {
    margin-top: 4px;
    padding: 14px 18px;
    border-radius: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
  }
  .summary-title {
    font-size: 11px; color: #64748b; font-weight: 600;
    margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .summary-row { display: flex; gap: 8px; margin-bottom: 4px; align-items: center; }
  .summary-label { font-size: 12px; color: var(--muted); width: 28px; }
  .summary-val { font-size: 13px; color: var(--text); }
  .summary-val.empty { color: #334155; }

  /* ── Settings Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal-overlay.hidden { display: none; }

  .modal {
    background: linear-gradient(135deg, #1e1b4b, #1e293b);
    border-radius: 20px; padding: 28px;
    width: 100%; max-width: 440px;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  .modal-header {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 20px;
  }
  .modal-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  .btn-close {
    background: none; border: none;
    color: #64748b; font-size: 20px; cursor: pointer;
  }
  .notice {
    background: rgba(251,191,36,0.08);
    border: 1px solid rgba(251,191,36,0.2);
    border-radius: 10px; padding: 10px 14px;
    margin-bottom: 20px; font-size: 12px;
    color: #fbbf24; line-height: 1.7;
  }
  .field-label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .field-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .text-input {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; padding: 10px 14px;
    color: #fff; font-size: 14px; outline: none;
    font-family: inherit; width: 100%;
  }
  .text-input:focus { border-color: var(--purple); }
  .btn-toggle {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 0 12px;
    color: var(--muted); font-size: 13px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .hint { font-size: 11px; color: var(--dim); line-height: 1.6; margin-bottom: 20px; }
  .hint b { color: #7c3aed; }
  .modal-actions { display: flex; gap: 10px; }
  .btn-primary {
    flex: 1;
    background: linear-gradient(135deg, #7c3aed, #3b82f6);
    border: none; border-radius: 12px; padding: 12px;
    color: #fff; font-weight: 700; font-size: 14px;
    cursor: pointer; font-family: inherit;
  }
  .btn-secondary {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 12px;
    color: var(--muted); font-weight: 600; font-size: 14px;
    cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>

<!-- Settings Modal -->
<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title"><span>⚙️</span> 노션 연동 설정</div>
      <button class="btn-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="notice">
      💡 노션에서 <b>Integration</b>을 만들고 토큰을 복사하세요.<br>
      데이터베이스에 <b>날짜, 아침, 점심, 저녁</b> 속성이 필요해요.<br>
      Integration을 해당 데이터베이스에 연결(Share)해야 해요.
    </div>
    <label class="field-label">노션 Integration 토큰</label>
    <div class="field-row">
      <input id="tokenInput" type="password" class="text-input" placeholder="secret_xxxxxxxxxxxx" />
      <button class="btn-toggle" onclick="toggleToken()">보기</button>
    </div>
    <label class="field-label">데이터베이스 ID</label>
    <div style="margin-bottom:8px">
      <input id="dbIdInput" type="text" class="text-input" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" />
    </div>
    <p class="hint">
      데이터베이스 URL에서 ID를 찾을 수 있어요:<br>
      notion.so/.../<b>여기가-database-id</b>?v=...
    </p>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveSettings()">저장</button>
      <button class="btn-secondary" onclick="closeSettings()">취소</button>
    </div>
  </div>
</div>

<!-- App -->
<div class="app">
  <div class="header">
    <div class="header-left">
      <span style="font-size:28px">🍽️</span>
      <h1 class="header-title">식사 계획표</h1>
    </div>
    <div class="header-right">
      <button class="btn-sync" id="syncBtn" onclick="handleSync()">
        <span id="syncIcon">📤</span>
        <span id="syncText">노션 동기화</span>
      </button>
      <button class="btn-settings" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    노션 미연결 — <a onclick="openSettings()">설정에서 연결하기 →</a>
  </div>

  <p class="subtitle">하루 세 끼를 미리 계획해보세요</p>

  <!-- Week Nav -->
  <div class="week-nav">
    <button class="week-nav-btn" onclick="changeWeek(-1)">‹</button>
    <div>
      <div class="week-label" id="weekLabel">이번 주</div>
      <div class="week-range" id="weekRange"></div>
    </div>
    <button class="week-nav-btn" onclick="changeWeek(1)">›</button>
  </div>

  <!-- Day Tabs -->
  <div class="day-tabs" id="dayTabs"></div>

  <!-- Meal Cards -->
  <div class="meal-list" id="mealList"></div>
</div>

<script>
const MEALS = ['아침', '점심', '저녁'];
const DAYS  = ['월','화','수','목','금','토','일'];
const MEAL_ICONS = { '아침':'🌅', '점심':'☀️', '저녁':'🌙' };
const MEAL_CLS   = { '아침':'am', '점심':'lunch', '저녁':'pm' };

let weekOffset = 0;
let activeDay  = 0;
let meals      = {};        // { "2025-05-21": { 아침:"...", 점심:"...", 저녁:"..." } }
let editingKey = null;      // "dateKey|meal"
let notionToken = '';
let notionDbId  = '';

// ── Storage (localStorage fallback) ──────────────────────────────────────
function load() {
  try { meals       = JSON.parse(localStorage.getItem('meal-planner-data') || '{}'); } catch{}
  try { notionToken = localStorage.getItem('notion-token') || ''; } catch{}
  try { notionDbId  = localStorage.getItem('notion-db-id') || ''; } catch{}
}
function save() {
  localStorage.setItem('meal-planner-data', JSON.stringify(meals));
}
function saveSettings() {
  notionToken = document.getElementById('tokenInput').value.trim();
  notionDbId  = document.getElementById('dbIdInput').value.trim();
  localStorage.setItem('notion-token', notionToken);
  localStorage.setItem('notion-db-id', notionDbId);
  closeSettings();
  renderStatusBar();
}

// ── Date helpers ─────────────────────────────────────────────────────────
function getWeekDates(offset = 0) {
  const now = new Date();
  const day = now.getDay();
  const diff = now.getDate() - day + (day === 0 ? -6 : 1) + offset * 7;
  return Array.from({length:7}, (_, i) => {
    const d = new Date(now);
    d.setDate(diff + i);
    return d;
  });
}
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtMD(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
function isToday(d) { return fmtDate(d) === fmtDate(new Date()); }

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  const dates = getWeekDates(weekOffset);

  // Week label
  const labels = {'-1':'지난 주', '0':'이번 주', '1':'다음 주'};
  document.getElementById('weekLabel').textContent = labels[weekOffset] ||
    `${dates[0].getMonth()+1}월 ${dates[0].getDate()}일 — ${dates[6].getMonth()+1}월 ${dates[6].getDate()}일`;
  document.getElementById('weekRange').textContent = `${fmtMD(dates[0])} – ${fmtMD(dates[6])}`;

  // Day tabs
  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML = '';
  dates.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (i === activeDay ? ' active' : '') + (isToday(d) ? ' today' : '');
    btn.innerHTML = `
      <span class="day-name">${DAYS[i]}</span>
      <span class="day-num">${d.getDate()}</span>
      ${isToday(d) ? '<span class="today-dot"></span>' : ''}
    `;
    btn.onclick = () => { activeDay = i; render(); };
    tabs.appendChild(btn);
  });

  // Meal cards
  const dateKey = fmtDate(dates[activeDay]);
  const list = document.getElementById('mealList');
  list.innerHTML = '';

  MEALS.forEach(meal => {
    const cls = MEAL_CLS[meal];
    const val = meals[dateKey]?.[meal] || '';
    const key = `${dateKey}|${meal}`;
    const isEditing = editingKey === key;

    const card = document.createElement('div');
    card.className = 'meal-card';
    card.innerHTML = `
      <div class="meal-header">
        <span style="font-size:18px">${MEAL_ICONS[meal]}</span>
        <span class="meal-name ${cls}">${meal}</span>
      </div>
      <div class="meal-body" id="body-${cls}">
        ${isEditing ? `
          <div class="edit-row">
            <input id="editInput-${cls}" class="edit-input ${cls}" placeholder="${meal} 메뉴를 입력하세요" value="${escHtml(val)}" />
            <button class="btn-save ${cls}" onclick="saveMeal('${dateKey}','${meal}','${cls}')">저장</button>
            <button class="btn-cancel" onclick="cancelEdit()">취소</button>
          </div>
        ` : val ? `
          <div class="meal-value-row">
            <span class="meal-value">${escHtml(val)}</span>
            <div class="meal-actions">
              <button class="btn-icon btn-edit" onclick="startEdit('${dateKey}','${meal}')">✏️</button>
              <button class="btn-icon btn-del"  onclick="clearMeal('${dateKey}','${meal}')">🗑️</button>
            </div>
          </div>
        ` : `
          <button class="btn-add" onclick="startEdit('${dateKey}','${meal}')">+ ${meal} 메뉴 추가</button>
        `}
      </div>
    `;
    list.appendChild(card);

    if (isEditing) {
      const inp = document.getElementById(`editInput-${cls}`);
      if (inp) {
        inp.focus();
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') saveMeal(dateKey, meal, cls);
          if (e.key === 'Escape') cancelEdit();
        });
      }
    }
  });

  // Summary
  const summary = document.createElement('div');
  summary.className = 'summary';
  summary.innerHTML = `<div class="summary-title">오늘의 식단 요약</div>` +
    MEALS.map(meal => {
      const v = meals[dateKey]?.[meal];
      return `<div class="summary-row">
        <span>${MEAL_ICONS[meal]}</span>
        <span class="summary-label">${meal}</span>
        <span class="summary-val${v ? '' : ' empty'}">${escHtml(v || '—')}</span>
      </div>`;
    }).join('');
  list.appendChild(summary);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Actions ───────────────────────────────────────────────────────────────
function changeWeek(dir) {
  weekOffset += dir;
  const dates = getWeekDates(weekOffset);
  const todayIdx = dates.findIndex(isToday);
  activeDay = todayIdx >= 0 ? todayIdx : 0;
  render();
}

function startEdit(dateKey, meal) {
  editingKey = `${dateKey}|${meal}`;
  render();
}

function cancelEdit() { editingKey = null; render(); }

function saveMeal(dateKey, meal, cls) {
  const inp = document.getElementById(`editInput-${cls}`);
  const val = inp ? inp.value.trim() : '';
  if (!meals[dateKey]) meals[dateKey] = {};
  if (val) meals[dateKey][meal] = val;
  else delete meals[dateKey][meal];
  save();
  editingKey = null;
  render();
}

function clearMeal(dateKey, meal) {
  if (meals[dateKey]) { delete meals[dateKey][meal]; save(); }
  render();
}

// ── Settings ──────────────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('tokenInput').value = notionToken;
  document.getElementById('dbIdInput').value  = notionDbId;
  document.getElementById('settingsModal').classList.remove('hidden');
}
function closeSettings() {
  document.getElementById('settingsModal').classList.add('hidden');
}
function toggleToken() {
  const inp = document.getElementById('tokenInput');
  const btn = inp.nextElementSibling;
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '숨기기'; }
  else { inp.type = 'password'; btn.textContent = '보기'; }
}

function renderStatusBar() {
  const bar = document.getElementById('statusBar');
  bar.className = 'status-bar';
  if (notionToken && notionDbId) {
    bar.innerHTML = '노션 연결됨 ✓ — 동기화 버튼을 눌러 업데이트하세요';
  } else {
    bar.innerHTML = '노션 미연결 — <a onclick="openSettings()">설정에서 연결하기 →</a>';
  }
}

// ── Notion Sync ───────────────────────────────────────────────────────────
async function notionRequest(method, path, body) {
  const url = `https://api.notion.com/v1${path}`;
  const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxyUrl, {
    method,
    headers: {
      'Content-Type': 'application/json',
      'Notion-Version': '2022-06-28',
      'Authorization': `Bearer ${notionToken}`,
    },
    ...(body ? { body: JSON.stringify(body) } : {}),
  });
  const text = await res.text();
  if (!res.ok) throw new Error(`Notion ${res.status}: ${text.slice(0,200)}`);
  return JSON.parse(text);
}

async function handleSync() {
  if (!notionToken || !notionDbId) { openSettings(); return; }

  const btn  = document.getElementById('syncBtn');
  const icon = document.getElementById('syncIcon');
  const txt  = document.getElementById('syncText');
  const bar  = document.getElementById('statusBar');

  btn.className = 'btn-sync';
  icon.textContent = '⏳'; txt.textContent = '동기화 중...';
  btn.disabled = true;

  try {
    const existing = await notionRequest('POST', `/databases/${notionDbId}/query`, {});
    const existingMap = {};
    for (const page of existing.results) {
      const dv = page.properties?.['날짜']?.date?.start;
      if (dv) existingMap[dv] = page.id;
    }

    let count = 0;
    for (const [date, dayMeals] of Object.entries(meals)) {
      const props = {
        '날짜': { date: { start: date } },
        '아침': { rich_text: [{ text: { content: dayMeals['아침'] || '' } }] },
        '점심': { rich_text: [{ text: { content: dayMeals['점심'] || '' } }] },
        '저녁': { rich_text: [{ text: { content: dayMeals['저녁'] || '' } }] },
      };
      if (existingMap[date]) {
        await notionRequest('PATCH', `/pages/${existingMap[date]}`, { properties: props });
      } else {
        await notionRequest('POST', '/pages', { parent: { database_id: notionDbId }, properties: props });
      }
      count++;
    }

    icon.textContent = '✅'; txt.textContent = '동기화 완료';
    btn.className = 'btn-sync ok';
    bar.className = 'status-bar ok';
    bar.textContent = `${count}개 항목 노션에 동기화 완료 ✓`;
    setTimeout(() => {
      icon.textContent = '📤'; txt.textContent = '노션 동기화';
      btn.className = 'btn-sync';
      renderStatusBar();
    }, 4000);
  } catch(e) {
    icon.textContent = '❌'; txt.textContent = '실패';
    btn.className = 'btn-sync error';
    bar.className = 'status-bar error';
    bar.textContent = `동기화 실패: ${e.message}`;
    setTimeout(() => {
      icon.textContent = '📤'; txt.textContent = '노션 동기화';
      btn.className = 'btn-sync';
      renderStatusBar();
    }, 6000);
  }
  btn.disabled = false;
}

// ── Init ──────────────────────────────────────────────────────────────────
load();
const todayIdx = getWeekDates(0).findIndex(isToday);
activeDay = todayIdx >= 0 ? todayIdx : 0;
renderStatusBar();
render();
</script>
