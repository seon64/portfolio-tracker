/* ── Notion 설정: URL 해시 우선 저장 (사파리 새로고침 완전 대응) ── */

function encodeHash(d){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(d)))); }catch{ return ""; }
}
function decodeHash(s){
  try{ return JSON.parse(decodeURIComponent(escape(atob(s)))); }catch{ return null; }
}

// URL 해시에서 notion 파라미터 읽기
function loadNotionFromHash(){
  try{
    const hash = window.location.hash.slice(1); // '#' 제거
    const params = new URLSearchParams(hash);
    const n = params.get("n");
    if(n) return decodeHash(n);
  }catch{}
  return null;
}

// URL 해시에 notion 파라미터 저장 (새로고침해도 유지됨)
function saveNotionToHash(d){
  try{
    const hash = window.location.hash.slice(1);
    const params = new URLSearchParams(hash);
    params.set("n", encodeHash(d));
    window.location.replace("#" + params.toString());
  }catch{}
}

function loadNotion(){
  const empty = {apiKey:"",dbId:"",enabled:false};
  // 1순위: URL 해시 (새로고침에도 살아남음)
  const fromHash = loadNotionFromHash();
  if(fromHash && (fromHash.apiKey || fromHash.dbId)) return fromHash;
  // 2순위: localStorage
  try{ const v=localStorage.getItem(NOTION_KEY); if(v) return JSON.parse(v); }catch{}
  // 3순위: sessionStorage
  try{ const v=sessionStorage.getItem(NOTION_KEY); if(v) return JSON.parse(v); }catch{}
  return empty;
}

function saveNotion(d){
  // URL 해시 (가장 확실 — 사파리 새로고침 대응)
  saveNotionToHash(d);
  // 나머지도 병행 저장
  const s = JSON.stringify(d);
  try{ localStorage.setItem(NOTION_KEY, s); }catch{}
  try{ sessionStorage.setItem(NOTION_KEY, s); }catch{}
}

function loadNotionFromIDB(callback){ callback(null); } // 더 이상 불필요, 호환용 유지

async function sendToNotion(sentence, notionCfg){
  const {apiKey, dbId} = notionCfg;
  if(!apiKey||!dbId) throw new Error("API 키와 DB ID를 먼저 설정해주세요");
  const PROXY = "https://corsproxy.io/?url=";
  const url = `${PROXY}${encodeURIComponent("https://api.notion.com/v1/pages")}`;
  const body = {
    parent: { database_id: dbId },
    properties: {
      "영어문장": { title: [{ text: { content: sentence.english } }] },
      "한글뜻":   { rich_text: [{ text: { content: sentence.korean } }] },
      "태그":     { multi_select: (sentence.tags||[]).map(t=>({name:t})) },
      "메모":     { rich_text: [{ text: { content: sentence.memo||"" } }] },
      "날짜":     { date: { start: sentence.date } },
      "복습완료": { checkbox: sentence.reviewed||false },
    }
  };
  const res = await fetch(url, {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":`Bearer ${apiKey}`,
      "Notion-Version":"2022-06-28",
    },
    body: JSON.stringify(body),
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error(err.message||`HTTP ${res.status}`);
  }
  return await res.json();
}

/* ── Excel 내보내기 ── */
function exportToExcel(sentences){
  if(!sentences.length){ alert("내보낼 문장이 없어요!"); return; }
  const rows=sentences.map((s,i)=>({
    "번호":i+1,"날짜":s.date,
    "태그":(s.tags||[]).join(", "),
    "한국어":s.korean,"영어(English)":s.english,
    "메모":s.memo||""
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws["!cols"]=[{wch:6},{wch:12},{wch:20},{wch:36},{wch:48},{wch:30}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"영어문장");
  XLSX.writeFile(wb,`영어암기_${new Date().toISOString().split("T")[0]}.xlsx`);
}

/* ── TagChip (재사용) ── */
function TagChip({label, active, onClick, c, removable, small}){
  const bg   = active ? c.tagActiveBg   : c.tagPresetBg;
  const bord = active ? c.tagActiveBord : c.tagPresetBord;
  const clr  = active ? c.tagActiveClr  : c.tagPresetClr;
  return (
    <button onClick={onClick} className="tag-chip"
      style={{display:"inline-flex",alignItems:"center",gap:4,padding:small?"3px 9px":"5px 12px",
        borderRadius:20,border:`1px solid ${bord}`,background:bg,color:clr,
        fontSize:small?11:12,fontWeight:active?700:500,cursor:"pointer",whiteSpace:"nowrap",
        fontFamily:"'Noto Sans KR',sans-serif"}}>
      {label}
      {removable && <span style={{fontSize:13,lineHeight:1,marginLeft:1}}>×</span>}
    </button>
  );
}

            <button onClick={onExport} className="btn-press"

                border:`1px solid ${c.exportBord}`,background:c.exportBg,color:c.exportClr,
                fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
              <IDown/> 엑셀 저장
            </button>
          )}
          <button onClick={onToggle} className="btn-press"
            style={{width:34,height:34,borderRadius:17,border:`1px solid ${c.border}`,background:c.surface,
              display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:c.textSub}}>
            {theme==="dark"?<ISun/>:<IMoon/>}
          </button>
        </div>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
        <div style={{fontSize:22,fontWeight:900,letterSpacing:-0.5}}>{titles[tab]}</div>
        {tab==="list"&&(
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:c.textMuted}}>오늘 <span style={{color:c.accent,fontWeight:700}}>{todayCount}</span>문장</div>
            <div style={{fontSize:11,color:c.textMuted}}>전체 <span style={{color:c.accentB,fontWeight:700}}>{total}</span>문장</div>

/* ════════════════════════════════════════
   ListView  (태그 필터 포함)
════════════════════════════════════════ */
function ListView({sentences,onDelete,todayKey,c}){
  const [expanded,   setExpanded]   = useState(null);
  const [delConfirm, setDelConfirm] = useState(null);
  const [activeTag,  setActiveTag]  = useState(null); // null = 전체

  /* 전체 문장에서 사용된 태그 추출 (사용 빈도 순) */
  const allTagCounts = {};
  sentences.forEach(s=>(s.tags||[]).forEach(t=>{ allTagCounts[t]=(allTagCounts[t]||0)+1; }));
  const usedTags = Object.entries(allTagCounts).sort((a,b)=>b[1]-a[1]).map(([t])=>t);

  /* 필터 적용 */
  const filtered = activeTag ? sentences.filter(s=>(s.tags||[]).includes(activeTag)) : sentences;

  /* 날짜 그룹 */
  const groups={};
  [...filtered].reverse().forEach(s=>{ if(!groups[s.date]) groups[s.date]=[]; groups[s.date].push(s); });

  if(!sentences.length) return (
    <div style={{textAlign:"center",padding:"80px 20px"}}>
      <div style={{fontSize:48,marginBottom:16}}>📝</div>
      <div style={{fontSize:16,fontWeight:700,color:c.textSub,marginBottom:8}}>아직 문장이 없어요</div>
      <div style={{fontSize:13,color:c.textMuted}}>✏️ 탭에서 오늘의 문장을 입력해보세요</div>
    </div>
  );

  return (
    <div>
      {/* ── 태그 필터 스크롤바 ── */}
      {usedTags.length>0 && (
        <div style={{padding:"8px 0 12px",overflowX:"auto",display:"flex",gap:7,
          paddingLeft:16,paddingRight:16,scrollbarWidth:"none"}}>
          {/* 전체 버튼 */}
          <TagChip label="전체" active={activeTag===null} onClick={()=>setActiveTag(null)} c={c}/>
          {usedTags.map(tag=>(
            <TagChip key={tag} label={`#${tag}`} active={activeTag===tag}
              onClick={()=>setActiveTag(activeTag===tag?null:tag)} c={c}/>
          ))}
        </div>
      )}

      {/* 필터 결과 없음 */}
      {filtered.length===0 && (
        <div style={{textAlign:"center",padding:"60px 20px"}}>
          <div style={{fontSize:36,marginBottom:12}}>🔍</div>
          <div style={{fontSize:14,color:c.textSub}}>
            <span style={{color:c.accent,fontWeight:700}}>#{activeTag}</span> 태그 문장이 없어요
          </div>
        </div>
      )}

      {/* ── 카드 목록 ── */}
      <div style={{padding:"0 16px"}}>
        {Object.entries(groups).map(([date,items])=>(
          <div key={date} style={{marginBottom:24}}>
            <div style={{fontSize:11,letterSpacing:2,textTransform:"uppercase",
              marginBottom:10,paddingLeft:4,display:"flex",alignItems:"center",gap:8}}>
              <span style={{color:date===todayKey?c.accent:c.textMuted,fontWeight:date===todayKey?700:400}}>
                {date===todayKey?"오늘 · ":""}{date}
              </span>
              <span style={{fontSize:10,background:c.badgeBg,borderRadius:6,
                padding:"2px 7px",color:c.textMuted}}>{items.length}문장</span>
            </div>

            {items.map((s,idx)=>(
              <div key={s.id} className="card-press"
                onClick={()=>setExpanded(expanded===s.id?null:s.id)}
                style={{background:expanded===s.id?c.surfaceHov:c.surface,
                  border:`1px solid ${expanded===s.id?c.borderAct:c.border}`,
                  borderRadius:14,padding:"14px 16px",marginBottom:8,cursor:"pointer",
                  animation:`fadeUp 0.3s ${idx*0.04}s both`,
                  boxShadow:c.shadow,transition:"background 0.15s,border-color 0.15s"}}>

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                  <div style={{flex:1,minWidth:0}}>
                    {/* 태그 뱃지 */}
                    {(s.tags||[]).length>0&&(
                      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:6}}>
                        {s.tags.map(t=>(
                          <span key={t}
                            onClick={e=>{e.stopPropagation();setActiveTag(activeTag===t?null:t);}}
                            style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10,
                              background:activeTag===t?c.tagActiveBg:c.tagPresetBg,
                              color:activeTag===t?c.tagActiveClr:c.tagPresetClr,
                              border:`1px solid ${activeTag===t?c.tagActiveBord:c.tagPresetBord}`,
                              cursor:"pointer",display:"inline-flex",alignItems:"center",gap:3}}>
                            <ITag/>{t}
                          </span>
                        ))}
                      </div>
                    )}
                    <div style={{fontSize:13,color:c.textSub,marginBottom:5,lineHeight:1.6}}>{s.korean}</div>
                    {expanded===s.id
                      ? <div style={{fontSize:15,fontWeight:700,color:c.accentB,lineHeight:1.65,fontStyle:"italic"}}>{s.english}</div>
                      : <div style={{fontSize:13,color:c.textMuted,fontStyle:"italic",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>···</div>
                    }
                    {/* 메모 */}
                    {expanded===s.id && s.memo && (
                      <div style={{marginTop:10,padding:"9px 12px",borderRadius:10,
                        background:c.memoBg||c.badgeBg,border:`1px solid ${c.border}`,
                        fontSize:12,color:c.textSub,lineHeight:1.6}}>
                        📌 {s.memo}
                      </div>
                    )}
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end",flexShrink:0}}>
                    <div style={{fontSize:11,color:c.textMuted}}>#{sentences.indexOf(s)+1}</div>
                    {expanded===s.id&&(
                      <button onClick={e=>{e.stopPropagation();setDelConfirm(s.id);}} className="btn-press"
                        style={{fontSize:11,color:"#EF4444",background:c.delBg,border:"none",
                          borderRadius:8,padding:"4px 9px",cursor:"pointer",fontWeight:700}}>삭제</button>
                    )}
                  </div>
                </div>

                {expanded===s.id&&(
                  <div style={{marginTop:8,paddingTop:8,borderTop:`1px solid ${c.border}`,
                    fontSize:11,color:c.textMuted}}>탭해서 닫기</div>
                )}
              </div>
            ))}
          </div>
        ))}
      </div>

      {/* 삭제 확인 모달 */}
      {delConfirm&&(
        <div style={{position:"fixed",inset:0,zIndex:300,display:"flex",alignItems:"center",
          justifyContent:"center",padding:20,animation:"fadeIn 0.15s ease"}}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.5)"}} onClick={()=>setDelConfirm(null)}/>
          <div onClick={e=>e.stopPropagation()}
            style={{position:"relative",background:c.modalBg,borderRadius:20,padding:24,
              width:"100%",maxWidth:310,textAlign:"center",boxShadow:"0 20px 60px rgba(0,0,0,0.25)"}}>
            <div style={{fontSize:32,marginBottom:12}}>🗑</div>
            <div style={{fontWeight:900,fontSize:16,marginBottom:8,color:c.text}}>삭제할까요?</div>
            <div style={{color:c.textSub,fontSize:13,marginBottom:20}}>이 문장이 완전히 삭제돼요</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setDelConfirm(null)} className="btn-press"
                style={{flex:1,padding:"13px",borderRadius:12,border:"none",background:c.badgeBg,
                  color:c.text,fontSize:14,fontWeight:700,cursor:"pointer"}}>취소</button>
              <button onClick={()=>{onDelete(delConfirm);setDelConfirm(null);setExpanded(null);}} className="btn-press"
                style={{flex:1,padding:"13px",borderRadius:12,border:"none",background:"#EF4444",
                  color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>삭제</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function SlotForm({idx, totalIdx, slot, onChange, c, allUsedTags}){
  const [customTag, setCustomTag] = useState("");

  function toggleTag(tag){
    const cur = slot.tags||[];
    const next = cur.includes(tag) ? cur.filter(t=>t!==tag) : [...cur, tag];
    onChange({...slot, tags:next});
  }
  function addCustomTag(){
    const t = customTag.trim().replace(/^#/,"");
    if(!t) return;
    const cur = slot.tags||[];
    if(!cur.includes(t)) onChange({...slot, tags:[...cur,t]});
    setCustomTag("");
  }

  /* 추천: preset + 기존에 쓴 태그, 중복 제거 */
  const suggested = [...new Set([...allUsedTags, ...PRESET_TAGS])].slice(0,24);

  return (
    <div style={{marginBottom:20,animation:`fadeUp 0.3s ${idx*0.1}s both`}}>
      <div style={{fontSize:11,color:c.textMuted,letterSpacing:2,textTransform:"uppercase",marginBottom:10,paddingLeft:2}}>
        문장 {totalIdx}
      </div>
      <div style={{background:c.inputBg,border:`1px solid ${c.inputBord}`,borderRadius:16,overflow:"hidden",boxShadow:c.shadow}}>
        {/* 한국어 */}
        <div style={{padding:"12px 16px",borderBottom:`1px solid ${c.border}`}}>
          <div style={{fontSize:10,color:c.textMuted,marginBottom:6,letterSpacing:1}}>🇰🇷 한국어</div>
          <textarea value={slot.korean} onChange={e=>onChange({...slot,korean:e.target.value})}
            placeholder="한국어 문장을 입력하세요" rows={2}
            style={{width:"100%",background:"transparent",border:"none",outline:"none",
              color:c.text,fontSize:14,resize:"none",lineHeight:1.7}}/>
        </div>
        {/* 영어 */}
        <div style={{padding:"12px 16px",borderBottom:`1px solid ${c.border}`}}>
          <div style={{fontSize:10,color:c.textMuted,marginBottom:6,letterSpacing:1}}>🇺🇸 English</div>
          <textarea value={slot.english} onChange={e=>onChange({...slot,english:e.target.value})}
            placeholder="Enter the English sentence" rows={2}
            style={{width:"100%",background:"transparent",border:"none",outline:"none",
              color:c.accentB,fontSize:14,fontStyle:"italic",resize:"none",lineHeight:1.7}}/>
        </div>

        {/* 태그 */}
        <div style={{padding:"12px 16px",borderBottom:`1px solid ${c.border}`}}>
          <div style={{fontSize:10,color:c.textMuted,marginBottom:8,letterSpacing:1,display:"flex",alignItems:"center",gap:4}}>
            <ITag/> 태그
          </div>

          {(slot.tags||[]).length>0&&(
            <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:8}}>
              {slot.tags.map(t=>(
                <TagChip key={t} label={`#${t}`} active={true} removable={true}
                  onClick={()=>toggleTag(t)} c={c}/>
              ))}
            </div>
          )}
          {/* 추천 태그 */}
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:8}}>
            {suggested.filter(t=>!(slot.tags||[]).includes(t)).map(t=>(
              <TagChip key={t} label={t} active={false} small={true}

              placeholder="직접 입력 후 Enter"
              style={{flex:1,background:"transparent",border:`1px solid ${c.inputBord}`,
                borderRadius:10,padding:"7px 12px",color:c.text,fontSize:13,outline:"none"}}/>
            <button onClick={addCustomTag} className="btn-press"
              style={{padding:"7px 14px",borderRadius:10,border:"none",

          </div>

          <textarea value={slot.memo||""} onChange={e=>onChange({...slot,memo:e.target.value})}

function AddView({todayCount,onAdd,onDone,c,sentences}){
  const MAX=3, remaining=Math.max(0,MAX-todayCount);
  const emptySlot=()=>({korean:"",english:"",tags:[],memo:""});
  const [slots,setSlots]=useState(()=>Array.from({length:Math.min(remaining,MAX)},emptySlot));
  const [saved,setSaved]=useState(false);
  const [syncing,setSyncing]=useState(false);

  /* 기존 문장에서 이미 쓴 태그 수집 */
  const allUsedTags=[...new Set((sentences||[]).flatMap(s=>s.tags||[]))];

  function updateSlot(idx,val){ setSlots(p=>p.map((s,i)=>i===idx?val:s)); }
  async function handleSave(){
    const valid=slots.filter(s=>s.korean.trim()&&s.english.trim());
    if(!valid.length) return;
    setSyncing(true);
    const date=new Date().toISOString().split("T")[0];
    await onAdd(valid.map(s=>({id:Date.now()+Math.random(),date,
      korean:s.korean.trim(),english:s.english.trim(),
      tags:s.tags||[],memo:(s.memo||"").trim(),reviewed:false})));
    setSyncing(false);
    setSaved(true); setTimeout(()=>onDone(),900);
  }
  const canSave=slots.some(s=>s.korean.trim()&&s.english.trim());

  if(remaining===0) return (
    <div style={{textAlign:"center",padding:"80px 20px"}}>
      <div style={{fontSize:48,marginBottom:16}}>🎉</div>
      <div style={{fontSize:16,fontWeight:700,color:c.accent,marginBottom:8}}>오늘 할당량 완료!</div>
      <div style={{fontSize:13,color:c.textSub}}>오늘 {MAX}문장을 모두 입력했어요<br/>내일 또 만나요 😊</div>
    </div>
  );
  if(saved) return (
    <div style={{textAlign:"center",padding:"80px 20px"}}>
      <div style={{fontSize:48,marginBottom:16,animation:"pop 0.4s ease"}}>✅</div>
      <div style={{fontSize:16,fontWeight:700,color:c.accentB}}>저장됐어요!</div>
    </div>
  );

  return (
    <div style={{padding:"8px 16px 0"}}>
      {/* 오늘 현황 */}
      <div style={{background:c.surfaceHov,border:`1px solid ${c.borderAct}`,borderRadius:14,
        padding:"12px 16px",marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:13,color:c.accent,fontWeight:700}}>오늘 입력 현황</div>
        <div style={{display:"flex",gap:7}}>
          {Array.from({length:MAX}).map((_,i)=>(
            <div key={i} style={{width:10,height:10,borderRadius:"50%",
              background:i<todayCount?c.accent:c.progressBg,transition:"background 0.3s"}}/>
          ))}
        </div>
      </div>

      {slots.map((slot,idx)=>(
        <SlotForm key={idx} idx={idx} totalIdx={todayCount+idx+1}
          slot={slot} onChange={val=>updateSlot(idx,val)} c={c} allUsedTags={allUsedTags}/>
      ))}

      <button onClick={handleSave} disabled={syncing} className="btn-press"
        style={{width:"100%",padding:"16px",borderRadius:16,border:"none",
          background:canSave?`linear-gradient(135deg,${c.accent},${c.accentB})`:c.saveDis,
          color:canSave?"#fff":c.saveDisTxt,fontSize:16,fontWeight:900,
          cursor:canSave&&!syncing?"pointer":"default",letterSpacing:0.5,marginTop:4,marginBottom:20,
          transition:"background 0.2s"}}>
        {syncing?"📤 노션에 저장 중...":"저장하기"}
      </button>
    </div>
  );
}

/* ════════════════════════════════════════
   QuizView
════════════════════════════════════════ */
function QuizView({sentences,c}){
  const QUIZ_COUNT=5;
  const [quiz,     setQuiz]    =useState(null);
  const [done,     setDone]    =useState(false);
  const [current,  setCurrent] =useState(0);
  const [revealed, setRevealed]=useState(false);
  const [score,    setScore]   =useState(0);
  const [answered, setAnswered]=useState(false);
  const [filterTag,setFilterTag]=useState(null);

  const usedTags=[...new Set(sentences.flatMap(s=>s.tags||[]))];
  const pool = filterTag ? sentences.filter(s=>(s.tags||[]).includes(filterTag)) : sentences;

  function startQuiz(){
    if(!pool.length) return;
    setQuiz(shuffle(pool).slice(0,Math.min(QUIZ_COUNT,pool.length)));
    setCurrent(0);setRevealed(false);setDone(false);setScore(0);setAnswered(false);
  }
  useEffect(()=>{ startQuiz(); },[filterTag]);

  if(!sentences.length) return (
    <div style={{textAlign:"center",padding:"80px 20px"}}>
      <div style={{fontSize:48,marginBottom:16}}>🤔</div>
      <div style={{fontSize:16,fontWeight:700,color:c.textSub,marginBottom:8}}>문장이 없어요</div>
      <div style={{fontSize:13,color:c.textMuted}}>먼저 ✏️ 탭에서 문장을 입력해주세요</div>
    </div>
  );
  if(!quiz) return null;

  /* 결과 화면 */
  if(done){
    const pct=Math.round((score/quiz.length)*100);
    const emoji=pct===100?"🏆":pct>=80?"🌟":pct>=60?"💪":"📚";
    return (
      <div style={{padding:"36px 20px",textAlign:"center",animation:"fadeUp 0.4s ease"}}>
        <div style={{fontSize:60,marginBottom:12}}>{emoji}</div>
        <div style={{fontSize:34,fontWeight:900,marginBottom:4,
          background:`linear-gradient(135deg,${c.accent},${c.accentB})`,
          WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{score} / {quiz.length}</div>
        <div style={{fontSize:14,color:c.textSub,marginBottom:28}}>정답률 {pct}%</div>
        <div style={{textAlign:"left",marginBottom:20}}>
          <div style={{fontSize:12,color:c.textMuted,letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>퀴즈 복습</div>
          {quiz.map(s=>(
            <div key={s.id} style={{background:c.reviewBg,border:`1px solid ${c.reviewBord}`,
              borderRadius:12,padding:"12px 14px",marginBottom:8,boxShadow:c.shadow}}>
              {(s.tags||[]).length>0&&(
                <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}}>
                  {s.tags.map(t=>(
                    <span key={t} style={{fontSize:10,fontWeight:700,padding:"1px 7px",borderRadius:8,
                      background:c.tagPresetBg,color:c.tagPresetClr,border:`1px solid ${c.tagPresetBord}`}}>#{t}</span>
                  ))}
                </div>
              )}
              <div style={{fontSize:12,color:c.textSub,marginBottom:4}}>{s.korean}</div>
              <div style={{fontSize:14,fontWeight:700,color:c.accentB,fontStyle:"italic"}}>{s.english}</div>
              {s.memo&&<div style={{fontSize:11,color:c.textMuted,marginTop:5}}>📌 {s.memo}</div>}
            </div>
          ))}
        </div>
        <button onClick={startQuiz} className="btn-press"
          style={{width:"100%",padding:"16px",borderRadius:16,border:"none",
            background:`linear-gradient(135deg,${c.accent},${c.accentB})`,
            color:"#fff",fontSize:16,fontWeight:900,cursor:"pointer",letterSpacing:0.5}}>
          🔄 다시 풀기
        </button>
      </div>
    );
  }

  const q=quiz[current];
  function handleAnswer(ok){ if(answered) return; setAnswered(true); if(ok) setScore(s=>s+1); }
  function next(){ if(current+1>=quiz.length){setDone(true);return;} setCurrent(n=>n+1);setRevealed(false);setAnswered(false); }

  return (
    <div style={{padding:"8px 16px 0"}}>
      {/* 태그 필터 (퀴즈용) */}
      {usedTags.length>0&&(
        <div style={{overflowX:"auto",display:"flex",gap:7,marginBottom:16,scrollbarWidth:"none"}}>
          <TagChip label="전체" active={filterTag===null} onClick={()=>setFilterTag(null)} c={c} small/>
          {usedTags.map(t=>(
            <TagChip key={t} label={`#${t}`} active={filterTag===t}
              onClick={()=>setFilterTag(filterTag===t?null:t)} c={c} small/>
          ))}
        </div>
      )}

      {/* 진행 바 */}
      <div style={{display:"flex",gap:5,marginBottom:16}}>
        {quiz.map((_,i)=>(
          <div key={i} style={{flex:1,height:4,borderRadius:2,
            background:i<current?c.accent:i===current?`linear-gradient(90deg,${c.accent},${c.accentB})`:c.progressBg,
            transition:"all 0.3s"}}/>
        ))}
      </div>
      <div style={{fontSize:11,color:c.textMuted,textAlign:"right",marginBottom:14,letterSpacing:1}}>
        {current+1} / {quiz.length} · 점수 {score}
        {filterTag&&<span style={{color:c.accent,marginLeft:6}}>#{filterTag}</span>}
      </div>

      {/* 문제 카드 */}
      <div key={current} style={{background:c.surface,border:`1px solid ${c.border}`,borderRadius:20,
        padding:"28px 20px",marginBottom:18,animation:"fadeUp 0.3s ease",minHeight:160,
        display:"flex",flexDirection:"column",justifyContent:"center",boxShadow:c.shadow}}>
        {(q.tags||[]).length>0&&(
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:12}}>
            {q.tags.map(t=>(
              <span key={t} style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:8,
                background:c.tagPresetBg,color:c.tagPresetClr,border:`1px solid ${c.tagPresetBord}`}}>#{t}</span>
            ))}
          </div>
        )}
        <div style={{fontSize:11,color:c.accent,letterSpacing:2,textTransform:"uppercase",marginBottom:12}}>한국어 → 영어로</div>
        <div style={{fontSize:18,fontWeight:700,lineHeight:1.75,color:c.text}}>{q.korean}</div>
      </div>

      {!revealed?(
        <button onClick={()=>setRevealed(true)} className="btn-press"
          style={{width:"100%",padding:"16px",borderRadius:16,border:`2px dashed ${c.ansBord}`,
            background:"transparent",color:c.accentB,fontSize:15,fontWeight:700,cursor:"pointer",marginBottom:12}}>
          👁 정답 보기
        </button>
      ):(
        <div style={{animation:"fadeUp 0.3s ease"}}>
          <div style={{background:c.ansBg,border:`1px solid ${c.ansBord}`,borderRadius:16,padding:"20px",marginBottom:14}}>
            <div style={{fontSize:11,color:c.accentB,letterSpacing:2,marginBottom:10}}>ANSWER</div>
            <div style={{fontSize:17,fontWeight:700,color:c.accentB,fontStyle:"italic",lineHeight:1.75}}>{q.english}</div>
            {q.memo&&<div style={{fontSize:12,color:c.textMuted,marginTop:10}}>📌 {q.memo}</div>}
          </div>

          {!answered?(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
              <button onClick={()=>handleAnswer(false)} className="btn-press"
                style={{padding:"14px",borderRadius:14,border:"none",background:"rgba(239,68,68,0.1)",
                  color:"#EF4444",fontSize:14,fontWeight:700,cursor:"pointer"}}>❌ 틀렸어요</button>
              <button onClick={()=>handleAnswer(true)} className="btn-press"
                style={{padding:"14px",borderRadius:14,border:"none",background:"rgba(22,163,74,0.1)",
                  color:"#16A34A",fontSize:14,fontWeight:700,cursor:"pointer"}}>✅ 맞았어요</button>
            </div>
          ):(
            <div style={{marginBottom:12,padding:"8px 0",textAlign:"center",fontSize:13,color:c.textMuted}}>
              {current+1<quiz.length?"다음 문제로 넘어가세요":"퀴즈가 끝났어요!"}
            </div>
          )}

          <button onClick={next} className="btn-press"
            style={{width:"100%",padding:"16px",borderRadius:16,border:"none",
              background:answered?`linear-gradient(135deg,${c.accent},${c.accentB})`:c.saveDis,
              color:answered?"#fff":c.saveDisTxt,fontSize:16,fontWeight:900,
              cursor:answered?"pointer":"default",letterSpacing:0.5}}>
            {current+1>=quiz.length?"결과 보기 🎯":"다음 문제 →"}
          </button>
        </div>
      )}
    </div>
  );
}

   SettingsView  (노션 연동 설정)

function SettingsView({c, notionCfg, setNotionCfg}){
  const [apiKey, setApiKey] = useState(notionCfg.apiKey||"");
  const [dbId,   setDbId]   = useState(notionCfg.dbId||"");
  const [enabled,setEnabled]= useState(notionCfg.enabled||false);
  const [saved,  setSaved]  = useState(false);
  const [testing,setTesting]= useState(false);
  const [testMsg,setTestMsg]= useState(null); // {ok, text}

  function handleSave(){
    const cfg={apiKey:apiKey.trim(), dbId:dbId.trim(), enabled};
    setNotionCfg(cfg); saveNotion(cfg);
    setSaved(true); setTimeout(()=>setSaved(false),2000);
  }

  async function handleTest(){
    setTesting(true); setTestMsg(null);
    try{
      const testSentence={
        english:"This is a test sentence.",korean:"테스트 문장이에요.",
        tags:["테스트"],memo:"연동 확인용",date:new Date().toISOString().split("T")[0],reviewed:false
      };
      await sendToNotion(testSentence,{apiKey:apiKey.trim(),dbId:dbId.trim()});
      setTestMsg({ok:true,text:"✅ 노션에 테스트 항목이 추가됐어요!"});
    }catch(e){
      setTestMsg({ok:false,text:`❌ ${e.message}`});
    }
    setTesting(false);
  }

  const inputStyle={
    width:"100%",background:c.inputBg,border:`1px solid ${c.inputBord}`,
    borderRadius:12,padding:"12px 14px",color:c.text,fontSize:13,outline:"none",
    fontFamily:"'Noto Sans KR',sans-serif",marginTop:6,boxSizing:"border-box"
  };

  return (
    <div style={{padding:"16px 16px 0"}}>
      {/* 노션 연동 안내 */}
      <div style={{background:"rgba(167,139,250,0.08)",border:"1px solid rgba(167,139,250,0.2)",
        borderRadius:16,padding:"16px",marginBottom:20}}>
        <div style={{fontSize:13,fontWeight:700,color:c.accent,marginBottom:8}}>🔗 노션(Notion) 연동 설정</div>
        <div style={{fontSize:12,color:c.textSub,lineHeight:1.8}}>
          문장 저장 시 노션 DB에 자동으로 추가됩니다.<br/>
          아래 항목을 채워주세요:
        </div>
        <div style={{marginTop:10,padding:"10px 12px",background:c.surface,borderRadius:10,fontSize:11,color:c.textMuted,lineHeight:2}}>
          1️⃣ <a href="https://www.notion.com/my-integrations" target="_blank" style={{color:c.accent}}>노션 인테그레이션</a> 생성 → API 키 복사<br/>
          2️⃣ 노션 DB 페이지 → 우측 상단 ··· → Connect to → 인테그레이션 연결<br/>
          3️⃣ DB URL에서 ID 복사 (32자리 영숫자)<br/>
          4️⃣ 노션 DB에 아래 컬럼 생성:<br/>
          <span style={{marginLeft:16,color:c.accent}}>영어문장(Title) · 한글뜻(Text) · 태그(Multi-select)<br/>
          <span style={{marginLeft:16}}>메모(Text) · 날짜(Date) · 복습완료(Checkbox)</span></span>
        </div>
      </div>

      {/* 활성화 토글 */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
        background:c.surface,border:`1px solid ${c.border}`,borderRadius:14,
        padding:"14px 16px",marginBottom:14}}>
        <div>
          <div style={{fontSize:14,fontWeight:700,color:c.text}}>노션 자동 저장</div>
          <div style={{fontSize:11,color:c.textMuted,marginTop:2}}>저장 시 노션 DB에 자동 추가</div>
        </div>
        <button onClick={()=>{
            const next=!enabled; setEnabled(next);
            const cfg={apiKey:apiKey.trim(),dbId:dbId.trim(),enabled:next};
            setNotionCfg(cfg); saveNotion(cfg);
          }} className="btn-press"
          style={{width:48,height:26,borderRadius:13,border:"none",cursor:"pointer",
            background:enabled?c.accent:"rgba(255,255,255,0.1)",position:"relative",transition:"background 0.2s"}}>
          <div style={{position:"absolute",top:3,left:enabled?26:3,width:20,height:20,
            borderRadius:"50%",background:"#fff",transition:"left 0.2s",boxShadow:"0 1px 4px rgba(0,0,0,0.3)"}}/>
        </button>
      </div>

      {/* API Key */}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,color:c.textMuted,letterSpacing:1}}>🔑 Notion API Key (Integration Token)</div>
        <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)}
          placeholder="secret_xxxxxxxxxxxxxxxxxxxx"
          style={inputStyle}/>
      </div>

      {/* DB ID */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:11,color:c.textMuted,letterSpacing:1}}>🗄️ Database ID</div>
        <input type="text" value={dbId} onChange={e=>setDbId(e.target.value)}
          placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          style={inputStyle}/>
        <div style={{fontSize:11,color:c.textMuted,marginTop:5}}>
          DB URL: notion.so/[workspace]/<span style={{color:c.accent}}>여기가 DB ID</span>?v=...
        </div>
      </div>

      {/* 테스트 전송 메시지 */}
      {testMsg&&(
        <div style={{padding:"10px 14px",borderRadius:10,marginBottom:12,fontSize:12,
          background:testMsg.ok?"rgba(74,222,128,0.1)":"rgba(239,68,68,0.1)",
          color:testMsg.ok?"#4ADE80":"#EF4444",
          border:`1px solid ${testMsg.ok?"rgba(74,222,128,0.3)":"rgba(239,68,68,0.3)"}`}}>
          {testMsg.text}
        </div>
      )}

      <div style={{display:"flex",gap:10}}>
        {/* 테스트 전송 버튼 */}
        <button onClick={handleTest} disabled={testing||!apiKey.trim()||!dbId.trim()} className="btn-press"
          style={{flex:1,padding:"14px",borderRadius:14,border:`1px solid ${c.borderAct}`,
            background:"transparent",color:c.accent,fontSize:14,fontWeight:700,
            cursor:apiKey.trim()&&dbId.trim()?"pointer":"default",
            opacity:apiKey.trim()&&dbId.trim()?1:0.4}}>
          {testing?"전송 중...":"🧪 테스트 전송"}
        </button>

        {/* 저장 버튼 */}
        <button onClick={handleSave} className="btn-press"
          style={{flex:1,padding:"14px",borderRadius:14,border:"none",
            background:saved?`linear-gradient(135deg,#4ADE80,#22C55E)`:`linear-gradient(135deg,${c.accent},${c.accentB})`,
            color:"#fff",fontSize:14,fontWeight:900,cursor:"pointer",transition:"background 0.3s"}}>
          {saved?"✅ 저장됨!":"설정 저장"}
        </button>
      </div>

      {/* 사파리 안내 */}
      <div style={{marginTop:16,padding:"12px 14px",borderRadius:12,
        background:"rgba(96,165,250,0.07)",border:"1px solid rgba(96,165,250,0.2)",fontSize:12,color:c.textSub,lineHeight:1.9,marginBottom:20}}>
        📱 <strong style={{color:c.accentB}}>아이폰 사파리</strong> 사용자라면 설정 저장 후 아래 버튼으로 URL을 복사해 북마크에 저장하세요.<br/>
        설정값이 URL 안에 포함되어 있어 새로고침해도 절대 사라지지 않아요.
        <button onClick={()=>{
          try{
            navigator.clipboard.writeText(window.location.href);
            alert("✅ URL이 복사됐어요!\n사파리에서 이 URL을 북마크로 저장하면 설정이 유지돼요.");
          }catch{
            prompt("이 URL을 복사해서 북마크로 저장하세요:", window.location.href);
          }
        }} className="btn-press"
          style={{display:"block",width:"100%",marginTop:10,padding:"10px",borderRadius:10,
            border:`1px solid rgba(96,165,250,0.4)`,background:"rgba(96,165,250,0.1)",
            color:c.accentB,fontSize:13,fontWeight:700,cursor:"pointer"}}>
          🔗 현재 URL 복사 (북마크용)
        </button>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   DialogueView  (대화문 직접 입력 + 선택 저장)
════════════════════════════════════════ */
const DIALOGUE_STORAGE_KEY = "eng_dialogues_v1";
function loadDialogues(){ try{ return JSON.parse(localStorage.getItem(DIALOGUE_STORAGE_KEY))||[]; }catch{ return []; } }
function saveDialogues(d){ try{ localStorage.setItem(DIALOGUE_STORAGE_KEY,JSON.stringify(d)); }catch{} }

function DialogueView({c, onAdd}){
  const emptyLine = ()=>({speaker:"A",english:"",korean:""});
  const [phase,    setPhase]    = useState("home");   // home | input | select
  const [dialogues,setDialogues]= useState(loadDialogues);
  const [title,    setTitle]    = useState("");
  const [lines,    setLines]    = useState([emptyLine(),emptyLine(),emptyLine()]);
  const [selected, setSelected] = useState(new Set());
  const [saving,   setSaving]   = useState(false);
  const [saved,    setSaved]    = useState(false);
  const [viewId,   setViewId]   = useState(null);     // 목록에서 펼쳐볼 대화 id

  const MAX_SELECT = 3;

  function updateLine(idx,field,val){ setLines(p=>p.map((l,i)=>i===idx?{...l,[field]:val}:l)); }
  function toggleSpeaker(idx){ updateLine(idx,"speaker",lines[idx].speaker==="A"?"B":"A"); }
  function addLine(){ setLines(p=>[...p,emptyLine()]); }
  function removeLine(idx){
    if(lines.length<=1) return;
    setLines(p=>p.filter((_,i)=>i!==idx));
    setSelected(p=>{ const n=new Set(); p.forEach(i=>{ if(i<idx) n.add(i); else if(i>idx) n.add(i-1); }); return n; });
  }

  function goSelect(){ if(!lines.some(l=>l.english.trim())) return; setSelected(new Set()); setPhase("select"); }

  function toggleSelect(idx){
    setSelected(prev=>{
      const n=new Set(prev);
      if(n.has(idx)) n.delete(idx);
      else { if(n.size>=MAX_SELECT) return prev; n.add(idx); }
      return n;
    });
  }

  function saveDialogueSet(){
    const date=new Date().toISOString().split("T")[0];
    const newSet={ id:Date.now(), date, title:title.trim()||"대화문", lines:lines.filter(l=>l.english.trim()) };
    const updated=[newSet,...dialogues];
    setDialogues(updated); saveDialogues(updated);
  }

  function deleteDialogue(id){ const u=dialogues.filter(d=>d.id!==id); setDialogues(u); saveDialogues(u); }

  async function handleSave(){
    if(!selected.size) return;
    setSaving(true);
    const date=new Date().toISOString().split("T")[0];
    const items=[...selected].map(i=>({
      id:Date.now()+Math.random(), date,
      english:lines[i].english.trim(), korean:lines[i].korean.trim(),
      tags:["대화문",...(title.trim()?[title.trim()]:[])],
      memo:`${lines[i].speaker} · ${title.trim()||"회화"}`,
      reviewed:false,
    }));
    saveDialogueSet();
    await onAdd(items);
    setSaving(false); setSaved(true);
    setTimeout(()=>{ setSaved(false); setSelected(new Set()); setPhase("home"); setLines([emptyLine(),emptyLine(),emptyLine()]); setTitle(""); },1800);
  }

  const inputBase={background:"transparent",border:"none",outline:"none",color:c.text,fontSize:13,resize:"none",lineHeight:1.7,width:"100%",fontFamily:"'Noto Sans KR',sans-serif"};

  /* ── HOME: 목록 ── */
  if(phase==="home") return (
    <div style={{padding:"8px 16px 0"}}>
      <button onClick={()=>setPhase("input")} className="btn-press"
        style={{width:"100%",padding:"14px",borderRadius:14,border:"none",marginBottom:20,
          background:`linear-gradient(135deg,${c.accent},${c.accentB})`,
          color:"#fff",fontSize:15,fontWeight:900,cursor:"pointer"}}>
        ✏️ 새 대화문 입력
      </button>

      {dialogues.length===0 ? (
        <div style={{textAlign:"center",padding:"60px 20px"}}>
          <div style={{fontSize:40,marginBottom:12}}>💬</div>
          <div style={{fontSize:14,color:c.textSub,fontWeight:700,marginBottom:6}}>아직 저장된 대화문이 없어요</div>
          <div style={{fontSize:12,color:c.textMuted}}>위 버튼으로 첫 대화문을 입력해보세요</div>
        </div>
      ) : (
        <>
          <div style={{fontSize:11,color:c.textMuted,letterSpacing:2,marginBottom:10}}>저장된 대화문 ({dialogues.length})</div>
          {dialogues.map(d=>(
            <div key={d.id} style={{background:c.surface,border:`1px solid ${c.border}`,borderRadius:16,marginBottom:12,overflow:"hidden",boxShadow:c.shadow}}>
              {/* 헤더 */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",cursor:"pointer"}}
                onClick={()=>setViewId(viewId===d.id?null:d.id)}>
                <div>
                  <div style={{fontSize:14,fontWeight:700,color:c.text}}>{d.title}</div>
                  <div style={{fontSize:11,color:c.textMuted,marginTop:2}}>{d.date} · {d.lines.length}줄</div>
                </div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <button onClick={e=>{e.stopPropagation();deleteDialogue(d.id);}} className="btn-press"
                    style={{width:28,height:28,borderRadius:"50%",border:"none",background:c.delBg,
                      color:"#EF4444",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
                  <div style={{color:c.textMuted,fontSize:18}}>{viewId===d.id?"▲":"▼"}</div>
                </div>
              </div>
              {/* 대화문 펼치기 */}
              {viewId===d.id && (
                <div style={{borderTop:`1px solid ${c.border}`,padding:"12px 16px"}}>
                  {d.lines.map((l,i)=>{
                    const isA=l.speaker==="A";
                    return (
                      <div key={i} style={{display:"flex",flexDirection:"column",alignItems:isA?"flex-start":"flex-end",marginBottom:8}}>
                        <div style={{maxWidth:"84%",padding:"9px 13px",
                          borderRadius:isA?"4px 14px 14px 14px":"14px 4px 14px 14px",
                          background:isA?c.surfaceHov:c.inputBg,border:`1px solid ${c.border}`}}>
                          <div style={{fontSize:10,color:isA?c.accent:c.accentB,fontWeight:700,marginBottom:4}}>{l.speaker}</div>
                          <div style={{fontSize:13,fontWeight:600,color:isA?c.text:c.accentB,fontStyle:isA?"normal":"italic",lineHeight:1.6,marginBottom:3}}>{l.english}</div>
                          {l.korean&&<div style={{fontSize:12,color:c.textMuted}}>{l.korean}</div>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          ))}
        </>
      )}
    </div>
  );

  /* ── INPUT: 입력 ── */
  if(phase==="input") return (
    <div style={{padding:"8px 16px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <button onClick={()=>setPhase("home")} className="btn-press"
          style={{padding:"7px 12px",borderRadius:10,border:`1px solid ${c.border}`,background:c.surface,color:c.textSub,fontSize:12,fontWeight:700,cursor:"pointer"}}>
          ← 목록
        </button>
        <div style={{fontSize:13,fontWeight:700,color:c.accent}}>대화문 입력</div>
        <div style={{width:60}}/>
      </div>

      {/* 제목 */}
      <div style={{background:c.surface,border:`1px solid ${c.border}`,borderRadius:14,padding:"12px 16px",marginBottom:14,boxShadow:c.shadow}}>
        <div style={{fontSize:10,color:c.textMuted,letterSpacing:1,marginBottom:6}}>📌 주제 / 출처 (선택)</div>
        <input value={title} onChange={e=>setTitle(e.target.value)}
          placeholder="예: 카페에서 주문하기 · 교재 p.24"
          style={{...inputBase,fontSize:14}}/>
      </div>

      {/* 라인 목록 */}
      {lines.map((line,idx)=>{
        const isA=line.speaker==="A";
        return (
          <div key={idx} style={{display:"flex",gap:8,marginBottom:10,flexDirection:isA?"row":"row-reverse",animation:`fadeUp 0.18s ${idx*0.03}s both`}}>
            <button onClick={()=>toggleSpeaker(idx)} className="btn-press"
              style={{flexShrink:0,width:34,height:34,borderRadius:"50%",border:"none",cursor:"pointer",marginTop:8,
                background:`linear-gradient(135deg,${isA?c.accent:c.accentB},${isA?c.accentB:c.accent})`,
                color:"#fff",fontSize:12,fontWeight:900}}>
              {line.speaker}
            </button>
            <div style={{flex:1,background:c.surface,border:`1px solid ${c.border}`,
              borderRadius:isA?"4px 14px 14px 14px":"14px 4px 14px 14px",padding:"10px 12px",boxShadow:c.shadow}}>
              <textarea value={line.english} onChange={e=>updateLine(idx,"english",e.target.value)}
                placeholder="English sentence..." rows={2}
                style={{...inputBase,color:isA?c.text:c.accentB,fontStyle:isA?"normal":"italic",marginBottom:6}}/>
              <div style={{height:1,background:c.border,marginBottom:6}}/>
              <textarea value={line.korean} onChange={e=>updateLine(idx,"korean",e.target.value)}
                placeholder="한국어 뜻..." rows={1}
                style={{...inputBase,color:c.textMuted,fontSize:12}}/>
            </div>
            {lines.length>1&&(
              <button onClick={()=>removeLine(idx)} className="btn-press"
                style={{flexShrink:0,width:28,height:28,borderRadius:"50%",border:"none",background:c.delBg,
                  color:"#EF4444",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",marginTop:11}}>×</button>
            )}
          </div>
        );
      })}

      <button onClick={addLine} className="btn-press"
        style={{width:"100%",padding:"12px",borderRadius:12,border:`1px dashed ${c.borderAct}`,
          background:"transparent",color:c.accent,fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:14}}>
        + 대화 추가
      </button>

      <button onClick={goSelect} disabled={!lines.some(l=>l.english.trim())} className="btn-press"
        style={{width:"100%",padding:"16px",borderRadius:16,border:"none",marginBottom:24,
          background:lines.some(l=>l.english.trim())?`linear-gradient(135deg,${c.accent},${c.accentB})`:c.saveDis,
          color:lines.some(l=>l.english.trim())?"#fff":c.saveDisTxt,
          fontSize:16,fontWeight:900,cursor:lines.some(l=>l.english.trim())?"pointer":"default"}}>
        외울 문장 고르기 →
      </button>
    </div>
  );

  /* ── SELECT: 선택 ── */
  const validIdxMap=lines.reduce((acc,l,i)=>{ if(l.english.trim()) acc.push(i); return acc; },[]);
  return (
    <div style={{padding:"8px 16px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div>
          {title&&<div style={{fontSize:13,fontWeight:700,color:c.text,marginBottom:2}}>{title}</div>}
          <div style={{fontSize:11,color:c.textMuted}}>{selected.size}/{MAX_SELECT}개 선택 · 최대 3개</div>
        </div>
        <button onClick={()=>setPhase("input")} className="btn-press"
          style={{padding:"7px 12px",borderRadius:10,border:`1px solid ${c.border}`,background:c.surface,color:c.textSub,fontSize:12,fontWeight:700,cursor:"pointer"}}>
          ← 수정
        </button>
      </div>

      <div style={{background:"rgba(167,139,250,0.07)",border:"1px solid rgba(167,139,250,0.2)",
        borderRadius:12,padding:"10px 14px",marginBottom:14,fontSize:12,color:c.accent}}>
        💡 외우고 싶은 문장을 탭해서 선택하세요 (최대 3개)
      </div>

      <div style={{marginBottom:16}}>
        {validIdxMap.map((origIdx,vi)=>{
          const line=lines[origIdx]; const isA=line.speaker==="A"; const isSel=selected.has(origIdx);
          return (
            <div key={origIdx} onClick={()=>toggleSelect(origIdx)}
              style={{display:"flex",flexDirection:"column",alignItems:isA?"flex-start":"flex-end",
                marginBottom:10,cursor:"pointer",animation:`fadeUp 0.2s ${vi*0.04}s both`}}>
              <div style={{maxWidth:"84%",padding:"11px 14px",
                borderRadius:isA?"4px 16px 16px 16px":"16px 4px 16px 16px",
                background:isSel?`linear-gradient(135deg,${c.accent}22,${c.accentB}22)`:isA?c.surface:c.inputBg,
                border:`2px solid ${isSel?c.accent:c.border}`,
                boxShadow:isSel?`0 0 0 3px ${c.accent}33`:"none",
                transition:"all 0.15s",position:"relative"}}>
                {isSel&&(
                  <div style={{position:"absolute",top:-8,right:-8,width:20,height:20,borderRadius:"50%",
                    background:c.accent,display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:11,color:"#fff",fontWeight:900,boxShadow:"0 2px 6px rgba(0,0,0,0.3)"}}>
                    {[...selected].indexOf(origIdx)+1}
                  </div>
                )}
                <div style={{fontSize:10,color:isA?c.accent:c.accentB,fontWeight:700,marginBottom:4,letterSpacing:1}}>{line.speaker}</div>
                <div style={{fontSize:14,fontWeight:600,lineHeight:1.6,marginBottom:3,color:isA?c.text:c.accentB,fontStyle:isA?"normal":"italic"}}>{line.english}</div>
                {line.korean&&<div style={{fontSize:12,color:c.textMuted}}>{line.korean}</div>}
              </div>
            </div>
          );
        })}
      </div>

      {saved ? (
        <div style={{textAlign:"center",padding:"16px",fontSize:15,fontWeight:700,color:c.accentB}}>✅ {selected.size}개 문장이 저장됐어요!</div>
      ) : (
        <button onClick={handleSave} disabled={!selected.size||saving} className="btn-press"
          style={{width:"100%",padding:"16px",borderRadius:16,border:"none",marginBottom:12,
            background:selected.size?`linear-gradient(135deg,${c.accent},${c.accentB})`:c.saveDis,
            color:selected.size?"#fff":c.saveDisTxt,fontSize:16,fontWeight:900,
            cursor:selected.size&&!saving?"pointer":"default",transition:"background 0.2s"}}>
          {saving?"📤 저장 중...":`${selected.size}개 문장 암기장에 저장`}
        </button>
      )}
      <button onClick={()=>setPhase("home")} className="btn-press"
        style={{width:"100%",padding:"13px",borderRadius:14,border:`1px solid ${c.borderAct}`,
          background:"transparent",color:c.accent,fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:24}}>
        ← 대화문 목록으로
      </button>
    </div>
  );
}

/* ── BottomTabs ── */
function BottomTabs({tab,setTab,c}){
  const tabs=[{id:"list",label:"목록",Icon:IBook},{id:"add",label:"입력",Icon:IPencil},{id:"dialogue",label:"대화문",Icon:IChat},{id:"quiz",label:"퀴즈",Icon:IPlay},{id:"settings",label:"설정",Icon:IGear}];
  return (
    <div style={{position:"fixed",bottom:0,left:0,right:0,background:c.tabBg,backdropFilter:"blur(16px)",
      borderTop:`1px solid ${c.tabBorder}`,display:"flex",padding:"8px 0 28px",zIndex:100,
      transition:"background 0.25s,border-color 0.25s"}}>
      {tabs.map(({id,label,Icon})=>(
        <button key={id} onClick={()=>setTab(id)} className="tab-btn"
          style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,
            background:"none",border:"none",cursor:"pointer",padding:"8px 0",
            color:tab===id?c.accent:c.tabInact}}>
          <Icon/>
          <span style={{fontSize:10,fontWeight:tab===id?700:400,letterSpacing:0.5}}>{label}</span>
          {tab===id&&<div style={{width:20,height:2,background:`linear-gradient(90deg,${c.accent},${c.accentB})`,borderRadius:1}}/>}
        </button>
      ))}
    </div>
  );
}

/* ── AddView에 sentences prop 전달 패치 ── */
function AppRoot(){
  const [tab,       setTab]       = useState("list");
  const [sentences, setSentences] = useState(load);
  const [theme,     setTheme]     = useState(loadTheme);
  const [notionCfg, setNotionCfg] = useState(loadNotion);
  const c = theme==="dark" ? DARK : LIGHT;
  const todayKey   = new Date().toISOString().split("T")[0];
  const todayCount = sentences.filter(s=>s.date===todayKey).length;

  // 사파리 대응: 앱 시작 시 IndexedDB에서도 노션 설정 복원 시도
  useEffect(()=>{
    const cur = loadNotion();
    if(!cur.apiKey && !cur.dbId){
      loadNotionFromIDB(cfg => {
        if(cfg && (cfg.apiKey || cfg.dbId)){
          setNotionCfg(cfg);
          // localStorage/sessionStorage에도 다시 써줌
          try{ localStorage.setItem(NOTION_KEY, JSON.stringify(cfg)); }catch{}
          try{ sessionStorage.setItem(NOTION_KEY, JSON.stringify(cfg)); }catch{}
        }
      });
    }
  },[]);

  useEffect(()=>{ document.body.style.background=c.bg; },[theme]);

  const toggleTheme=()=>{ const n=theme==="dark"?"light":"dark"; setTheme(n); saveTheme(n); };
  const addSentences=async items=>{
    const date=new Date().toISOString().split("T")[0];
    const withDate=items.map(s=>({...s,date,reviewed:false}));
    const u=[...sentences,...withDate]; setSentences(u); save(u);
    // 노션 자동 전송
    if(notionCfg.enabled&&notionCfg.apiKey&&notionCfg.dbId){
      for(const s of withDate){
        try{ await sendToNotion(s,notionCfg); }catch(e){ console.warn("Notion sync error:",e.message); }
      }
    }
  };
  const deleteSentence=id=>{ const u=sentences.filter(s=>s.id!==id); setSentences(u); save(u); };

  const titles={list:"📚 내 문장 목록",add:"✏️ 오늘의 문장",dialogue:"💬 회화 대화문",quiz:"🎯 문제 풀기",settings:"⚙️ 노션 설정"};

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:c.bg,color:c.text,transition:"background 0.25s,color 0.25s"}}>
      <Header tab={tab} todayCount={todayCount} total={sentences.length}
        c={c} theme={theme} onToggle={toggleTheme}
        onExport={()=>exportToExcel(sentences)} hasData={sentences.length>0}
        notionEnabled={notionCfg.enabled}/>
      <div style={{flex:1,overflowY:"auto",paddingBottom:90}}>
        {tab==="list"     && <ListView sentences={sentences} onDelete={deleteSentence} todayKey={todayKey} c={c}/>}
        {tab==="add"      && <AddView  todayCount={todayCount} onAdd={addSentences} onDone={()=>setTab("list")} c={c} sentences={sentences}/>}
        {tab==="dialogue" && <DialogueView c={c} onAdd={addSentences}/>}
        {tab==="quiz"     && <QuizView sentences={sentences} c={c}/>}
        {tab==="settings" && <SettingsView c={c} notionCfg={notionCfg} setNotionCfg={cfg=>{setNotionCfg(cfg);saveNotion(cfg);}}/>}
      </div>
      <BottomTabs tab={tab} setTab={setTab} c={c}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppRoot/>);
</script>
</body>
</html>
