<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

const STORAGE_KEY  = "eng_memory_v3";
const THEME_KEY    = "eng_theme_v1";
const NOTION_KEY   = "eng_notion_v1";
const DIALOGUE_KEY = "eng_dialogues_v1";

function load(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]; }catch{ return []; } }
function save(d){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(d)); }catch{} }
function loadTheme(){ try{ return localStorage.getItem(THEME_KEY)||"dark"; }catch{ return "dark"; } }
function saveTheme(t){ try{ localStorage.setItem(THEME_KEY,t); }catch{} }
function loadDialogues(){ try{ return JSON.parse(localStorage.getItem(DIALOGUE_KEY))||[]; }catch{ return []; } }
function saveDialogues(d){ try{ localStorage.setItem(DIALOGUE_KEY,JSON.stringify(d)); }catch{} }

function encodeHash(d){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(d)))); }catch{ return ""; } }
function decodeHash(s){ try{ return JSON.parse(decodeURIComponent(escape(atob(s)))); }catch{ return null; } }
function loadNotionFromHash(){
  try{
    const params = new URLSearchParams(window.location.hash.slice(1));
    const n = params.get("n");
    if(n) return decodeHash(n);
  }catch{}
  return null;
}
function saveNotionToHash(d){
  try{
    const params = new URLSearchParams(window.location.hash.slice(1));
    params.set("n", encodeHash(d));
    window.location.replace("#" + params.toString());
  }catch{}
}
function loadNotion(){
  const empty = {apiKey:"",dbId:"",enabled:false};
  const h = loadNotionFromHash();
  if(h && (h.apiKey||h.dbId)) return h;
  try{ const v=localStorage.getItem(NOTION_KEY); if(v) return JSON.parse(v); }catch{}
  try{ const v=sessionStorage.getItem(NOTION_KEY); if(v) return JSON.parse(v); }catch{}
  return empty;
}
function saveNotion(d){
  saveNotionToHash(d);
  const s=JSON.stringify(d);
  try{ localStorage.setItem(NOTION_KEY,s); }catch{}
  try{ sessionStorage.setItem(NOTION_KEY,s); }catch{}
}

async function sendToNotion(sentence, cfg){
  if(!cfg.apiKey||!cfg.dbId) throw new Error("API 키와 DB ID를 먼저 설정해주세요");
  const url="https://corsproxy.io/?url="+encodeURIComponent("https://api.notion.com/v1/pages");
  const body={
    parent:{database_id:cfg.dbId},
    properties:{
      "영어문장":{title:[{text:{content:sentence.english}}]},
      "한글뜻":{rich_text:[{text:{content:sentence.korean||""}}]},
      "태그":{multi_select:(sentence.tags||[]).map(function(t){return {name:t};})},
      "메모":{rich_text:[{text:{content:sentence.memo||""}}]},
      "날짜":{date:{start:sentence.date}},
      "복습완료":{checkbox:sentence.reviewed||false}
    }
  };
  const res=await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.apiKey,"Notion-Version":"2022-06-28"},
    body:JSON.stringify(body)
  });
  if(!res.ok){const e=await res.json().catch(function(){return{};});throw new Error(e.message||"HTTP "+res.status);}
  return res.json();
}

function exportToExcel(sentences){
  if(!sentences.length){alert("내보낼 문장이 없어요!");return;}
  const rows=sentences.map(function(s,i){return{"번호":i+1,"날짜":s.date,"태그":(s.tags||[]).join(", "),"한국어":s.korean,"영어(English)":s.english,"메모":s.memo||""};});
  const ws=XLSX.utils.json_to_sheet(rows);
  ws["!cols"]=[{wch:6},{wch:12},{wch:20},{wch:36},{wch:48},{wch:30}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"영어문장");
  XLSX.writeFile(wb,"영어암기_"+new Date().toISOString().split("T")[0]+".xlsx");
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function TagChip({label,active,onClick,c,removable,small}){
  return(
    <button onClick={onClick} className="tag-chip btn-press"
      style={{display:"inline-flex",alignItems:"center",gap:3,
        padding:small?"3px 8px":"5px 10px",borderRadius:20,
        background:active?c.tagActiveBg:c.tagPresetBg,
        border:"1px solid "+(active?c.tagActiveBord:c.tagPresetBord),
        color:active?c.tagActiveClr:c.tagPresetClr,
        fontSize:small?11:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>
      {!removable&&<ITag/>}
      {label}
      {removable&&<span style={{fontSize:14,lineHeight:1,marginLeft:2}}>x</span>}
    </button>
  );
}

function Header({tab,todayCount,total,c,theme,onToggle,onExport,hasData,notionEnabled}){
  const titles={list:"📚 내 문장 목록",add:"✏️ 오늘의 문장",dialogue:"💬 회화 대화문",quiz:"🎯 문제 풀기",settings:"⚙️ 노션 설정"};
  return(
    <div style={{padding:"54px 20px 14px",background:c.headerGrad}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{fontSize:11,letterSpacing:3,color:c.textMuted,textTransform:"uppercase"}}>English Memory</div>
          {notionEnabled&&(<span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:10,background:"rgba(167,139,250,0.15)",color:c.accent,border:"1px solid rgba(167,139,250,0.3)"}}>N 연동중</span>)}
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {tab==="list"&&hasData&&(
            <button onClick={onExport} className="btn-press"
              style={{display:"flex",alignItems:"center",gap:5,padding:"6px 12px",borderRadius:20,
                border:"1px solid "+c.exportBord,background:c.exportBg,color:c.exportClr,
                fontSize:12,fontWeight:700,cursor:"pointer"}}>
              <IDown/> 엑셀
            </button>
          )}
          <button onClick={onToggle} className="btn-press"
            style={{width:34,height:34,borderRadius:17,border:"1px solid "+c.border,
              background:c.surface,display:"flex",alignItems:"center",justifyContent:"center",
              cursor:"pointer",color:c.textSub}}>
            {theme==="dark"?<ISun/>:<IMoon/>}
          </button>
        </div>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
        <div style={{fontSize:22,fontWeight:900,letterSpacing:-0.5}}>{titles[tab]}</div>
        {tab==="list"&&(
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:c.textMuted}}>오늘 <span style={{color:c.accent,fontWeight:700}}>{todayCount}</span>문장</div>
            <div style={{fontSize:11,color:c.textMuted}}>전체 <span style={{color:c.accentB,fontWeight:700}}>{total}</span>문장</div>
          </div>
        )}
      </div>
    </div>
  );
}

function ListView({sentences,onDelete,todayKey,c}){
  const [filterTag,setFilterTag]=useState(null);
  const allTags=[...new Set(sentences.flatMap(function(s){return s.tags||[];}))];
  const filtered=filterTag?sentences.filter(function(s){return(s.tags||[]).includes(filterTag);}):sentences;
  const sorted=[...filtered].reverse();
  if(!sentences.length) return(
    <div style={{padding:"80px 20px",textAlign:"center"}}>
      <div style={{fontSize:48,marginBottom:16}}>📖</div>
      <div style={{fontSize:16,fontWeight:700,color:c.textSub,marginBottom:8}}>아직 저장된 문장이 없어요</div>
      <div style={{fontSize:13,color:c.textMuted}}>아래 입력 탭으로 첫 문장을 추가해보세요!</div>
    </div>
  );
  return(
    <div style={{padding:"8px 16px 0"}}>
      {allTags.length>0&&(
        <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:10,marginBottom:8}}>
          <TagChip label="전체" active={!filterTag} onClick={function(){setFilterTag(null);}} c={c} small/>
          {allTags.map(function(tag){return(<TagChip key={tag} label={tag} active={filterTag===tag} onClick={function(){setFilterTag(filterTag===tag?null:tag);}} c={c} small/>);})}
        </div>
      )}
      {sorted.map(function(s){
        const isToday=s.date===todayKey;
        return(
          <div key={s.id} style={{background:c.surface,border:"1px solid "+c.border,borderRadius:16,padding:"14px 16px",marginBottom:10,boxShadow:c.shadow,animation:"fadeUp 0.25s ease both"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",flex:1}}>
                {isToday&&(<span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:10,background:"rgba(167,139,250,0.15)",color:c.accent,border:"1px solid rgba(167,139,250,0.3)"}}>TODAY</span>)}
                {(s.tags||[]).map(function(tag){return(<TagChip key={tag} label={tag} active={false} onClick={function(){setFilterTag(tag);}} c={c} small/>);})}
              </div>
              <button onClick={function(){onDelete(s.id);}} className="btn-press"
                style={{width:26,height:26,borderRadius:"50%",border:"none",background:c.delBg,color:"#EF4444",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>x</button>
            </div>
            <div style={{fontSize:13,color:c.textMuted,marginBottom:6}}>{s.korean}</div>
            <div style={{fontSize:16,fontWeight:700,color:c.text,lineHeight:1.5}}>{s.english}</div>
            {s.memo?(<div style={{fontSize:12,color:c.textMuted,background:c.memoBg,borderRadius:8,padding:"6px 10px",marginTop:6}}>{s.memo}</div>):null}
            <div style={{fontSize:11,color:c.textMuted,marginTop:8}}>{s.date}</div>
          </div>
        );
      })}
    </div>
  );
}

function SlotForm({idx,slot,onChange,c}){
  const [customTag,setCustomTag]=useState("");
  const [showMemo,setShowMemo]=useState(false);
  function toggleTag(tag){const tags=slot.tags||[];onChange({...slot,tags:tags.includes(tag)?tags.filter(function(t){return t!==tag;}):[...tags,tag]});}
  function addCustomTag(){const t=customTag.trim();if(!t)return;const tags=slot.tags||[];if(!tags.includes(t))onChange({...slot,tags:[...tags,t]});setCustomTag("");}
  const inp={width:"100%",background:c.inputBg,border:"1px solid "+c.inputBord,borderRadius:12,padding:"12px 14px",color:c.text,fontSize:14,outline:"none",fontFamily:"'Noto Sans KR',sans-serif"};
  return(
    <div style={{background:c.surface,border:"1px solid "+c.border,borderRadius:18,padding:"16px",marginBottom:14,boxShadow:c.shadow,animation:"fadeUp 0.2s ease both"}}>
      <div style={{fontSize:11,color:c.textMuted,letterSpacing:2,marginBottom:10}}>문장 {idx+1}</div>
      <input value={slot.korean} onChange={function(e){onChange({...slot,korean:e.target.value});}} placeholder="한글 뜻을 입력하세요" style={{...inp,marginBottom:10}}/>
      <input value={slot.english} onChange={function(e){onChange({...slot,english:e.target.value});}} placeholder="English sentence" style={{...inp,fontStyle:"italic",marginBottom:12}}/>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
        {PRESET_TAGS.map(function(tag){const active=(slot.tags||[]).includes(tag);return(<TagChip key={tag} label={tag} active={active} onClick={function(){toggleTag(tag);}} c={c} small/>);})}
      </div>
      {(slot.tags||[]).filter(function(t){return !PRESET_TAGS.includes(t);}).length>0&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
          {(slot.tags||[]).filter(function(t){return !PRESET_TAGS.includes(t);}).map(function(tag){return(<TagChip key={tag} label={tag} active={true} removable onClick={function(){toggleTag(tag);}} c={c} small/>);})}
        </div>
      )}
      <div style={{display:"flex",gap:6,marginBottom:8}}>
        <input value={customTag} onChange={function(e){setCustomTag(e.target.value);}} onKeyDown={function(e){if(e.key==="Enter")addCustomTag();}} placeholder="태그 직접 입력..."
          style={{flex:1,background:c.inputBg,border:"1px solid "+c.inputBord,borderRadius:10,padding:"8px 12px",color:c.text,fontSize:12,outline:"none",fontFamily:"'Noto Sans KR',sans-serif"}}/>
        <button onClick={addCustomTag} className="btn-press"
          style={{padding:"8px 12px",borderRadius:10,border:"none",background:customTag.trim()?c.accent:"rgba(255,255,255,0.07)",color:customTag.trim()?"#fff":c.textMuted,fontSize:12,fontWeight:700,cursor:customTag.trim()?"pointer":"default"}}>추가</button>
      </div>
      <button onClick={function(){setShowMemo(function(v){return !v;});}} className="btn-press"
        style={{fontSize:12,color:c.accent,background:"none",border:"none",cursor:"pointer",padding:0}}>
        {showMemo?"▲ 메모 닫기":"▼ 메모 추가"}
      </button>
      {showMemo&&(
        <textarea value={slot.memo||""} onChange={function(e){onChange({...slot,memo:e.target.value});}} placeholder="메모..." rows={2}
          style={{width:"100%",marginTop:8,background:c.memoBg,border:"1px solid "+c.inputBord,borderRadius:10,padding:"10px 12px",color:c.text,fontSize:13,outline:"none",resize:"none",fontFamily:"'Noto Sans KR',sans-serif"}}/>
      )}
    </div>
  );
}

function AddView({todayCount,onAdd,onDone,c,sentences}){
  const MAX=3,remaining=Math.max(0,MAX-todayCount);
  const emptySlot=function(){return{korean:"",english:"",tags:[],memo:""};};
  const [slots,setSlots]=useState(function(){return Array.from({length:Math.min(remaining||1,MAX)},emptySlot);});
  const [syncing,setSyncing]=useState(false);
  const [saved,setSaved]=useState(false);
  function updateSlot(idx,val){setSlots(function(p){return p.map(function(s,i){return i===idx?val:s;});});}
  async function handleSave(){
    const valid=slots.filter(function(s){return s.korean.trim()&&s.english.trim();});
    if(!valid.length)return;
    setSyncing(true);
    await onAdd(valid);
    setSyncing(false);setSaved(true);
    setTimeout(function(){onDone();},900);
  }
  const canSave=slots.some(function(s){return s.korean.trim()&&s.english.trim();});
  if(remaining===0) return(
    <div style={{padding:"60px 20px",textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:12}}>🎉</div>
      <div style={{fontSize:16,fontWeight:700,color:c.accent,marginBottom:8}}>오늘 목표 달성!</div>
      <div style={{fontSize:13,color:c.textMuted}}>오늘 {MAX}문장을 모두 입력했어요</div>
    </div>
  );
  return(
    <div style={{padding:"8px 16px 0"}}>
      <div style={{background:c.surfaceHov||c.surface,border:"1px solid "+c.borderAct,borderRadius:16,padding:"14px 16px",marginBottom:16}}>
        <div style={{fontSize:13,color:c.accent,fontWeight:700,marginBottom:4}}>오늘 {todayCount}/{MAX} 문장 완료</div>
        <div style={{height:4,background:c.progressBg,borderRadius:2}}>
          <div style={{width:(todayCount/MAX*100)+"%",height:"100%",background:"linear-gradient(90deg,"+c.accent+","+c.accentB+")",borderRadius:2,transition:"width 0.3s"}}/>
        </div>
      </div>
      {slots.map(function(slot,idx){return(<SlotForm key={idx} idx={idx} slot={slot} onChange={function(v){updateSlot(idx,v);}} c={c}/>);})}
      <button onClick={handleSave} disabled={syncing} className="btn-press"
        style={{width:"100%",padding:"16px",borderRadius:16,border:"none",
          background:canSave?"linear-gradient(135deg,"+c.accent+","+c.accentB+")":c.saveDis,
          color:canSave?"#fff":c.saveDisTxt,fontSize:16,fontWeight:900,
          cursor:canSave&&!syncing?"pointer":"default",marginTop:4,marginBottom:20}}>
        {syncing?"📤 저장 중...":saved?"✅ 저장됨!":"저장하기"}
      </button>
    </div>
  );
}

function QuizView({sentences,c}){
  const [quiz,setQuiz]=useState([]);
  const [current,setCurrent]=useState(0);
  const [show,setShow]=useState(false);
  const [answered,setAnswered]=useState(false);
  const [score,setScore]=useState(0);
  const [done,setDone]=useState(false);
  function startQuiz(){
    if(sentences.length<2){alert("문장이 2개 이상 필요해요!");return;}
    setQuiz(shuffle([...sentences]).slice(0,Math.min(5,sentences.length)));
    setCurrent(0);setShow(false);setAnswered(false);setScore(0);setDone(false);
  }
  function next(){if(current+1>=quiz.length){setDone(true);return;}setCurrent(function(c){return c+1;});setShow(false);setAnswered(false);}
  if(sentences.length<2) return(<div style={{padding:"80px 20px",textAlign:"center"}}><div style={{fontSize:48,marginBottom:16}}>🎯</div><div style={{fontSize:16,fontWeight:700,color:c.textSub}}>문장 2개 이상이 필요해요</div></div>);
  if(!quiz.length) return(
    <div style={{padding:"60px 20px",textAlign:"center"}}>
      <div style={{fontSize:48,marginBottom:16}}>🎯</div>
      <div style={{fontSize:16,fontWeight:700,color:c.text,marginBottom:8}}>문제 풀기</div>
      <div style={{fontSize:13,color:c.textMuted,marginBottom:24}}>{sentences.length}개 문장 중 랜덤 5문제</div>
      <button onClick={startQuiz} className="btn-press"
        style={{padding:"14px 32px",borderRadius:14,border:"none",background:"linear-gradient(135deg,"+c.accent+","+c.accentB+")",color:"#fff",fontSize:16,fontWeight:900,cursor:"pointer"}}>
        시작하기 🚀
      </button>
    </div>
  );
  if(done){
    const pct=Math.round(score/quiz.length*100);
    return(
      <div style={{padding:"60px 20px",textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:16}}>{pct>=80?"🏆":pct>=50?"👍":"💪"}</div>
        <div style={{fontSize:22,fontWeight:900,color:c.accent,marginBottom:8}}>{score}/{quiz.length} 정답</div>
        <div style={{fontSize:14,color:c.textMuted,marginBottom:24}}>{pct}% 정확도</div>
        <button onClick={startQuiz} className="btn-press"
          style={{padding:"14px 32px",borderRadius:14,border:"none",background:"linear-gradient(135deg,"+c.accent+","+c.accentB+")",color:"#fff",fontSize:16,fontWeight:900,cursor:"pointer"}}>
          다시 풀기 🔄
        </button>
      </div>
    );
  }
  const q=quiz[current];
  return(
    <div style={{padding:"16px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontSize:13,color:c.textMuted}}>{current+1} / {quiz.length}</div>
        <div style={{fontSize:13,fontWeight:700,color:c.accent}}>점수: {score}</div>
      </div>
      <div style={{height:4,background:c.progressBg,borderRadius:2,marginBottom:20}}>
        <div style={{width:((current+1)/quiz.length*100)+"%",height:"100%",background:"linear-gradient(90deg,"+c.accent+","+c.accentB+")",borderRadius:2}}/>
      </div>
      <div style={{background:c.surface,border:"1px solid "+c.border,borderRadius:20,padding:"24px",textAlign:"center",marginBottom:20,minHeight:120,display:"flex",flexDirection:"column",justifyContent:"center"}}>
        <div style={{fontSize:12,color:c.textMuted,marginBottom:12}}>이 한국어의 영어 표현은?</div>
        <div style={{fontSize:18,fontWeight:700,color:c.text}}>{q.korean}</div>
      </div>
      {!show&&(<button onClick={function(){setShow(true);}} className="btn-press" style={{width:"100%",padding:"14px",borderRadius:14,border:"1px solid "+c.borderAct,background:"transparent",color:c.accent,fontSize:15,fontWeight:700,cursor:"pointer",marginBottom:12}}>정답 보기 👁</button>)}
      {show&&(<div style={{background:c.ansBg,border:"1px solid "+c.ansBord,borderRadius:16,padding:"20px",textAlign:"center",marginBottom:12,animation:"fadeIn 0.3s ease"}}><div style={{fontSize:16,fontWeight:700,color:c.accentB,lineHeight:1.6}}>{q.english}</div>{q.memo?(<div style={{fontSize:12,color:c.textMuted,marginTop:8}}>{q.memo}</div>):null}</div>)}
      {show&&!answered&&(
        <div style={{display:"flex",gap:10}}>
          <button onClick={function(){setAnswered(true);}} className="btn-press" style={{flex:1,padding:"14px",borderRadius:14,border:"none",background:"rgba(239,68,68,0.15)",color:"#EF4444",fontSize:14,fontWeight:700,cursor:"pointer"}}>✗ 틀렸어요</button>
          <button onClick={function(){setAnswered(true);setScore(function(s){return s+1;});}} className="btn-press" style={{flex:1,padding:"14px",borderRadius:14,border:"none",background:"rgba(74,222,128,0.15)",color:"#4ADE80",fontSize:14,fontWeight:700,cursor:"pointer"}}>✓ 맞았어요</button>
        </div>
      )}
      {answered&&(<button onClick={next} className="btn-press" style={{width:"100%",padding:"14px",borderRadius:14,border:"none",background:"linear-gradient(135deg,"+c.accent+","+c.accentB+")",color:"#fff",fontSize:14,fontWeight:900,cursor:"pointer",marginTop:10}}>{current+1>=quiz.length?"결과 보기 🎯":"다음 문제 →"}</button>)}
    </div>
  );
}

function DialogueView({c,onAdd}){
  const emptyLine=function(){return{speaker:"A",english:"",korean:""};};
  const [phase,setPhase]=useState("home");
  const [dialogues,setDialogues]=useState(loadDialogues);
  const [title,setTitle]=useState("");
  const [lines,setLines]=useState([emptyLine(),emptyLine(),emptyLine()]);
  const [selected,setSelected]=useState(new Set());
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const [viewId,setViewId]=useState(null);
  const MAX_SEL=3;
  function updateLine(idx,field,val){setLines(function(p){return p.map(function(l,i){return i===idx?{...l,[field]:val}:l;});});}
  function toggleSpeaker(idx){updateLine(idx,"speaker",lines[idx].speaker==="A"?"B":"A");}
  function addLine(){setLines(function(p){return [...p,emptyLine()];});}
  function removeLine(idx){
    if(lines.length<=1)return;
    setLines(function(p){return p.filter(function(_,i){return i!==idx;});});
    setSelected(function(p){const n=new Set();p.forEach(function(i){if(i<idx)n.add(i);else if(i>idx)n.add(i-1);});return n;});
  }
  function goSelect(){if(!lines.some(function(l){return l.english.trim();}))return;setSelected(new Set());setPhase("select");}
  function toggleSel(idx){
    setSelected(function(prev){
      const n=new Set(prev);
      if(n.has(idx))n.delete(idx);
      else{if(n.size>=MAX_SEL)return prev;n.add(idx);}
      return n;
    });
  }
  function delDialogue(id){const u=dialogues.filter(function(d){return d.id!==id;});setDialogues(u);saveDialogues(u);}
  async function handleSave(){
    if(!selected.size)return;
    setSaving(true);
    const date=new Date().toISOString().split("T")[0];
    const newSet={id:Date.now(),date,title:title.trim()||"대화문",lines:lines.filter(function(l){return l.english.trim();})};
    const updated=[newSet,...dialogues];
    setDialogues(updated);saveDialogues(updated);
    const items=[...selected].map(function(i){
      return{id:Date.now()+Math.random(),date,english:lines[i].english.trim(),korean:lines[i].korean.trim(),
        tags:["대화문"].concat(title.trim()?[title.trim()]:[]),memo:lines[i].speaker+" · "+(title.trim()||"회화"),reviewed:false};
    });
    await onAdd(items);
    setSaving(false);setSaved(true);
    setTimeout(function(){setSaved(false);setSelected(new Set());setLines([emptyLine(),emptyLine(),emptyLine()]);setTitle("");setPhase("home");},1800);
  }
  const iBase={background:"transparent",border:"none",outline:"none",color:c.text,fontSize:13,resize:"none",lineHeight:1.7,width:"100%",fontFamily:"'Noto Sans KR',sans-serif"};

  if(phase==="home") return(
    <div style={{padding:"8px 16px 0"}}>
      <button onClick={function(){setPhase("input");}} className="btn-press"
        style={{width:"100%",padding:"14px",borderRadius:14,border:"none",marginBottom:20,background:"linear-gradient(135deg,"+c.accent+","+c.accentB+")",color:"#fff",fontSize:15,fontWeight:900,cursor:"pointer"}}>
        ✏️ 새 대화문 입력
      </button>
      {dialogues.length===0?(
        <div style={{textAlign:"center",padding:"60px 20px"}}>
          <div style={{fontSize:40,marginBottom:12}}>💬</div>
          <div style={{fontSize:14,color:c.textSub,fontWeight:700,marginBottom:6}}>아직 저장된 대화문이 없어요</div>
          <div style={{fontSize:12,color:c.textMuted}}>위 버튼으로 첫 대화문을 입력해보세요</div>
        </div>
      ):(
        <div>
          <div style={{fontSize:11,color:c.textMuted,letterSpacing:2,marginBottom:10}}>저장된 대화문 ({dialogues.length})</div>
          {dialogues.map(function(d){
            return(
              <div key={d.id} style={{background:c.surface,border:"1px solid "+c.border,borderRadius:16,marginBottom:12,overflow:"hidden",boxShadow:c.shadow}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",cursor:"pointer"}} onClick={function(){setViewId(viewId===d.id?null:d.id);}}>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:c.text}}>{d.title}</div>
                    <div style={{fontSize:11,color:c.textMuted,marginTop:2}}>{d.date} · {d.lines.length}줄</div>
                  </div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <button onClick={function(e){e.stopPropagation();delDialogue(d.id);}} className="btn-press"
                      style={{width:28,height:28,borderRadius:"50%",border:"none",background:c.delBg,color:"#EF4444",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>x</button>
                    <span style={{color:c.textMuted,fontSize:16}}>{viewId===d.id?"▲":"▼"}</span>
                  </div>
                </div>
                {viewId===d.id&&(
                  <div style={{borderTop:"1px solid "+c.border,padding:"12px 16px"}}>
                    {d.lines.map(function(l,i){
                      const isA=l.speaker==="A";
                      return(
                        <div key={i} style={{display:"flex",flexDirection:"column",alignItems:isA?"flex-start":"flex-end",marginBottom:8}}>
                          <div style={{maxWidth:"84%",padding:"9px 13px",borderRadius:isA?"4px 14px 14px 14px":"14px 4px 14px 14px",background:isA?c.surfaceHov:c.inputBg,border:"1px solid "+c.border}}>
                            <div style={{fontSize:10,color:isA?c.accent:c.accentB,fontWeight:700,marginBottom:4}}>{l.speaker}</div>
                            <div style={{fontSize:13,fontWeight:600,color:isA?c.text:c.accentB,fontStyle:isA?"normal":"italic",lineHeight:1.6,marginBottom:3}}>{l.english}</div>
                            {l.korean?(<div style={{fontSize:12,color:c.textMuted}}>{l.korean}</div>):null}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );

  if(phase==="input") return(
    <div style={{padding:"8px 16px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <button onClick={function(){setPhase("home");}} className="btn-press"
          style={{padding:"7px 12px",borderRadius:10,border:"1px solid "+c.border,background:c.surface,color:c.textSub,fontSize:12,fontWeight:700,cursor:"pointer"}}>
          ← 목록
        </button>
        <div style={{fontSize:13,fontWeight:700,color:c.accent}}>대화문 입력</div>
        <div style={{width:60}}/>
      </div>
      <div style={{background:c.surface,border:"1px solid "+c.border,borderRadius:14,padding:"12px 16px",marginBottom:14}}>
        <div style={{fontSize:10,color:c.textMuted,letterSpacing:1,marginBottom:6}}>📌 주제 / 출처 (선택)</div>
        <input value={title} onChange={function(e){setTitle(e.target.value);}} placeholder="예: 카페에서 주문하기"
          style={{background:"transparent",border:"none",outline:"none",color:c.text,fontSize:14,width:"100%",fontFamily:"'Noto Sans KR',sans-serif"}}/>
      </div>
      {lines.map(function(line,idx){
        const isA=line.speaker==="A";
        return(
          <div key={idx} style={{display:"flex",gap:8,marginBottom:10,flexDirection:isA?"row":"row-reverse",animation:"fadeUp 0.18s ease both"}}>
            <button onClick={function(){toggleSpeaker(idx);}} className="btn-press"
              style={{flexShrink:0,width:34,height:34,borderRadius:"50%",border:"none",cursor:"pointer",marginTop:8,background:"linear-gradient(135deg,"+(isA?c.accent:c.accentB)+","+(isA?c.accentB:c.accent)+")",color:"#fff",fontSize:12,fontWeight:900}}>
              {line.speaker}
            </button>
            <div style={{flex:1,background:c.surface,border:"1px solid "+c.border,borderRadius:isA?"4px 14px 14px 14px":"14px 4px 14px 14px",padding:"10px 12px",boxShadow:c.shadow}}>
              <textarea value={line.english} onChange={function(e){updateLine(idx,"english",e.target.value);}} placeholder="English sentence..." rows={2}
                style={{...iBase,color:isA?c.text:c.accentB,fontStyle:isA?"normal":"italic",marginBottom:6}}/>
              <div style={{height:1,background:c.border,marginBottom:6}}/>
              <textarea value={line.korean} onChange={function(e){updateLine(idx,"korean",e.target.value);}} placeholder="한국어 뜻..." rows={1}
                style={{...iBase,color:c.textMuted,fontSize:12}}/>
            </div>
            {lines.length>1&&(<button onClick={function(){removeLine(idx);}} className="btn-press"
              style={{flexShrink:0,width:28,height:28,borderRadius:"50%",border:"none",background:c.delBg,color:"#EF4444",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",marginTop:11}}>x</button>)}
          </div>
        );
      })}
      <button onClick={addLine} className="btn-press"
        style={{width:"100%",padding:"12px",borderRadius:12,border:"1px dashed "+c.borderAct,background:"transparent",color:c.accent,fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:14}}>
        + 대화 추가
      </button>
      <button onClick={goSelect} disabled={!lines.some(function(l){return l.english.trim();})} className="btn-press"
        style={{width:"100%",padding:"16px",borderRadius:16,border:"none",marginBottom:24,
          background:lines.some(function(l){return l.english.trim();})?"linear-gradient(135deg,"+c.accent+","+c.accentB+")":c.saveDis,
          color:lines.some(function(l){return l.english.trim();})?"#fff":c.saveDisTxt,
          fontSize:16,fontWeight:900,cursor:lines.some(function(l){return l.english.trim();})?"pointer":"default"}}>
        외울 문장 고르기 →
      </button>
    </div>
  );

  const validIdx=lines.reduce(function(acc,l,i){if(l.english.trim())acc.push(i);return acc;},[]);
  return(
    <div style={{padding:"8px 16px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div>
          {title?(<div style={{fontSize:13,fontWeight:700,color:c.text,marginBottom:2}}>{title}</div>):null}
          <div style={{fontSize:11,color:c.textMuted}}>{selected.size}/{MAX_SEL}개 선택 · 최대 3개</div>
        </div>
        <button onClick={function(){setPhase("input");}} className="btn-press"
          style={{padding:"7px 12px",borderRadius:10,border:"1px solid "+c.border,background:c.surface,color:c.textSub,fontSize:12,fontWeight:700,cursor:"pointer"}}>
          ← 수정
        </button>
      </div>
      <div style={{background:"rgba(167,139,250,0.07)",border:"1px solid rgba(167,139,250,0.2)",borderRadius:12,padding:"10px 14px",marginBottom:14,fontSize:12,color:c.accent}}>
        💡 외우고 싶은 문장을 탭해서 선택하세요 (최대 3개)
      </div>
      <div style={{marginBottom:16}}>
        {validIdx.map(function(origIdx,vi){
          const line=lines[origIdx],isA=line.speaker==="A",isSel=selected.has(origIdx);
          return(
            <div key={origIdx} onClick={function(){toggleSel(origIdx);}
              } style={{display:"flex",flexDirection:"column",alignItems:isA?"flex-start":"flex-end",marginBottom:10,cursor:"pointer",animation:"fadeUp 0.2s "+(vi*0.04)+"s both"}}>
              <div style={{maxWidth:"84%",padding:"11px 14px",borderRadius:isA?"4px 16px 16px 16px":"16px 4px 16px 16px",
                background:isSel?"linear-gradient(135deg,"+c.accent+"22,"+c.accentB+"22)":(isA?c.surface:c.inputBg),
                border:"2px solid "+(isSel?c.accent:c.border),
                boxShadow:isSel?"0 0 0 3px "+c.accent+"33":"none",transition:"all 0.15s",position:"relative"}}>
                {isSel&&(<div style={{position:"absolute",top:-8,right:-8,width:20,height:20,borderRadius:"50%",background:c.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#fff",fontWeight:900,boxShadow:"0 2px 6px rgba(0,0,0,0.3)"}}>{[...selected].indexOf(origIdx)+1}</div>)}
                <div style={{fontSize:10,color:isA?c.accent:c.accentB,fontWeight:700,marginBottom:4,letterSpacing:1}}>{line.speaker}</div>
                <div style={{fontSize:14,fontWeight:600,lineHeight:1.6,marginBottom:3,color:isA?c.text:c.accentB,fontStyle:isA?"normal":"italic"}}>{line.english}</div>
                {line.korean?(<div style={{fontSize:12,color:c.textMuted}}>{line.korean}</div>):null}
              </div>
            </div>
          );
        })}
      </div>
      {saved?(<div style={{textAlign:"center",padding:"16px",fontSize:15,fontWeight:700,color:c.accentB}}>✅ {selected.size}개 문장이 저장됐어요!</div>):(
        <button onClick={handleSave} disabled={!selected.size||saving} className="btn-press"
          style={{width:"100%",padding:"16px",borderRadius:16,border:"none",marginBottom:12,
            background:selected.size?"linear-gradient(135deg,"+c.accent+","+c.accentB+")":c.saveDis,
            color:selected.size?"#fff":c.saveDisTxt,fontSize:16,fontWeight:900,
            cursor:selected.size&&!saving?"pointer":"default",transition:"background 0.2s"}}>
          {saving?"📤 저장 중...":selected.size+"개 문장 암기장에 저장"}
        </button>
      )}
      <button onClick={function(){setPhase("home");}} className="btn-press"
        style={{width:"100%",padding:"13px",borderRadius:14,border:"1px solid "+c.borderAct,background:"transparent",color:c.accent,fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:24}}>
        ← 대화문 목록으로
      </button>
    </div>
  );
}

function SettingsView({c,notionCfg,setNotionCfg}){
  const [apiKey,setApiKey]=useState(notionCfg.apiKey||"");
  const [dbId,setDbId]=useState(notionCfg.dbId||"");
  const [enabled,setEnabled]=useState(notionCfg.enabled||false);
  const [saved,setSaved]=useState(false);
  const [testing,setTesting]=useState(false);
  const [testMsg,setTestMsg]=useState(null);
  function applyAndSave(en,ak,di){const cfg={apiKey:(ak||apiKey).trim(),dbId:(di||dbId).trim(),enabled:en};setNotionCfg(cfg);saveNotion(cfg);}
  function handleSave(){const cfg={apiKey:apiKey.trim(),dbId:dbId.trim(),enabled};setNotionCfg(cfg);saveNotion(cfg);setSaved(true);setTimeout(function(){setSaved(false);},2000);}
  async function handleTest(){
    setTesting(true);setTestMsg(null);
    try{
      await sendToNotion({english:"Test sentence.",korean:"테스트",tags:["테스트"],memo:"연동확인",date:new Date().toISOString().split("T")[0],reviewed:false},{apiKey:apiKey.trim(),dbId:dbId.trim()});
      setTestMsg({ok:true,text:"✅ 노션에 테스트 항목이 추가됐어요!"});
    }catch(e){setTestMsg({ok:false,text:"❌ "+e.message});}
    setTesting(false);
  }
  const inp={width:"100%",background:c.inputBg,border:"1px solid "+c.inputBord,borderRadius:12,padding:"12px 14px",color:c.text,fontSize:13,outline:"none",fontFamily:"'Noto Sans KR',sans-serif",marginTop:6};
  return(
    <div style={{padding:"16px 16px 0"}}>
      <div style={{background:"rgba(167,139,250,0.08)",border:"1px solid rgba(167,139,250,0.2)",borderRadius:16,padding:"16px",marginBottom:20}}>
        <div style={{fontSize:13,fontWeight:700,color:c.accent,marginBottom:8}}>🔗 노션(Notion) 연동 설정</div>
        <div style={{padding:"10px 12px",background:c.surface,borderRadius:10,fontSize:11,color:c.textMuted,lineHeight:2}}>
          1️⃣ <a href="https://www.notion.com/my-integrations" target="_blank" style={{color:c.accent}}>노션 인테그레이션</a> 생성 후 API 키 복사<br/>
          2️⃣ DB 페이지 → ··· → Connections → 인테그레이션 연결<br/>
          3️⃣ DB URL의 32자리 ID 복사<br/>
          4️⃣ DB 컬럼: <span style={{color:c.accent}}>영어문장(Title) · 한글뜻(Text) · 태그(Multi-select) · 메모(Text) · 날짜(Date) · 복습완료(Checkbox)</span>
        </div>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:c.surface,border:"1px solid "+c.border,borderRadius:14,padding:"14px 16px",marginBottom:14}}>
        <div>
          <div style={{fontSize:14,fontWeight:700,color:c.text}}>노션 자동 저장</div>
          <div style={{fontSize:11,color:c.textMuted,marginTop:2}}>저장 시 노션 DB에 자동 추가</div>
        </div>
        <button onClick={function(){const next=!enabled;setEnabled(next);applyAndSave(next,apiKey,dbId);}} className="btn-press"
          style={{width:48,height:26,borderRadius:13,border:"none",cursor:"pointer",background:enabled?c.accent:"rgba(255,255,255,0.1)",position:"relative",transition:"background 0.2s"}}>
          <div style={{position:"absolute",top:3,left:enabled?26:3,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"left 0.2s",boxShadow:"0 1px 4px rgba(0,0,0,0.3)"}}/>
        </button>
      </div>
      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,color:c.textMuted,letterSpacing:1}}>🔑 Notion API Key</div>
        <input type="password" value={apiKey} onChange={function(e){setApiKey(e.target.value);}} onBlur={function(){applyAndSave(enabled,apiKey,dbId);}} placeholder="secret_xxxxxxxxxxxxxxxxxxxx" style={inp}/>
      </div>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:11,color:c.textMuted,letterSpacing:1}}>🗄️ Database ID</div>
        <input type="text" value={dbId} onChange={function(e){setDbId(e.target.value);}} onBlur={function(){applyAndSave(enabled,apiKey,dbId);}} placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" style={inp}/>
      </div>
      {testMsg&&(<div style={{padding:"10px 14px",borderRadius:10,marginBottom:12,fontSize:12,background:testMsg.ok?"rgba(74,222,128,0.1)":"rgba(239,68,68,0.1)",color:testMsg.ok?"#4ADE80":"#EF4444",border:"1px solid "+(testMsg.ok?"rgba(74,222,128,0.3)":"rgba(239,68,68,0.3)")}}>{testMsg.text}</div>)}
      <div style={{display:"flex",gap:10,marginBottom:16}}>
        <button onClick={handleTest} disabled={testing||!apiKey.trim()||!dbId.trim()} className="btn-press"
          style={{flex:1,padding:"14px",borderRadius:14,border:"1px solid "+c.borderAct,background:"transparent",color:c.accent,fontSize:14,fontWeight:700,cursor:apiKey.trim()&&dbId.trim()?"pointer":"default",opacity:apiKey.trim()&&dbId.trim()?1:0.4}}>
          {testing?"전송 중...":"🧪 테스트 전송"}
        </button>
        <button onClick={handleSave} className="btn-press"
          style={{flex:1,padding:"14px",borderRadius:14,border:"none",background:saved?"linear-gradient(135deg,#4ADE80,#22C55E)":"linear-gradient(135deg,"+c.accent+","+c.accentB+")",color:"#fff",fontSize:14,fontWeight:900,cursor:"pointer"}}>
          {saved?"✅ 저장됨!":"설정 저장"}
        </button>
      </div>
      <div style={{padding:"12px 14px",borderRadius:12,background:"rgba(96,165,250,0.07)",border:"1px solid rgba(96,165,250,0.2)",fontSize:12,color:c.textSub,lineHeight:1.9,marginBottom:20}}>
        📱 <strong style={{color:c.accentB}}>아이폰 사파리</strong> 설정 저장 후 아래 URL 복사 → 북마크 저장하면 새로고침해도 유지돼요.
        <button onClick={function(){try{navigator.clipboard.writeText(window.location.href);alert("✅ URL 복사됐어요! 북마크로 저장하세요.");}catch{prompt("이 URL을 북마크로 저장하세요:",window.location.href);}}} className="btn-press"
          style={{display:"block",width:"100%",marginTop:10,padding:"10px",borderRadius:10,border:"1px solid rgba(96,165,250,0.4)",background:"rgba(96,165,250,0.1)",color:c.accentB,fontSize:13,fontWeight:700,cursor:"pointer"}}>
          🔗 현재 URL 복사 (북마크용)
        </button>
      </div>
    </div>
  );
}

function BottomTabs({tab,setTab,c}){
  const tabs=[
    {id:"list",label:"목록",Icon:IBook},
    {id:"add",label:"입력",Icon:IPencil},
    {id:"dialogue",label:"대화문",Icon:IChat},
    {id:"quiz",label:"퀴즈",Icon:IPlay},
    {id:"settings",label:"설정",Icon:IGear}
  ];
  return(
    <div style={{position:"fixed",bottom:0,left:0,right:0,background:c.tabBg,borderTop:"1px solid "+c.tabBorder,display:"flex",paddingBottom:"env(safe-area-inset-bottom)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",zIndex:100}}>
      {tabs.map(function(t){
        const active=tab===t.id;
        return(
          <button key={t.id} onClick={function(){setTab(t.id);}} className="tab-btn"
            style={{flex:1,padding:"10px 0 8px",border:"none",background:"transparent",color:active?c.accent:c.tabInact,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <t.Icon/>
            <span style={{fontSize:10,fontWeight:active?700:400}}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function AppRoot(){
  const [tab,setTab]=useState("list");
  const [sentences,setSentences]=useState(load);
  const [theme,setTheme]=useState(loadTheme);
  const [notionCfg,setNotionCfg]=useState(loadNotion);
  const c=theme==="dark"?DARK:LIGHT;
  const todayKey=new Date().toISOString().split("T")[0];
  const todayCount=sentences.filter(function(s){return s.date===todayKey;}).length;
  useEffect(function(){document.body.style.background=c.bg;},[theme]);
  function toggleTheme(){const n=theme==="dark"?"light":"dark";setTheme(n);saveTheme(n);}
  async function addSentences(items){
    const date=new Date().toISOString().split("T")[0];
    const withDate=items.map(function(s){return{date:date,reviewed:false,...s,id:s.id||Date.now()+Math.random()};});
    const u=[...sentences,...withDate];setSentences(u);save(u);
    if(notionCfg.enabled&&notionCfg.apiKey&&notionCfg.dbId){
      for(let i=0;i<withDate.length;i++){
        try{await sendToNotion(withDate[i],notionCfg);}catch(e){console.warn("Notion:",e.message);}
      }
    }
  }
  function deleteSentence(id){const u=sentences.filter(function(s){return s.id!==id;});setSentences(u);save(u);}
  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:c.bg,color:c.text,transition:"background 0.25s,color 0.25s"}}>
      <Header tab={tab} todayCount={todayCount} total={sentences.length} c={c} theme={theme} onToggle={toggleTheme}
        onExport={function(){exportToExcel(sentences);}} hasData={sentences.length>0} notionEnabled={notionCfg.enabled}/>
      <div style={{flex:1,overflowY:"auto",paddingBottom:90}}>
        {tab==="list"&&<ListView sentences={sentences} onDelete={deleteSentence} todayKey={todayKey} c={c}/>}
        {tab==="add"&&<AddView todayCount={todayCount} onAdd={addSentences} onDone={function(){setTab("list");}} c={c} sentences={sentences}/>}
        {tab==="dialogue"&&<DialogueView c={c} onAdd={addSentences}/>}
        {tab==="quiz"&&<QuizView sentences={sentences} c={c}/>}
        {tab==="settings"&&<SettingsView c={c} notionCfg={notionCfg} setNotionCfg={function(cfg){setNotionCfg(cfg);saveNotion(cfg);}}/>}
      </div>
      <BottomTabs tab={tab} setTab={setTab} c={c}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppRoot/>);
</script>
</body>
</html>
